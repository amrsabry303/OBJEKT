<text x="30.00" y="69.00" font-size="2.3" text-anchor="start" font-weight="400" fill="#111" font-family="Helvetica, Arial, sans-serif">Pattern only: 8 printed parts, 18 dowels D8 x 44, filler, primer</text>
<text x="240.00" y="69.00" font-size="2.3" text-anchor="start" font-weight="400" fill="#111" font-family="Helvetica, Arial, sans-serif">1 set</text>
<text x="405.00" y="69.00" font-size="2.2" text-anchor="end" font-weight="400" fill="#111" font-family="'DejaVu Sans', Arial, sans-serif">للنموذج فقط: ٨ أجزاء مطبوعة و١٨ وتد</text>
<text x="12.00" y="85.00" font-size="2.9" text-anchor="start" font-weight="700" fill="#111" font-family="Helvetica, Arial, sans-serif">NOTES</text>
<text x="408.00" y="85.00" font-size="2.8" text-anchor="end" font-weight="700" fill="#111" font-family="'DejaVu Sans', Arial, sans-serif">ملاحظات</text>
<line x1="12.00" y1="86.40" x2="408.00" y2="86.40" stroke="#111" stroke-width="0.25"/>
<text x="12.00" y="93.00" font-size="2.6" text-anchor="start" font-weight="700" fill="#111" font-family="Helvetica, Arial, sans-serif">1</text>
<text x="408.00" y="93.00" font-size="2.6" text-anchor="end" font-weight="700" fill="#111" font-family="Helvetica, Arial, sans-serif">1</text>
<text x="20.00" y="93.00" font-size="2.25" text-anchor="start" font-weight="400" fill="#111" font-family="Helvetica, Arial, sans-serif">Dimensions in mm. Overall 1829 x 686 x 406 and the cushion 1595 x 488 x 84 R81 are from the supplied tear sheet (Riva bench, Carlyle Collective).</text>
<text x="400.00" y="96.40" font-size="2.15" text-anchor="end" font-weight="400" fill="#111" font-family="'DejaVu Sans', Arial, sans-serif">الأبعاد بالمليمتر. المقاسات الكلية ومقاسات المرتبة من ورقة المرجع المرفقة.</text>
<text x="12.00" y="103.50" font-size="2.6" text-anchor="start" font-weight="700" fill="#111" font-family="Helvetica, Arial, sans-serif">2</text>
<text x="408.00" y="103.50" font-size="2.6" text-anchor="end" font-weight="700" fill="#111" font-family="Helvetica, Arial, sans-serif">2</text>
<text x="20.00" y="103.50" font-size="2.25" text-anchor="start" font-weight="400" fill="#111" font-family="Helvetica, Arial, sans-serif">Shape and all other sizes are traced from the tear sheet's scaled drawings and photos: approximate, +-10 mm. Production measures and corrects.</text>
<text x="400.00" y="106.90" font-size="2.15" text-anchor="end" font-weight="400" fill="#111" font-family="'DejaVu Sans', Arial, sans-serif">الشكل وباقي المقاسات مأخوذة تقريبًا من رسومات وصور المرجع ±١٠ مم. الإنتاج يراجع ويصحح.</text>
<text x="12.00" y="114.00" font-size="2.6" text-anchor="start" font-weight="700" fill="#111" font-family="Helvetica, Arial, sans-serif">3</text>
<text x="408.00" y="114.00" font-size="2.6" text-anchor="end" font-weight="700" fill="#111" font-family="Helvetica, Arial, sans-serif">3</text>
<text x="20.00" y="114.00" font-size="2.25" text-anchor="start" font-weight="400" fill="#111" font-family="Helvetica, Arial, sans-serif">Drawn exact to the reference by default (standing rule). The reference is another maker's product; the design is not ours. Sabry to confirm use.</text>
<text x="400.00" y="117.40" font-size="2.15" text-anchor="end" font-weight="400" fill="#111" font-family="'DejaVu Sans', Arial, sans-serif">مرسوم مطابقًا للمرجع حسب القاعدة. المرجع منتج لمصمم آخر وليس تصميمنا؛ يؤكد سبري الاستخدام.</text>
<text x="12.00" y="124.50" font-size="2.6" text-anchor="start" font-weight="700" fill="#111" font-family="Helvetica, Arial, sans-serif">4</text>
<text x="408.00" y="124.50" font-size="2.6" text-anchor="end" font-weight="700" fill="#111" font-family="Helvetica, Arial, sans-serif">4</text>
<text x="20.00" y="124.50" font-size="2.25" text-anchor="start" font-weight="400" fill="#111" font-family="Helvetica, Arial, sans-serif">Process (proposal): 3D print the frame as a pattern, finish it, take a mould, lay up GRP. Wall, layup, reinforcement and mould split by Production.</text>
<text x="400.00" y="127.90" font-size="2.15" text-anchor="end" font-weight="400" fill="#111" font-family="'DejaVu Sans', Arial, sans-serif">طريقة التصنيع (مقترح): طباعة النموذج ثم صنع القالب ثم صب الفايبر جلاس. التفاصيل حسب الإنتاج.</text>
<text x="12.00" y="135.00" font-size="2.6" text-anchor="start" font-weight="700" fill="#111" font-family="Helvetica, Arial, sans-serif">5</text>
<text x="408.00" y="135.00" font-size="2.6" text-anchor="end" font-weight="700" fill="#111" font-family="Helvetica, Arial, sans-serif">5</text>
<text x="20.00" y="135.00" font-size="2.25" text-anchor="start" font-weight="400" fill="#111" font-family="Helvetica, Arial, sans-serif">Finish: Chocolate (#4A2A1B, unconfirmed) Duco high gloss, as the reference's deep brown lacquer. Paint system and codes to follow.</text>
<text x="400.00" y="138.40" font-size="2.15" text-anchor="end" font-weight="400" fill="#111" font-family="'DejaVu Sans', Arial, sans-serif">التشطيب: شوكولاتة دوكو لامع جدًا كالمرجع. نظام الدهان والأكواد لاحقًا.</text>
<text x="12.00" y="145.50" font-size="2.6" text-anchor="start" font-weight="700" fill="#111" font-family="Helvetica, Arial, sans-serif">6</text>
<text x="408.00" y="145.50" font-size="2.6" text-anchor="end" font-weight="700" fill="#111" font-family="Helvetica, Arial, sans-serif">6</text>
<text x="20.00" y="145.50" font-size="2.25" text-anchor="start" font-weight="400" fill="#111" font-family="Helvetica, Arial, sans-serif">Not engineered. No load, stability or strength check has been made. Production to advise on reinforcement before a prototype.</text>
<text x="400.00" y="148.90" font-size="2.15" text-anchor="end" font-weight="400" fill="#111" font-family="'DejaVu Sans', Arial, sans-serif">غير مُصمَّم هندسيًا. لم يتم فحص التحمل أو الثبات. الإنتاج ينصح بالتقوية قبل النموذج الأولي.</text>
<text x="12.00" y="156.00" font-size="2.6" text-anchor="start" font-weight="700" fill="#111" font-family="Helvetica, Arial, sans-serif">7</text>
<text x="408.00" y="156.00" font-size="2.6" text-anchor="end" font-weight="700" fill="#111" font-family="Helvetica, Arial, sans-serif">7</text>
<text x="20.00" y="156.00" font-size="2.25" text-anchor="start" font-weight="400" fill="#111" font-family="Helvetica, Arial, sans-serif">Files: frame one-piece STL, 8 print-part STLs (Z up, mm), DXF outlines of views and sections, cushion board DXF, model and drawing generators.</text>
<text x="400.00" y="159.40" font-size="2.15" text-anchor="end" font-weight="400" fill="#111" font-family="'DejaVu Sans', Arial, sans-serif">الملفات: STL للهيكل كاملًا و٨ أجزاء، DXF للمساقط والقطاعات ولوح المرتبة.</text>
<text x="12.00" y="166.50" font-size="2.6" text-anchor="start" font-weight="700" fill="#111" font-family="Helvetica, Arial, sans-serif">8</text>
<text x="408.00" y="166.50" font-size="2.6" text-anchor="end" font-weight="700" fill="#111" font-family="Helvetica, Arial, sans-serif">8</text>
<text x="20.00" y="166.50" font-size="2.25" text-anchor="start" font-weight="400" fill="#111" font-family="Helvetica, Arial, sans-serif">Arabic text is a draft for a technical reader to check before the factory sees it.</text>
<text x="400.00" y="169.90" font-size="2.15" text-anchor="end" font-weight="400" fill="#111" font-family="'DejaVu Sans', Arial, sans-serif">النص العربي مسودة يراجعها فني قبل إرسالها للمصنع.</text>
