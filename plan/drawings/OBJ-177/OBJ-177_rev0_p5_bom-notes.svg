<text x="413.00" y="246.00" font-size="2.1" text-anchor="end" font-weight="700" fill="#111" font-family="Helvetica, Arial, sans-serif">Draft. Not approved. Not engineered. Shape and most sizes traced from the reference</text>
<text x="413.00" y="249.00" font-size="2.0" text-anchor="end" font-weight="700" fill="#111" font-family="'DejaVu Sans', Arial, sans-serif">مسودة. غير معتمدة. الشكل ومعظم المقاسات مأخوذة من المرجع تقريبًا</text>
