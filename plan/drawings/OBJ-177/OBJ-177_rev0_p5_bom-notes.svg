<text x="30.00" y="31.50" font-size="2.3" text-anchor="start" font-weight="400" fill="#111" font-family="Helvetica, Arial, sans-serif">Frame, one moulded piece: GRP shell from a mould taken off the printed pattern (proposal)</text>
