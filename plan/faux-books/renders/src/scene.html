<!doctype html><html><body style="margin:0;background:#E1D9CF">
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const META = await (await fetch('meta.json')).json();
const loadImg = src => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = src; });
function tex(canvas, aniso=8){ const t = new THREE.CanvasTexture(canvas); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = aniso; return t; }
function noiseCanvas(size, base, amp, seed=1){
  const c = document.createElement('canvas'); c.width = c.height = size; const g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0,0,size,size);
  let s = seed; const rnd = () => (s = (s*16807)%2147483647)/2147483647;
  for (let i=0;i<9000;i++){ { const k = rnd()<.5?60:255; g.fillStyle = `rgba(${k},${k-4},${k-10},${amp*rnd()})`; } const r = 1+rnd()*6; g.fillRect(rnd()*size, rnd()*size, r, r); }
  for (let i=0;i<30;i++){ const cx=rnd()*size, cy=rnd()*size, rr=size*(.1+rnd()*.25); const grd = g.createRadialGradient(cx,cy,0,cx,cy,rr); const k=rnd()<.5?90:255; grd.addColorStop(0,`rgba(${k},${k-6},${k-14},${.05+rnd()*.05})`); grd.addColorStop(1,`rgba(${k},${k-6},${k-14},0)`); g.fillStyle=grd; g.fillRect(0,0,size,size); }
  return c;
}
async function bookTextures(m){
  const img = await loadImg(`tex/tex_${String(m.n).padStart(2,'0')}.png`);
  const pw = img.width/(2*m.Wmm+m.Dmm); // px per mm
  const crop = (x0,wmm) => { const c = document.createElement('canvas'); c.width = Math.round(wmm*pw); c.height = img.height; c.getContext('2d').drawImage(img, x0*pw, 0, wmm*pw, img.height, 0, 0, c.width, c.height); return c; };
  return { back: tex(crop(0,m.Wmm)), spine: tex(crop(m.Wmm,m.Dmm)), front: tex(crop(m.Wmm+m.Dmm,m.Wmm)) };
}
function pagesTex(){ const c = document.createElement('canvas'); c.width = c.height = 512; const g = c.getContext('2d'); g.fillStyle = '#ECE7DB'; g.fillRect(0,0,512,512);
  for (let y=0;y<512;y+=3){ g.fillStyle = `rgba(90,80,60,${.05+.05*Math.random()})`; g.fillRect(0,y,512,1); } const t = tex(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t; }
function makeBook(m, T, pages){
  const W=m.W,H=m.H,D=m.D,t=.3; const g = new THREE.Group();
  const cov = new THREE.MeshStandardMaterial({color:m.cover, roughness:.92, metalness:0});
  const face = (map) => new THREE.MeshStandardMaterial({map, roughness:.9, metalness:0});
  const pg = new THREE.MeshStandardMaterial({map:pages, roughness:.95});
  const add = (geo, mats, x,y,z) => { const me = new THREE.Mesh(geo, mats); me.position.set(x,y,z); me.castShadow = me.receiveShadow = true; g.add(me); return me; };
  add(new THREE.BoxGeometry(W,H,t), [cov,cov,cov,cov,cov,face(T.back)], 0,0,-D/2+t/2);
  add(new THREE.BoxGeometry(W,H,t), [cov,cov,cov,cov,face(T.front),cov], 0,0,D/2-t/2);
  const st = T.spine.clone(); st.needsUpdate = true; st.repeat.set((D-2*t)/D,1); st.offset.set(t/D,0);
  add(new THREE.BoxGeometry(t,H,D-2*t), [cov,face(st),cov,cov,cov,cov], -W/2+t/2,0,0);
  const pw = W-t-.25; add(new THREE.BoxGeometry(pw,H-.7,D-2*t), [pg,pg,pg,pg,pg,pg], (t-.25)/2,0,0);

}
function vase(h, r, mat){ const pts=[]; const prof=[[0,0],[.55,0],[.8,.12],[.95,.4],[.8,.7],[.5,.9],[.38,1],[.42,1.06],[.3,1.06],[0,1.0]]; // lathe profile
  const crv = new THREE.SplineCurve(prof.map(([a,b])=>new THREE.Vector2(a*r,b*h))); for (const p of crv.getPoints(48)) pts.push(new THREE.Vector2(Math.max(0,p.x),p.y)); const me = new THREE.Mesh(new THREE.LatheGeometry(pts, 64), mat); me.castShadow = me.receiveShadow = true; return me; }
window.renderScene = async (cfg) => {
  const SC = cfg.s||1, W = 1600*SC, H = 2000*SC; document.body.innerHTML = '';
  const renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true}); renderer.setSize(W,H); renderer.setPixelRatio(1);
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; renderer.toneMapping = THREE.NoToneMapping; renderer.toneMappingExposure = 1;
  renderer.outputColorSpace = THREE.SRGBColorSpace; document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene(); scene.background = new THREE.Color('#E1D9CF');
  // plaster
  const wallC = noiseCanvas(1024,'#E1D9CF',.05,3); const wt = tex(wallC); wt.wrapS = wt.wrapT = THREE.RepeatWrapping; wt.repeat.set(4,4);
  const wallM = new THREE.MeshStandardMaterial({map:wt, bumpMap:wt, bumpScale:.8, roughness:.98});
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(600,600), wallM); floor.rotation.x = -Math.PI/2; floor.receiveShadow = true; scene.add(floor);
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(600,300), wallM); wall.position.set(0,150,-60); wall.receiveShadow = true; scene.add(wall);
  scene.add(new THREE.HemisphereLight(0xffffff, 0xf3ece0, 2.15));
  // low window sun through a window opening
  const target = new THREE.Vector3(0, 14, -8); const dir = new THREE.Vector3(...(cfg.sun||[.8,.42,.5])).normalize();
  const sun = new THREE.DirectionalLight(0xfff3e2, 1.3); sun.position.copy(target).addScaledVector(dir, 220); sun.target.position.copy(target); scene.add(sun, sun.target);
  sun.castShadow = true; sun.shadow.mapSize.set(4096,4096); const sc = sun.shadow.camera; sc.left=-130; sc.right=130; sc.top=130; sc.bottom=-130; sc.near=10; sc.far=500; sun.shadow.bias = -.0004; sun.shadow.radius = 1.6;
  const shape = new THREE.Shape(); shape.moveTo(-400,-400); shape.lineTo(400,-400); shape.lineTo(400,400); shape.lineTo(-400,400); shape.closePath();
  const ww = cfg.win||[120,150], hole = new THREE.Path(); hole.moveTo(-ww[0]/2,-ww[1]/2); hole.lineTo(ww[0]/2,-ww[1]/2); hole.lineTo(ww[0]/2,ww[1]/2); hole.lineTo(-ww[0]/2,ww[1]/2); hole.closePath(); shape.holes.push(hole);
  const bar = new THREE.Mesh(new THREE.BoxGeometry(2.4,ww[1],3), new THREE.MeshBasicMaterial({colorWrite:false})); const bar2 = new THREE.Mesh(new THREE.BoxGeometry(ww[0],2.4,3), new THREE.MeshBasicMaterial({colorWrite:false}));
  const blocker = new THREE.Mesh(new THREE.ShapeGeometry(shape), new THREE.MeshBasicMaterial({colorWrite:false, side:THREE.DoubleSide}));
  const bg = new THREE.Group(); bg.add(blocker, bar, bar2); bar2.position.y = ww[1]*.18; bg.position.copy(target).addScaledVector(dir, 120); bg.lookAt(target); bg.position.x += (cfg.winShift||[0,0])[0]; bg.position.y += (cfg.winShift||[0,0])[1];
  [blocker,bar,bar2].forEach(o=>{o.castShadow=true;}); scene.add(bg);
  // plinth
  const stone = new THREE.MeshStandardMaterial({map:tex(noiseCanvas(512,'#CDC2AF',.06,9)), roughness:.95});
  const pl = cfg.plinth||[34,20,34]; const plinth = new THREE.Mesh(new THREE.BoxGeometry(...pl), stone); plinth.position.y = pl[1]/2; plinth.castShadow = plinth.receiveShadow = true; scene.add(plinth);
  const top = pl[1];
  const clay = new THREE.MeshStandardMaterial({map:tex(noiseCanvas(512,'#B49479',.14,5)), roughness:.97});
  const pages = pagesTex();
  const items = cfg.items; const group = new THREE.Group(); group.position.y = top; scene.add(group);
  if (cfg.kind === 'single'){
    const m = META[items[0]-1]; const b = makeBook(m, await bookTextures(m), pages); b.position.y = m.H/2; b.position.x = -2; b.rotation.y = THREE.MathUtils.degToRad(cfg.yaw ?? 32); group.add(b);
    const v = vase(cfg.vaseH||16, 4.6, clay); v.position.set(cfg.vasePos?.[0] ?? 12, 0, cfg.vasePos?.[1] ?? -9); group.add(v);
  } else {
    let y = 0; const Z0 = 6;
    for (let i=0;i<items.length;i++){
      const m = META[items[i]-1]; const b = makeBook(m, await bookTextures(m), pages);
      // lying, spine toward the camera (+z), head to the right (+x), front cover down
      b.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(new THREE.Vector3(0,0,-1), new THREE.Vector3(1,0,0), new THREE.Vector3(0,-1,0)));
      const jx = [0,1.6,-1.2][i%3]*(cfg.jit??1), jz = [0,-.5,.8][i%3]*(cfg.jit??1);
      b.position.set((cfg.cx||0) + jx, y + m.D/2, Z0 - m.W/2 + jz + (m.W-23)/2*0); group.add(b);
      b.rotation.y = 0; y += m.D + .02; 
      b.userData.top = y;
    }
    const v = vase(cfg.vaseH||15, 4.4, clay); v.position.set(cfg.vasePos?.[0] ?? 17, 0, cfg.vasePos?.[1] ?? -4); group.add(v);
  }
  const cam = new THREE.PerspectiveCamera(cfg.fov||26, W/H, 1, 1000); cam.position.set(...(cfg.cam||[-30,40,110])); cam.lookAt(...(cfg.look||[0,28,0]));

};
window.ready = true;
</script></body></html>
