x="73.20" y="47.40" font-size="2.09" text-anchor="end" fill="#444" direction="rtl" unicode-bidi="plaintext">العدد</text><text x="87.20" y="43.61" font-size="2.2" text-anchor="start" fill="#1b1b1b" font-weight="bold">Material / process</text><text x="87.20" y="47.40" font-size="2.09" text-anchor="end" fill="#444" direction="rtl" unicode-bidi="plaintext">الخامة / الطريقة</text><text x="207.20" y="43.61" font-size="2.2" text-anchor="start" fill="#1b1b1b" font-weight="bold">Size</text><text x="207.20" y="47.40" font-size="2.09" text-anchor="end" fill="#444" direction="rtl" unicode-bidi="plaintext">المقاس</text><text x="275.20" y="43.61" font-size="2.2" text-anchor="start" fill="#1b1b1b" font-weight="bold">Finish</text><text x="275.20" y="47.40" font-size="2.09" text-anchor="end" fill="#444" direction="rtl" unicode-bidi="plaintext">التشطيب</text><line x1="20.00" y1="48.60" x2="406.00" y2="48.60" stroke="#1b1b1b" stroke-width="0.13"/><text x="21.20" y="53.93" font-size="2.2" text-anchor="start" fill="#1b1b1b">1</text><text x="33.20" y="52.21" font-size="2.2" text-anchor="start" fill="#1b1b1b">Top plate</text><text x="33.20" y="56.00" font-size="2.09" text-anchor="end" fill="#444" direction="rtl" unicode-bidi="plaintext">لوح السطح</text><text x="73.20" y="53.93" font-size="2.2" text-anchor="start" fill="#1b1b1b">1</text><text x="87.20" y="52.21" font-size="2.2" text-anchor="start" fill="#1b1b1b">Steel sheet 3, laser cut, 3 slots (proposed)</text><text x="87.20" y="56.00" font-size="2.09" text-anchor="end" fill="#444" direction="rtl" unicode-bidi="plaintext">صاج ٣ مم قص ليزر، ٣ فتحات (مقترح)</text><text x="207.20" y="53.93" font-size="2.2" text-anchor="start" fill="#1b1b1b">Ø1000 x 3</text><text x="275.20" y="52.21" font-size="2.2" text-anchor="start" fill="#1b1b1b">Powder coat, matte, to confirm</text><text x="275.20" y="56.00" font-size="2.09" text-anchor="end" fill="#444" direction="rtl" unicode-bidi="plaintext">بودرة مطفي، للتأكيد</text><line x1="20.00" y1="57.20" x2="406.00" y2="57.20" stroke="#1b1b1b" stroke-width="0.13"/><text x="21.20" y="62.53" font-size="2.2" text-anchor="start" fill="#1b1b1b">2</text><text x="33.20" y="60.81" font-size="2.2" text-anchor="start" fill="#1b1b1b">Disc</text><text x="33.20" y="64.60" font-size="2.09" text-anchor="end" fill="#444" direction="rtl" unicode-bidi="plaintext">قرص</text><text x="73.20" y="62.53" font-size="2.2" text-anchor="start" fill="#1b1b1b">3</text><text x="87.20" y="60.81" font-size="2.2" text-anchor="start" fill="#1b1b1b">Steel sheet 3, laser cut (proposed)</text><text x="87.20" y="64.60" font-size="2.09" text-anchor="end" fill="#444" direction="rtl" unicode-bidi="plaintext">صاج ٣ مم قص ليزر (مقترح)</text><text x="207.20" y="62.53" font-size="2.2" text-anchor="start" fill="#1b1b1b">Ø380 x 3</text><text x="275.20" y="60.81" font-size="2.2" text-anchor="start" fill="#1b1b1b">Powder coat, matte, to confirm</text><text x="275.20" y="64.60" font-size="2.09" text-anchor="end" fill="#444" direction="rtl" unicode-bidi="plaintext">بودرة مطفي، للتأكيد</text><line x1="20.00" y1="65.80" x2="406.00" y2="65.80" stroke="#1b1b1b" stroke-width="0.13"/><text x="21.20" y="71.13" font-size="2.2" text-anchor="start" fill="#1b1b1b">3</text><text x="33.20" y="69.41" font-size="2.2" text-anchor="start" fill="#1b1b1b">Floor glides</text><text x="33.20" y="73.20" font-size="2.09" text-anchor="end" fill="#444" direction="rtl" unicode-bidi="plaintext">قواعد أرضية</text><text x="73.20" y="71.13" font-size="2.2" text-anchor="start" fill="#1b1b1b">3</text><text x="87.20" y="69.41" font-size="2.2" text-anchor="start" fill="#1b1b1b">Not in the reference. Production to propose</text><text x="87.20" y="73.20" font-size="2.09" text-anchor="end" fill="#444" direction="rtl" unicode-bidi="plaintext">ليست في المرجع. يقترحها الإنتاج</text><text x="207.20" y="71.13" font-size="2.2" text-anchor="start" fill="#1b1b1b">to follow</text><text x="275.20" y="71.13" font-size="2.2" text-anchor="start" fill="#1b1b1b">-</text><line x1="20.00" y1="74.40" x2="406.00" y2="74.40" stroke="#1b1b1b" stroke-width="0.13"/><line x1="20.00" y1="40.00" x2="20.00" y2="74.40" stroke="#1b1b1b" stroke-width="0.13"/><line x1="32.00" y1="40.00" x2="32.00" y2="74.40" stroke="#1b1b1b" stroke-width="0.13"/><line x1="72.00" y1="40.00" x2="72.00" y2="74.40" stroke="#1b1b1b" stroke-width="0.13"/><line x1="86.00" y1="40.00" x2="86.00" y2="74.40" stroke="#1b1b1b" stroke-width="0.13"/><line x1="206.00" y1="40.00" x2="206.00" y2="74.40" stroke="#1b1b1b" stroke-width="0.13"/><line x1="274.00" y1="40.00" x2="274.00" y2="74.40" stroke="#1b1b1b" stroke-width="0.13"/><line x1="406.00" y1="40.00" x2="406.00" y2="74.40" stroke="#1b1b1b" stroke-width="0.13"/><text x="20.00" y="98.00" font-size="2.8" text-anchor="start" fill="#1b1b1b" font-weight="bold">NOTES</text><text x="20.00" y="101.64" font-size="2.8" text-anchor="end" fill="#444" direction="rtl" unicode-bidi="plaintext">ملاحظات</text><text x="20.00" y="107.00" font-size="2.4" text-anchor="start" fill="#1b1b1b" font-weight="bold">1.</text><text x="27.00" y="107.00" font-size="2.4" text-anchor="start" fill="#1b1b1b">Overall width 1000 (1 m) and overall height 380 are Sabry's sizes (11 Nov 2026). The earlier book size (Ø900 x 380) is replaced.</text><text x="409.00" y="111.60" font-size="2.4" text-anchor="start" fill="#444" direction="rtl" unicode-bidi="plaintext">العرض الكلي ١٠٠٠ (متر) والارتفاع الكلي ٣٨٠ بطلب صبري (١١ نوفمبر ٢٠٢٦). يحل محل مقاس الكتاب السابق.</text><text x="20.00" y="119.60" font-size="2.4" text-anchor="start" fill="#1b1b1b" font-weight="bold">2.</text><text x="27.00" y="119.60" font-size="2.4" text-anchor="start" fill="#1b1b1b">The cap above the top is 49.2, from Sabry's model ratio (6.40 on a top of 130.06, scaled to 1000). The discs are full circles, so the disc diameter equals the overall height (380). A 320 disc width was asked for earlier and dropped.</text><text x="409.00" y="124.20" font-size="2.4" text-anchor="start" fill="#444" direction="rtl" unicode-bidi="plaintext">البارز فوق السطح ٤٩٫٢ من نسبة نموذج صبري. الأقراص دوائر كاملة فقطرها يساوي الارتفاع الكلي (٣٨٠). عرض ٣٢٠ المطلوب سابقاً أُلغي.</text><text x="20.00" y="132.20" font-size="2.4" text-anchor="start" fill="#1b1b1b" font-weight="bold">3.</text><text x="27.00" y="132.20" font-size="2.4" text-anchor="start" fill="#1b1b1b">ESTIMATED from the reference photo: disc position (radius 295), disc direction (radial) and top thickness.</text><text x="409.00" y="136.80" font-size="2.4" text-anchor="start" fill="#444" direction="rtl" unicode-bidi="plaintext">تقديرية من صورة المرجع: موضع القرص واتجاهه (شعاعي) وسماكة السطح.</text><text x="20.00" y="144.80" font-size="2.4" text-anchor="start" fill="#1b1b1b" font-weight="bold">4.</text><text x="27.00" y="144.80" font-size="2.4" text-anchor="start" fill="#1b1b1b">Sabry's own cut sheet and model were not available for this revision. Replace the estimates when they are.</text><text x="409.00" y="149.40" font-size="2.4" text-anchor="start" fill="#444" direction="rtl" unicode-bidi="plaintext">لم يتوفر ملف القص ونموذج صبري لهذه المراجعة. تُستبدل التقديرات عند توفره.</text><text x="20.00" y="157.40" font-size="2.4" text-anchor="start" fill="#1b1b1b" font-weight="bold">5.</text><text x="27.00" y="157.40" font-size="2.4" text-anchor="start" fill="#1b1b1b">The photo shows half-disc caps; Sabry's model has full discs passing through slots. This drawing follows his model.</text><text x="409.00" y="162.00" font-size="2.4" text-anchor="start" fill="#444" direction="rtl" unicode-bidi="plaintext">الصورة تُظهر أنصاف أقراص، ونموذج صبري أقراص كاملة من فتحات. الرسم يتبع نموذجه.</text><text x="20.00" y="170.00" font-size="2.4" text-anchor="start" fill="#1b1b1b" font-weight="bold">6.</text><text x="27.00" y="170.00" font-size="2.4" text-anchor="start" fill="#1b1b1b">A prototype exists (built, in painting, 27 Oct). Check this drawing against it before Production relies on it.</text><text x="409.00" y="174.60" font-size="2.4" text-anchor="start" fill="#444" direction="rtl" unicode-bidi="plaintext">يوجد نموذج أولي (مبني، قيد الدهان). تُراجع اللوحة عليه قبل الاعتماد.</text><text x="20.00" y="182.60" font-size="2.4" text-anchor="start" fill="#1b1b1b" font-weight="bold">7.</text><text x="27.00" y="182.60" font-size="2.4" text-anchor="start" fill="#1b1b1b">We propose; Production decides thickness, tolerances, joint method, welding, glides and finish details.</text><text x="409.00" y="187.20" font-size="2.4" text-anchor="start" fill="#444" direction="rtl" unicode-bidi="plaintext">نحن نقترح، والإنتاج يحدد السماكة والتفاوتات والوصلات واللحام والتشطيب.</text><text x="20.00" y="195.20" font-size="2.4" text-anchor="start" fill="#1b1b1b" font-weight="bold">8.</text><text x="27.00" y="195.20" font-size="2.4" text-anchor="start" fill="#1b1b1b">No structural claim is made. A 3 mm top over this span has not been checked.</text><text x="409.00" y="199.80" font-size="2.4" text-anchor="start" fill="#444" direction="rtl" unicode-bidi="plaintext">لا توجد ادعاءات إنشائية. لم يُراجع لوح ٣ مم على هذا البحر.</text><text x="20.00" y="207.80" font-size="2.4" text-anchor="start" fill="#1b1b1b" font-weight="bold">9.</text><text x="27.00" y="207.80" font-size="2.4" text-anchor="start" fill="#1b1b1b">Colours Bone, Clay, Carbon are the book colours; Oxblood is used in the renders. Paint system and gloss to be confirmed. No costs or prices here.</text><text x="409.00" y="212.40" font-size="2.4" text-anchor="start" fill="#444" direction="rtl" unicode-bidi="plaintext">الألوان عاجي وطيني وفحمي من الكتاب والعنابي في التصاميم. الدهان يؤكد لاحقاً. لا أسعار هنا.</text><text x="20.00" y="220.40" font-size="2.4" text-anchor="start" fill="#1b1b1b" font-weight="bold">10.</text><text x="27.00" y="220.40" font-size="2.4" text-anchor="start" fill="#1b1b1b">Arabic wording is a draft and needs a technical reader before it goes to the factory.</text><text x="409.00" y="225.00" font-size="2.4" text-anchor="start" fill="#444" direction="rtl" unicode-bidi="plaintext">الصياغة العربية مسودة وتحتاج مراجعة فنية قبل الإرسال للمصنع.</text><rect x="263" y="242" width="150" height="11" fill="#f0f8f2" stroke="#1d6b3a" stroke-width="0.4"/><text x="266.00" y="246.70" font-size="2.7" text-anchor="start" fill="#1d6b3a" font-weight="bold">Approved by Sabry 11 Nov 2026. Production review pending. Not engineered</text><text x="410.00" y="250.80" font-size="2.5" text-anchor="start" fill="#1d6b3a" direction="rtl" unicode-bidi="plaintext">معتمد من صبري ١١ نوفمبر ٢٠٢٦. مراجعة الإنتاج قيد الانتظار. بدون مراجعة هندسية</text><rect x="263" y="253" width="150" height="37" fill="#fff" stroke="#1b1b1b" stroke-width="0.35"/><rect x="263" y="253" width="75" height="12.3" fill="none" stroke="#1b1b1b" stroke-width="0.15"/><text x="264.30" y="256.60" font-size="1.9" text-anchor="start" fill="#666">PRODUCT / المنتج</text><text x="264.30" y="262.20" font-size="2.05" text-anchor="start" fill="#1b1b1b" font-weight="bold">OBJ-003 Coffee table (name to follow)</text><rect x="338" y="253" width="25" height="12.3" fill="none" stroke="#1b1b1b" stroke-width="0.15"/><text x="339.30" y="256.60" font-size="1.9" text-anchor="start" fill="#666">SIZE / المقاس</text><text x="339.30" y="262.20" font-size="2.5" text-anchor="start" fill="#1b1b1b" font-weight="bold">A3</text><rect x="363" y="253" width="25" height="12.3" fill="none" stroke="#1b1b1b" stroke-width="0.15"/><text x="364.30" y="256.60" font-size="1.9" text-anchor="start" fill="#666">SCALE / المقياس</text><text x="364.30" y="262.20" font-size="2.5" text-anchor="start" fill="#1b1b1b" font-weight="bold">-</text><rect x="388" y="253" width="25" height="12.3" fill="none" stroke="#1b1b1b" stroke-width="0.15"/><text x="389.30" y="256.60" font-size="1.9" text-anchor="start" fill="#666">UNITS / الوحدات</text><text x="389.30" y="262.20" font-size="2.5" text-anchor="start" fill="#1b1b1b" font-weight="bold">mm</text><rect x="263" y="265.3" width="75" height="12.3" fill="none" stroke="#1b1b1b" stroke-width="0.15"/><text x="264.30" y="268.90" font-size="1.9" text-anchor="start" fill="#666">MATERIAL / الخامة</text><text x="264.30" y="274.50" font-size="2.05" text-anchor="start" fill="#1b1b1b" font-weight="bold">Steel sheet 3 mm, laser cut (proposed)</text><rect x="338" y="265.3" width="25" height="12.3" fill="none" stroke="#1b1b1b" stroke-width="0.15"/><text x="339.30" y="268.90" font-size="1.9" text-anchor="start" fill="#666">DATE / التاريخ</text><text x="339.30" y="274.50" font-size="2.5" text-anchor="start" fill="#1b1b1b" font-weight="bold">11 Nov 2026</text><rect x="363" y="265.3" width="25" height="12.3" fill="none" stroke="#1b1b1b" stroke-width="0.15"/><text x="364.30" y="268.90" font-size="1.9" text-anchor="start" fill="#666">SHEET / لوحة</text><text x="364.30" y="274.50" font-size="2.5" text-anchor="start" fill="#1b1b1b" font-weight="bold">4 / 4</text><rect x="388" y="265.3" width="25" height="12.3" fill="none" stroke="#1b1b1b" stroke-width="0.15"/><text x="389.30" y="268.90" font-size="1.9" text-anchor="start" fill="#666">REV / مراجعة</text><text x="389.30" y="274.50" font-size="2.5" text-anchor="start" fill="#1b1b1b" font-weight="bold">4</text><rect x="263" y="277.6" width="100" height="12.3" fill="none" stroke="#1b1b1b" stroke-width="0.15"/><text x="264.30" y="281.20" font-size="1.9" text-anchor="start" fill="#666">FINISH / التشطيب</text><text x="264.30" y="286.80" font-size="2.05" text-anchor="start" fill="#1b1b1b" font-weight="bold">Powder coat · matte, colour to be confirmed</text><rect x="363" y="277.6" width="50" height="12.3" fill="none" stroke="#1b1b1b" stroke-width="0.15"/><text x="364.30" y="281.20" font-size="1.9" text-anchor="start" fill="#666">DRAWN / رسم</text><text x="364.30" y="286.80" font-size="2.5" text-anchor="start" fill="#1b1b1b" font-weight="bold">objekt</text></svg>