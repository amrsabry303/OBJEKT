<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 297" width="420mm" height="297mm" font-family="DejaVu Sans, Arial, sans-serif"><rect width="420" height="297" fill="#fff"/><rect x="7" y="7" width="406" height="283" fill="none" stroke="#1b1b1b" stroke-width="0.35"/><image x="11" y="10.5" width="22" height="14" preserveAspectRatio="xMidYMid meet" href="data:image/svg+xml;base64,"/><text x="38.00" y="17.00" font-size="5" text-anchor="start" fill="#1b1b1b" font-weight="bold">OBJ-020  Coffee table</text><text x="38.00" y="22.50" font-size="3.2" text-anchor="start" fill="#444">Assembly and cutting layout</text><text x="409.00" y="17.00" font-size="5" text-anchor="start" fill="#1b1b1b" font-weight="bold" direction="rtl" unicode-bidi="plaintext">طاولة قهوة  OBJ-020</text><text x="409.00" y="22.50" font-size="3.2" text-anchor="start" fill="#444" direction="rtl" unicode-bidi="plaintext">التركيب وتوزيع القص</text><line x1="7.00" y1="27.00" x2="413.00" y2="27.00" stroke="#1b1b1b" stroke-width="0.25"/><text x="20.00" y="34.00" font-size="2.8" text-anchor="start" fill="#1b1b1b" font-weight="bold">EXPLODED VIEW  1:10</text><text x="20.00" y="37.64" font-size="2.8" text-anchor="end" fill="#444" direction="rtl" unicode-bidi="plaintext">منظور مفكوك</text><path d="M67.54,105.12 L84.74,110.77 L100.23,100.39 L83.02,94.74 Z" fill="#d9d6cf" stroke="#1b1b1b" stroke-width="0.3" stroke-linejoin="round"/><path d="M84.74,122.69 L100.23,112.31 L100.23,100.39 L84.74,110.77 Z" fill="#746049" stroke="#1b1b1b" stroke-width="0.3" stroke-linejoin="round"/><path d="M67.54,117.04 L84.74,122.69 L84.74,110.77 L67.54,105.12 Z" fill="#a08a6c" stroke="#1b1b1b" stroke-width="0.3" stroke-linejoin="round"/><path d="M127.66,123.74 L139.13,127.51 L146.10,126.93 L159.29,118.09 L158.06,114.82 L146.59,111.05 Z" fill="#d9d6cf" stroke="#1b1b1b" stroke-width="0.3" stroke-linejoin="round"/><path d="M146.10,138.85 L159.29,130.01 L159.29,118.09 L146.10,126.93 Z" fill="#746049" stroke="#1b1b1b" stroke-width="0.3" stroke-linejoin="round"/><path d="M127.66,135.66 L139.13,139.43 L139.13,127.51 L127.66,123.74 Z" fill="#a08a6c" stroke="#1b1b1b" stroke-width="0.3" stroke-linejoin="round"/><path d="M139.13,139.43 L146.10,138.85 L146.10,126.93 L139.13,127.51 Z" fill="#8a7458" stroke="#1b1b1b" stroke-width="0.3" stroke-linejoin="round"/><path d="M168.87,97.27 L170.60,90.39 L170.60,75.82 L168.87,82.71 Z" fill="#746049" stroke="#1b1b1b" stroke-width="0.3" stroke-linejoin="round"/><path d="M61.43,87.46 L100.14,101.62 L100.14,87.05 L61.43,72.89 Z" fill="#a08a6c" stroke="#1b1b1b" stroke-width="0.3" stroke-linejoin="round"/><path d="M61.43,72.89 L100.14,87.05 L137.74,98.26 L149.37,95.78 L168.87,82.71 L170.60,75.82 L109.98,55.89 L80.69,62.03 Z" fill="#d9d6cf" stroke="#1b1b1b" stroke-width="0.3" stroke-linejoin="round"/><path d="M149.37,110.35 L168.87,97.27 L168.87,82.71 L149.37,95.78 Z" fill="#746049" stroke="#1b1b1b" stroke-width="0.3" stroke-linejoin="round"/><path d="M100.14,101.62 L137.74,112.83 L137.74,98.26 L100.14,87.05 Z" fill="#a08a6c" stroke="#1b1b1b" stroke-width="0.3" stroke-linejoin="round"/><path d="M137.74,112.83 L149.37,110.35 L149.37,95.78 L137.74,98.26 Z" fill="#8a7458" stroke="#1b1b1b" stroke-width="0.3" stroke-linejoin="round"/><text x="215.00" y="34.00" font-size="2.8" text-anchor="start" fill="#1b1b1b" font-weight="bold">PROPOSED SEQUENCE (Production decides)</text><text x="215.00" y="37.64" font-size="2.8" text-anchor="end" fill="#444" direction="rtl" unicode-bidi="plaintext">تسلسل مقترح (القرار للإنتاج)</text><text x="215.00" y="44.00" font-size="2.4" text-anchor="start" fill="#1b1b1b" font-weight="bold">1.</text><text x="221.00" y="44.00" font-size="2.1" text-anchor="start" fill="#1b1b1b">Laser cut P1 to P10 from 3 mm sheet. Fold P3, P4, P6, P7, P9 at the blue lines.</text><text x="221.00" y="46.73" font-size="2.1" text-anchor="end" fill="#444" direction="rtl" unicode-bidi="plaintext">قص الليزر للقطع من ل١ إلى ل١٠ من صاج ٣ مم. ثني ل٣ ول٤ ول٦ ول٧ ول٩ عند الخطوط الزرقاء.</text><text x="215.00" y="61.00" font-size="2.4" text-anchor="start" fill="#1b1b1b" font-weight="bold">2.</text><text x="221.00" y="61.00" font-size="2.1" text-anchor="start" fill="#1b1b1b">Weld each leg: the band closes at its seam, then its cap plate on top.</text><text x="221.00" y="63.73" font-size="2.1" text-anchor="end" fill="#444" direction="rtl" unicode-bidi="plaintext">لحام كل رجل: يُقفل الشريط عند وصلته ثم غطاؤه العلوي.</text><text x="215.00" y="78.00" font-size="2.4" text-anchor="start" fill="#1b1b1b" font-weight="bold">3.</text><text x="221.00" y="78.00" font-size="2.1" text-anchor="start" fill="#1b1b1b">Build the box: bottom plate, the four band and plate pieces round it, then the top plate.</text><text x="221.00" y="80.73" font-size="2.1" text-anchor="end" fill="#444" direction="rtl" unicode-bidi="plaintext">تجميع الصندوق: اللوح السفلي، القطع الأربع حوله، ثم اللوح العلوي.</text><text x="215.00" y="95.00" font-size="2.4" text-anchor="start" fill="#1b1b1b" font-weight="bold">4.</text><text x="221.00" y="95.00" font-size="2.1" text-anchor="start" fill="#1b1b1b">Fix the legs to the box underside as on the plan (dashed outlines).</text><text x="221.00" y="97.73" font-size="2.1" text-anchor="end" fill="#444" direction="rtl" unicode-bidi="plaintext">تثبيت الرجلين أسفل الصندوق كما في المسقط الأفقي (الخطوط المتقطعة).</text><text x="215.00" y="112.00" font-size="2.4" text-anchor="start" fill="#1b1b1b" font-weight="bold">5.</text><text x="221.00" y="112.00" font-size="2.1" text-anchor="start" fill="#1b1b1b">Dress the seams, then finish: brushed top, bronze sides and legs. Glides if wanted.</text><text x="221.00" y="114.73" font-size="2.1" text-anchor="end" fill="#444" direction="rtl" unicode-bidi="plaintext">تنعيم الوصلات ثم التشطيب: سطح مصنفر وجوانب وأرجل برونزية. قواعد أرضية إن لزم.</text><text x="20.00" y="142.00" font-size="2.6" text-anchor="start" fill="#1b1b1b" font-weight="bold">CUTTING LAYOUT  1:14  (assumed sheet 1250 x 2500 x 3)</text><text x="20.00" y="145.38" font-size="2.6" text-anchor="end" fill="#444" direction="rtl" unicode-bidi="plaintext">توزيع القص (لوح مفترض ١٢٥٠ × ٢٥٠٠ × ٣)</text><rect x="20" y="158" width="178.57" height="89.29" fill="#fafafa" stroke="#1b1b1b" stroke-width="0.3"/><path d="M20.71,199.79 L55.71,201.57 L87.50,200.14 L92.14,192.29 L92.14,168.00 L87.14,158.71 L34.29,158.71 L22.50,178.36 Z" fill="#e6e2d8" stroke="#1b1b1b" stroke-width="0.3"/><text x="61.52" y="183.20" font-size="2.2" text-anchor="middle" fill="#333">P1</text><path d="M20.71,244.79 L55.71,246.57 L87.50,245.14 L92.14,237.29 L92.14,213.00 L87.14,203.71 L34.29,203.71 L22.50,223.36 Z" fill="#e6e2d8" stroke="#1b1b1b" stroke-width="0.3"/><text x="61.52" y="228.20" font-size="2.2" text-anchor="middle" fill="#333">P2</text><path d="M94.29,170.50 L170.28,170.50 L170.28,158.71 L94.29,158.71 Z" fill="#e6e2d8" stroke="#1b1b1b" stroke-width="0.3"/><text x="132.28" y="165.61" font-size="2.2" text-anchor="middle" fill="#333">P3</text><path d="M94.29,212.29 L129.12,212.29 L129.12,200.50 L94.29,200.50 Z" fill="#e6e2d8" stroke="#1b1b1b" stroke-width="0.3"/><text x="111.70" y="207.39" font-size="2.2" text-anchor="middle" fill="#333">P4</text><path d="M94.29,184.43 L147.14,184.43 L147.14,172.64 L94.29,172.64 Z" fill="#e6e2d8" stroke="#1b1b1b" stroke-width="0.3"/><text x="120.71" y="179.54" font-size="2.2" text-anchor="middle" fill="#333">P5</text><path d="M94.29,198.36 L138.70,198.36 L138.70,186.57 L94.29,186.57 Z" fill="#e6e2d8" stroke="#1b1b1b" stroke-width="0.3"/><text x="116.49" y="193.46" font-size="2.2" text-anchor="middle" fill="#333">P6</text><path d="M149.29,246.57 L158.93,246.57 L158.93,178.00 L149.29,178.00 Z" fill="#e6e2d8" stroke="#1b1b1b" stroke-width="0.3"/><text x="154.11" y="213.29" font-size="2.2" text-anchor="middle" fill="#333">P7</text><path d="M94.29,233.71 L109.29,233.71 L109.29,214.43 L94.29,214.43 Z" fill="#e6e2d8" stroke="#1b1b1b" stroke-width="0.3"/><text x="101.79" y="225.07" font-size="2.2" text-anchor="middle" fill="#333">P8</text><path d="M161.07,246.57 L170.71,246.57 L170.71,176.47 L161.07,176.47 Z" fill="#e6e2d8" stroke="#1b1b1b" stroke-width="0.3"/><text x="165.89" y="212.52" font-size="2.2" text-anchor="middle" fill="#333">P9</text><path d="M111.43,238.00 L121.43,238.00 L125.00,234.43 L125.00,218.00 L121.43,214.43 L111.43,214.43 Z" fill="#e6e2d8" stroke="#1b1b1b" stroke-width="0.3"/><text x="119.29" y="227.21" font-size="2.2" text-anchor="middle" fill="#333">P10</text><line x1="20.00" y1="253.29" x2="198.57" y2="253.29" stroke="#1b1b1b" stroke-width="0.13"/><line x1="20.00" y1="251.79" x2="20.00" y2="254.79" stroke="#1b1b1b" stroke-width="0.13"/><line x1="198.57" y1="251.79" x2="198.57" y2="254.79" stroke="#1b1b1b" stroke-width="0.13"/><rect x="106.06" y="251.79" width="6.46" height="2.80" fill="#fff"/><text x="109.29" y="253.99" font-size="2.0" text-anchor="middle" fill="#1b1b1b">2500</text><line x1="202.57" y1="158.00" x2="202.57" y2="247.29" stroke="#1b1b1b" stroke-width="0.13"/><line x1="201.07" y1="158.00" x2="204.07" y2="158.00" stroke="#1b1b1b" stroke-width="0.13"/><line x1="201.07" y1="247.29" x2="204.07" y2="247.29" stroke="#1b1b1b" stroke-width="0.13"/><text x="204.07" y="203.34" font-size="2.0" text-anchor="start" fill="#1b1b1b">1250</text><text x="20.00" y="262.00" font-size="2.3" text-anchor="start" fill="#1b1b1b" font-weight="bold">Total cutting length 19.3 m on one assumed sheet. Part spacing 30 mm, edge margin 10 mm (assumed).</text><text x="20.00" y="268.00" font-size="2.0" text-anchor="start" fill="#555">Sheet size and nesting are Production's.</text><rect x="263" y="242" width="150" height="11" fill="#fff4f2" stroke="#b3261e" stroke-width="0.4"/><text x="266.00" y="246.70" font-size="2.9" text-anchor="start" fill="#b3261e" font-weight="bold">DRAFT, not approved, not engineered</text><text x="410.00" y="250.80" font-size="2.7" text-anchor="start" fill="#b3261e" direction="rtl" unicode-bidi="plaintext">مسودة، غير معتمدة، بدون مراجعة هندسية</text><rect x="263" y="253" width="150" height="37" fill="#fff" stroke="#1b1b1b" stroke-width="0.35"/><rect x="263" y="253" width="75" height="12.3" fill="none" stroke="#1b1b1b" stroke-width="0.15"/><text x="264.30" y="256.60" font-size="1.9" text-anchor="start" fill="#666">PRODUCT / المنتج</text><text x="264.30" y="262.20" font-size="1.9" text-anchor="start" fill="#1b1b1b" font-weight="bold">OBJ-020 Coffee table (name to follow)</text><rect x="338" y="253" width="25" height="12.3" fill="none" stroke="#1b1b1b" stroke-width="0.15"/><text x="339.30" y="256.60" font-size="1.9" text-anchor="start" fill="#666">SIZE / المقاس</text><text x="339.30" y="262.20" font-size="2.5" text-anchor="start" fill="#1b1b1b" font-weight="bold">A3</text><rect x="363" y="253" width="25" height="12.3" fill="none" stroke="#1b1b1b" stroke-width="0.15"/><text x="364.30" y="256.60" font-size="1.9" text-anchor="start" fill="#666">SCALE / المقياس</text><text x="364.30" y="262.20" font-size="2.5" text-anchor="start" fill="#1b1b1b" font-weight="bold">1:10 / 1:14</text><rect x="388" y="253" width="25" height="12.3" fill="none" stroke="#1b1b1b" stroke-width="0.15"/><text x="389.30" y="256.60" font-size="1.9" text-anchor="start" fill="#666">UNITS / الوحدات</text><text x="389.30" y="262.20" font-size="2.5" text-anchor="start" fill="#1b1b1b" font-weight="bold">mm</text><rect x="263" y="265.3" width="75" height="12.3" fill="none" stroke="#1b1b1b" stroke-width="0.15"/><text x="264.30" y="268.90" font-size="1.9" text-anchor="start" fill="#666">MATERIAL / الخامة</text><text x="264.30" y="274.50" font-size="1.9" text-anchor="start" fill="#1b1b1b" font-weight="bold">Steel sheet 3 mm, laser cut and folded (proposed)</text><rect x="338" y="265.3" width="25" height="12.3" fill="none" stroke="#1b1b1b" stroke-width="0.15"/><text x="339.30" y="268.90" font-size="1.9" text-anchor="start" fill="#666">DATE / التاريخ</text><text x="339.30" y="274.50" font-size="2.5" text-anchor="start" fill="#1b1b1b" font-weight="bold">11 Nov 2026</text><rect x="363" y="265.3" width="25" height="12.3" fill="none" stroke="#1b1b1b" stroke-width="0.15"/><text x="364.30" y="268.90" font-size="1.9" text-anchor="start" fill="#666">SHEET / لوحة</text><text x="364.30" y="274.50" font-size="2.5" text-anchor="start" fill="#1b1b1b" font-weight="bold">3 / 4</text><rect x="388" y="265.3" width="25" height="12.3" fill="none" stroke="#1b1b1b" stroke-width="0.15"/><text x="389.30" y="268.90" font-size="1.9" text-anchor="start" fill="#666">REV / مراجعة</text><text x="389.30" y="274.50" font-size="2.5" text-anchor="start" fill="#1b1b1b" font-weight="bold">2</text><rect x="263" y="277.6" width="100" height="12.3" fill="none" stroke="#1b1b1b" stroke-width="0.15"/><text x="264.30" y="281.20" font-size="1.9" text-anchor="start" fill="#666">FINISH / التشطيب</text><text x="264.30" y="286.80" font-size="1.9" text-anchor="start" fill="#1b1b1b" font-weight="bold">Top brushed silver, sides and legs bronze (to be confirmed)</text><rect x="363" y="277.6" width="50" height="12.3" fill="none" stroke="#1b1b1b" stroke-width="0.15"/><text x="364.30" y="281.20" font-size="1.9" text-anchor="start" fill="#666">DRAWN / رسم</text><text x="364.30" y="286.80" font-size="2.5" text-anchor="start" fill="#1b1b1b" font-weight="bold">objekt</text></svg>