<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 297" width="420mm" height="297mm" font-family="DejaVu Sans, Arial, sans-serif"><rect width="420" height="297" fill="#fff"/><rect x="7" y="7" width="406" height="283" fill="none" stroke="#1b1b1b" stroke-width="0.35"/><image x="11" y="10.5" width="22" height="14" preserveAspectRatio="xMidYMid meet" href="data:image/svg+xml;base64,"/><text x="38.00" y="17.00" font-size="5" text-anchor="start" fill="#1b1b1b" font-weight="bold">OBJ-020  Coffee table</text><text x="38.00" y="22.50" font-size="3.2" text-anchor="start" fill="#444">Assembly and cutting layout</text><text x="409.00" y="17.00" font-size="5" text-anchor="start" fill="#1b1b1b" font-weight="bold" direction="rtl" unicode-bidi="plaintext">طاولة قهوة  OBJ-020</text><text x="409.00" y="22.50" font-size="3.2" text-anchor="start" fill="#444" direction="rtl" unicode-bidi="plaintext">التركيب وتوزيع القص</text><line x1="7.00" y1="27.00" x2="413.00" y2="27.00" stroke="#1b1b1b" stroke-width="0.25"/><text x="20.00" y="34.00" font-size="2.8" text-anchor="start" fill="#1b1b1b" font-weight="bold">EXPLODED VIEW  1:10</text><text x="20.00" y="37.64" font-size="2.8" text-anchor="end" fill="#444" direction="rtl" unicode-bidi="plaintext">منظور مفكوك</text><path d="M77.21,94.54 L69.11,102.77 L81.87,106.97 L103.67,92.35 L90.91,88.16 Z" fill="#d9d6cf" stroke="#1b1b1b" stroke-width="0.3" stroke-linejoin="round"/><path d="M81.87,118.89 L103.67,104.27 L103.67,92.35 L81.87,106.97 Z" fill="#746049" stroke="#1b1b1b" stroke-width="0.3" stroke-linejoin="round"/><path d="M69.11,114.69 L81.87,118.89 L81.87,106.97 L69.11,102.77 Z" fill="#a08a6c" stroke="#1b1b1b" stroke-width="0.3" stroke-linejoin="round"/><path d="M159.12,133.39 L167.22,125.16 L167.22,113.24 L159.12,121.47 Z" fill="#746049" stroke="#1b1b1b" stroke-width="0.3" stroke-linejoin="round"/><path d="M167.22,113.24 L154.46,109.05 L132.66,123.66 L145.42,127.86 L159.12,121.47 Z" fill="#d9d6cf" stroke="#1b1b1b" stroke-width="0.3" stroke-linejoin="round"/><path d="M145.42,139.78 L159.12,133.39 L159.12,121.47 L145.42,127.86 Z" fill="#746049" stroke="#1b1b1b" stroke-width="0.3" stroke-linejoin="round"/><path d="M132.66,135.58 L145.42,139.78 L145.42,127.86 L132.66,123.66 Z" fill="#a08a6c" stroke="#1b1b1b" stroke-width="0.3" stroke-linejoin="round"/><path d="M100.96,87.32 L141.10,97.65 L159.12,89.24 L169.78,78.42 L135.37,64.24 L95.23,53.91 L77.21,62.32 L66.55,73.14 Z" fill="#d9d6cf" stroke="#1b1b1b" stroke-width="0.3" stroke-linejoin="round"/><path d="M66.55,87.71 L100.96,101.89 L100.96,87.32 L66.55,73.14 Z" fill="#a08a6c" stroke="#1b1b1b" stroke-width="0.3" stroke-linejoin="round"/><path d="M159.12,103.81 L169.78,92.99 L169.78,78.42 L159.12,89.24 Z" fill="#746049" stroke="#1b1b1b" stroke-width="0.3" stroke-linejoin="round"/><path d="M100.96,101.89 L141.10,112.21 L141.10,97.65 L100.96,87.32 Z" fill="#a08a6c" stroke="#1b1b1b" stroke-width="0.3" stroke-linejoin="round"/><path d="M141.10,112.21 L159.12,103.81 L159.12,89.24 L141.10,97.65 Z" fill="#746049" stroke="#1b1b1b" stroke-width="0.3" stroke-linejoin="round"/><text x="215.00" y="34.00" font-size="2.8" text-anchor="start" fill="#1b1b1b" font-weight="bold">PROPOSED SEQUENCE (Production decides)</text><text x="215.00" y="37.64" font-size="2.8" text-anchor="end" fill="#444" direction="rtl" unicode-bidi="plaintext">تسلسل مقترح (القرار للإنتاج)</text><text x="215.00" y="44.00" font-size="2.4" text-anchor="start" fill="#1b1b1b" font-weight="bold">1.</text><text x="221.00" y="44.00" font-size="2.1" text-anchor="start" fill="#1b1b1b">Laser cut P1 to P6 from 3 mm sheet. Fold P3 and P4 (1 fold each) and P5 (5 folds) at the blue lines.</text><text x="221.00" y="46.73" font-size="2.1" text-anchor="end" fill="#444" direction="rtl" unicode-bidi="plaintext">قص الليزر للقطع من ل١ إلى ل٦ من صاج ٣ مم. ثني ل٣ ول٤ (ثنية لكل منهما) ول٥ (٥ ثنيات) عند الخطوط الزرقاء.</text><text x="215.00" y="61.00" font-size="2.4" text-anchor="start" fill="#1b1b1b" font-weight="bold">2.</text><text x="221.00" y="61.00" font-size="2.1" text-anchor="start" fill="#1b1b1b">Weld each leg: the band closes at its seam, then its cap plate on top. The two legs are mirror images.</text><text x="221.00" y="63.73" font-size="2.1" text-anchor="end" fill="#444" direction="rtl" unicode-bidi="plaintext">لحام كل رجل: يُقفل الشريط عند وصلته ثم غطاؤه العلوي. الرجلان متناظرتان.</text><text x="215.00" y="78.00" font-size="2.4" text-anchor="start" fill="#1b1b1b" font-weight="bold">3.</text><text x="221.00" y="78.00" font-size="2.1" text-anchor="start" fill="#1b1b1b">Build the box: bottom plate, the 2 side bands and 2 end bands round it, then the top plate.</text><text x="221.00" y="80.73" font-size="2.1" text-anchor="end" fill="#444" direction="rtl" unicode-bidi="plaintext">تجميع الصندوق: اللوح السفلي، الشريطان الجانبيان والشريطان الطرفيان حوله، ثم اللوح العلوي.</text><text x="215.00" y="95.00" font-size="2.4" text-anchor="start" fill="#1b1b1b" font-weight="bold">4.</text><text x="221.00" y="95.00" font-size="2.1" text-anchor="start" fill="#1b1b1b">Fix each leg under its end point, its V faces in line with the table's V faces (dashed outlines on the plan).</text><text x="221.00" y="97.73" font-size="2.1" text-anchor="end" fill="#444" direction="rtl" unicode-bidi="plaintext">تثبيت كل رجل أسفل رأس الطرف بحيث تتوافق أوجه V مع أوجه V للطاولة (الخطوط المتقطعة).</text><text x="215.00" y="112.00" font-size="2.4" text-anchor="start" fill="#1b1b1b" font-weight="bold">5.</text><text x="221.00" y="112.00" font-size="2.1" text-anchor="start" fill="#1b1b1b">Dress the seams, then finish: brushed top, bronze sides and legs. Glides if wanted.</text><text x="221.00" y="114.73" font-size="2.1" text-anchor="end" fill="#444" direction="rtl" unicode-bidi="plaintext">تنعيم الوصلات ثم التشطيب: سطح مصنفر وجوانب وأرجل برونزية. قواعد أرضية إن لزم.</text><text x="20.00" y="142.00" font-size="2.6" text-anchor="start" fill="#1b1b1b" font-weight="bold">CUTTING LAYOUT  1:14  (assumed sheet 1250 x 2500 x 3)</text><text x="20.00" y="145.38" font-size="2.6" text-anchor="end" fill="#444" direction="rtl" unicode-bidi="plaintext">توزيع القص (لوح مفترض ١٢٥٠ × ٢٥٠٠ × ٣)</text><rect x="20" y="158" width="178.57" height="89.29" fill="#fafafa" stroke="#1b1b1b" stroke-width="0.3"/><path d="M56.43,201.57 L88.93,198.00 L92.14,180.14 L88.93,162.29 L56.43,158.71 L23.93,162.29 L20.71,180.14 L23.93,198.00 Z" fill="#e6e2d8" stroke="#1b1b1b" stroke-width="0.3"/><text x="56.43" y="181.14" font-size="2.2" text-anchor="middle" fill="#333">P1</text><path d="M56.43,246.57 L88.93,243.00 L92.14,225.14 L88.93,207.29 L56.43,203.71 L23.93,207.29 L20.71,225.14 L23.93,243.00 Z" fill="#e6e2d8" stroke="#1b1b1b" stroke-width="0.3"/><text x="56.43" y="226.14" font-size="2.2" text-anchor="middle" fill="#333">P2</text><path d="M94.29,246.57 L106.07,246.57 L106.07,181.18 L94.29,181.18 Z" fill="#e6e2d8" stroke="#1b1b1b" stroke-width="0.3"/><text x="100.18" y="214.88" font-size="2.2" text-anchor="middle" fill="#333">P3</text><path d="M108.21,246.57 L120.00,246.57 L120.00,181.18 L108.21,181.18 Z" fill="#e6e2d8" stroke="#1b1b1b" stroke-width="0.3"/><text x="114.11" y="214.88" font-size="2.2" text-anchor="middle" fill="#333">P3</text><path d="M122.14,246.57 L133.93,246.57 L133.93,210.28 L122.14,210.28 Z" fill="#e6e2d8" stroke="#1b1b1b" stroke-width="0.3"/><text x="128.04" y="229.43" font-size="2.2" text-anchor="middle" fill="#333">P4</text><path d="M136.07,246.57 L147.86,246.57 L147.86,210.28 L136.07,210.28 Z" fill="#e6e2d8" stroke="#1b1b1b" stroke-width="0.3"/><text x="141.96" y="229.43" font-size="2.2" text-anchor="middle" fill="#333">P4</text><path d="M153.57,246.57 L163.21,246.57 L163.21,169.59 L153.57,169.59 Z" fill="#e6e2d8" stroke="#1b1b1b" stroke-width="0.3"/><text x="158.39" y="209.08" font-size="2.2" text-anchor="middle" fill="#333">P5</text><path d="M165.36,246.57 L175.00,246.57 L175.00,169.59 L165.36,169.59 Z" fill="#e6e2d8" stroke="#1b1b1b" stroke-width="0.3"/><text x="170.18" y="209.08" font-size="2.2" text-anchor="middle" fill="#333">P5</text><path d="M122.14,191.57 L124.59,205.14 L135.71,205.14 L135.71,178.00 L124.59,178.00 Z" fill="#e6e2d8" stroke="#1b1b1b" stroke-width="0.3"/><text x="128.55" y="192.57" font-size="2.2" text-anchor="middle" fill="#333">P6</text><path d="M137.86,191.57 L140.30,205.14 L151.43,205.14 L151.43,178.00 L140.30,178.00 Z" fill="#e6e2d8" stroke="#1b1b1b" stroke-width="0.3"/><text x="144.26" y="192.57" font-size="2.2" text-anchor="middle" fill="#333">P6</text><line x1="20.00" y1="253.29" x2="198.57" y2="253.29" stroke="#1b1b1b" stroke-width="0.13"/><line x1="20.00" y1="251.79" x2="20.00" y2="254.79" stroke="#1b1b1b" stroke-width="0.13"/><line x1="198.57" y1="251.79" x2="198.57" y2="254.79" stroke="#1b1b1b" stroke-width="0.13"/><rect x="106.06" y="251.79" width="6.46" height="2.80" fill="#fff"/><text x="109.29" y="253.99" font-size="2.0" text-anchor="middle" fill="#1b1b1b">2500</text><line x1="202.57" y1="158.00" x2="202.57" y2="247.29" stroke="#1b1b1b" stroke-width="0.13"/><line x1="201.07" y1="158.00" x2="204.07" y2="158.00" stroke="#1b1b1b" stroke-width="0.13"/><line x1="201.07" y1="247.29" x2="204.07" y2="247.29" stroke="#1b1b1b" stroke-width="0.13"/><text x="204.07" y="203.34" font-size="2.0" text-anchor="start" fill="#1b1b1b">1250</text><text x="20.00" y="262.00" font-size="2.3" text-anchor="start" fill="#1b1b1b" font-weight="bold">Total cutting length 19.7 m on one assumed sheet. Part spacing 30 mm, edge margin 10 mm (assumed).</text><text x="20.00" y="268.00" font-size="2.0" text-anchor="start" fill="#555">Sheet size and nesting are Production's.</text><rect x="263" y="242" width="150" height="11" fill="#f0f8f2" stroke="#1d6b3a" stroke-width="0.4"/><text x="266.00" y="246.70" font-size="2.7" text-anchor="start" fill="#1d6b3a" font-weight="bold">Approved by Sabry 11 Nov 2026. Production review pending. Not engineered</text><text x="410.00" y="250.80" font-size="2.5" text-anchor="start" fill="#1d6b3a" direction="rtl" unicode-bidi="plaintext">معتمد من صبري ١١ نوفمبر ٢٠٢٦. مراجعة الإنتاج قيد الانتظار. بدون مراجعة هندسية</text><rect x="263" y="253" width="150" height="37" fill="#fff" stroke="#1b1b1b" stroke-width="0.35"/><rect x="263" y="253" width="75" height="12.3" fill="none" stroke="#1b1b1b" stroke-width="0.15"/><text x="264.30" y="256.60" font-size="1.9" text-anchor="start" fill="#666">PRODUCT / المنتج</text><text x="264.30" y="262.20" font-size="1.9" text-anchor="start" fill="#1b1b1b" font-weight="bold">OBJ-020 Coffee table (name to follow)</text><rect x="338" y="253" width="25" height="12.3" fill="none" stroke="#1b1b1b" stroke-width="0.15"/><text x="339.30" y="256.60" font-size="1.9" text-anchor="start" fill="#666">SIZE / المقاس</text><text x="339.30" y="262.20" font-size="2.5" text-anchor="start" fill="#1b1b1b" font-weight="bold">A3</text><rect x="363" y="253" width="25" height="12.3" fill="none" stroke="#1b1b1b" stroke-width="0.15"/><text x="364.30" y="256.60" font-size="1.9" text-anchor="start" fill="#666">SCALE / المقياس</text><text x="364.30" y="262.20" font-size="2.5" text-anchor="start" fill="#1b1b1b" font-weight="bold">1:10 / 1:14</text><rect x="388" y="253" width="25" height="12.3" fill="none" stroke="#1b1b1b" stroke-width="0.15"/><text x="389.30" y="256.60" font-size="1.9" text-anchor="start" fill="#666">UNITS / الوحدات</text><text x="389.30" y="262.20" font-size="2.5" text-anchor="start" fill="#1b1b1b" font-weight="bold">mm</text><rect x="263" y="265.3" width="75" height="12.3" fill="none" stroke="#1b1b1b" stroke-width="0.15"/><text x="264.30" y="268.90" font-size="1.9" text-anchor="start" fill="#666">MATERIAL / الخامة</text><text x="264.30" y="274.50" font-size="1.9" text-anchor="start" fill="#1b1b1b" font-weight="bold">Steel sheet 3 mm, laser cut and folded (proposed)</text><rect x="338" y="265.3" width="25" height="12.3" fill="none" stroke="#1b1b1b" stroke-width="0.15"/><text x="339.30" y="268.90" font-size="1.9" text-anchor="start" fill="#666">DATE / التاريخ</text><text x="339.30" y="274.50" font-size="2.5" text-anchor="start" fill="#1b1b1b" font-weight="bold">11 Nov 2026</text><rect x="363" y="265.3" width="25" height="12.3" fill="none" stroke="#1b1b1b" stroke-width="0.15"/><text x="364.30" y="268.90" font-size="1.9" text-anchor="start" fill="#666">SHEET / لوحة</text><text x="364.30" y="274.50" font-size="2.5" text-anchor="start" fill="#1b1b1b" font-weight="bold">3 / 4</text><rect x="388" y="265.3" width="25" height="12.3" fill="none" stroke="#1b1b1b" stroke-width="0.15"/><text x="389.30" y="268.90" font-size="1.9" text-anchor="start" fill="#666">REV / مراجعة</text><text x="389.30" y="274.50" font-size="2.5" text-anchor="start" fill="#1b1b1b" font-weight="bold">5</text><rect x="263" y="277.6" width="100" height="12.3" fill="none" stroke="#1b1b1b" stroke-width="0.15"/><text x="264.30" y="281.20" font-size="1.9" text-anchor="start" fill="#666">FINISH / التشطيب</text><text x="264.30" y="286.80" font-size="1.9" text-anchor="start" fill="#1b1b1b" font-weight="bold">Top brushed silver, sides and legs bronze (to be confirmed)</text><rect x="363" y="277.6" width="50" height="12.3" fill="none" stroke="#1b1b1b" stroke-width="0.15"/><text x="364.30" y="281.20" font-size="1.9" text-anchor="start" fill="#666">DRAWN / رسم</text><text x="364.30" y="286.80" font-size="2.5" text-anchor="start" fill="#1b1b1b" font-weight="bold">objekt</text></svg>