e-width="0.3" stroke-linejoin="round"/><path d="M127.06,101.22 L147.70,94.44 L149.03,90.91 L133.54,80.52 L126.02,79.90 L105.38,86.69 L104.05,90.22 L119.54,100.60 Z" fill="#d6cdbd" stroke="#1b1b1b" stroke-width="0.3" stroke-linejoin="round"/><path d="M147.70,107.15 L149.03,103.62 L149.03,90.91 L147.70,94.44 Z" fill="#ab9f8b" stroke="#1b1b1b" stroke-width="0.3" stroke-linejoin="round"/><path d="M104.05,102.93 L119.54,113.31 L119.54,100.60 L104.05,90.22 Z" fill="#c2b6a2" stroke="#1b1b1b" stroke-width="0.3" stroke-linejoin="round"/><path d="M127.06,113.94 L147.70,107.15 L147.70,94.44 L127.06,101.22 Z" fill="#c2b6a2" stroke="#1b1b1b" stroke-width="0.3" stroke-linejoin="round"/><path d="M119.54,113.31 L127.06,113.94 L127.06,101.22 L119.54,100.60 Z" fill="#c2b6a2" stroke="#1b1b1b" stroke-width="0.3" stroke-linejoin="round"/><path d="M152.35,80.07 L154.56,74.18 L154.56,59.88 L152.35,65.77 Z" fill="#ab9f8b" stroke="#1b1b1b" stroke-width="0.3" stroke-linejoin="round"/><path d="M78.62,90.00 L152.35,65.77 L154.56,59.88 L133.91,46.04 L121.38,45.00 L47.65,69.23 L45.44,75.12 L66.09,88.96 Z" fill="#d6cdbd" stroke="#1b1b1b" stroke-width="0.3" stroke-linejoin="round"/><path d="M78.62,104.30 L152.35,80.07 L152.35,65.77 L78.62,90.00 Z" fill="#c2b6a2" stroke="#1b1b1b" stroke-width="0.3" stroke-linejoin="round"/><path d="M45.44,89.42 L66.09,103.27 L66.09,88.96 L45.44,75.12 Z" fill="#c2b6a2" stroke="#1b1b1b" stroke-width="0.3" stroke-linejoin="round"/><path d="M66.09,103.27 L78.62,104.30 L78.62,90.00 L66.09,88.96 Z" fill="#c2b6a2" stroke="#1b1b1b" stroke-width="0.3" stroke-linejoin="round"/><line x1="73.46" y1="107.69" x2="73.46" y2="90.53" stroke="#555" stroke-width="0.12" stroke-dasharray="2 1.5"/><line x1="126.54" y1="90.24" x2="126.54" y2="73.08" stroke="#555" stroke-width="0.12" stroke-dasharray="2 1.5"/><text x="215.00" y="34.00" font-size="2.8" text-anchor="start" fill="#1b1b1b" font-weight="bold">PROPOSED SEQUENCE (Production decides)</text><text x="215.00" y="37.64" font-size="2.8" text-anchor="end" fill="#444" direction="rtl" unicode-bidi="plaintext">تسلسل مقترح (القرار للإنتاج)</text><text x="215.00" y="44.00" font-size="2.4" text-anchor="start" fill="#1b1b1b" font-weight="bold">1.</text><text x="221.00" y="44.00" font-size="2.1" text-anchor="start" fill="#1b1b1b">Laser cut P1 to P6 from 3 mm sheet. Fold P3 (2 folds) and P5 (8 folds).</text><text x="221.00" y="46.73" font-size="2.1" text-anchor="end" fill="#444" direction="rtl" unicode-bidi="plaintext">قص الليزر للقطع ل١ حتى ل٦ من صاج ٣ مم. ثني ل٣ (ثنيتان) ول٥ (٨ ثنيات).</text><text x="215.00" y="61.00" font-size="2.4" text-anchor="start" fill="#1b1b1b" font-weight="bold">2.</text><text x="221.00" y="61.00" font-size="2.1" text-anchor="start" fill="#1b1b1b">Weld each leg: the band closes at its seam, then the cap plate on top.</text><text x="221.00" y="63.73" font-size="2.1" text-anchor="end" fill="#444" direction="rtl" unicode-bidi="plaintext">لحام كل رجل: يُقفل الشريط عند وصلته ثم لوح العلوي.</text><text x="215.00" y="78.00" font-size="2.4" text-anchor="start" fill="#1b1b1b" font-weight="bold">3.</text><text x="221.00" y="78.00" font-size="2.1" text-anchor="start" fill="#1b1b1b">Build the box: bottom plate, 2 long sides, 2 end bands, then the top plate.</text><text x="221.00" y="80.73" font-size="2.1" text-anchor="end" fill="#444" direction="rtl" unicode-bidi="plaintext">تجميع الصندوق: اللوح السفلي، الجانبان الطويلان، الشريطان الطرفيان، ثم اللوح العلوي.</text><text x="215.00" y="95.00" font-size="2.4" text-anchor="start" fill="#1b1b1b" font-weight="bold">4.</text><text x="221.00" y="95.00" font-size="2.1" text-anchor="start" fill="#1b1b1b">Set the legs 40 in from each end and fix them to the box underside.</text><text x="221.00" y="97.73" font-size="2.1" text-anchor="end" fill="#444" direction="rtl" unicode-bidi="plaintext">ضبط الرجلين على بعد ٤٠ من كل طرف وتثبيتهما أسفل الصندوق.</text><text x="215.00" y="112.00" font-size="2.4" text-anchor="start" fill="#1b1b1b" font-weight="bold">5.</text><text x="221.00" y="112.00" font-size="2.1" text-anchor="start" fill="#1b1b1b">Dress the seams, brush the finish, fit glides if wanted.</text><text x="221.00" y="114.73" font-size="2.1" text-anchor="end" fill="#444" direction="rtl" unicode-bidi="plaintext">تنعيم الوصلات، التفريش، وإضافة قواعد أرضية إن لزم.</text><text x="20.00" y="142.00" font-size="2.4" text-anchor="start" fill="#1b1b1b" font-weight="bold">CUTTING SHEET 1  1:16  (assumed 1250 x 2500 x 3)</text><text x="20.00" y="145.12" font-size="2.4" text-anchor="end" fill="#444" direction="rtl" unicode-bidi="plaintext">لوح القص 1 (مفترض ١٢٥٠ × ٢٥٠٠ × ٣)</text><rect x="20" y="156" width="156.25" height="78.12" fill="#fafafa" stroke="#1b1b1b" stroke-width="0.3"/><path d="M26.88,194.12 L89.38,194.12 L95.62,187.88 L95.62,162.88 L89.38,156.62 L26.88,156.62 L20.62,162.88 L20.62,187.88 Z" fill="#e6e2d8" stroke="#1b1b1b" stroke-width="0.3"/><path d="M26.88,233.50 L89.38,233.50 L95.62,227.25 L95.62,202.25 L89.38,196.00 L26.88,196.00 L20.62,202.25 L20.62,227.25 Z" fill="#e6e2d8" stroke="#1b1b1b" stroke-width="0.3"/><path d="M97.50,167.88 L160.00,167.88 L160.00,156.62 L97.50,156.62 Z" fill="#e6e2d8" stroke="#1b1b1b" stroke-width="0.3"/><path d="M97.50,181.00 L160.00,181.00 L160.00,169.75 L97.50,169.75 Z" fill="#e6e2d8" stroke="#1b1b1b" stroke-width="0.3"/><path d="M101.25,209.12 L118.75,209.12 L122.50,205.38 L122.50,186.62 L118.75,182.88 L101.25,182.88 L97.50,186.62 L97.50,205.38 Z" fill="#e6e2d8" stroke="#1b1b1b" stroke-width="0.3"/><path d="M128.12,209.12 L145.62,209.12 L149.38,205.38 L149.38,186.62 L145.62,182.88 L128.12,182.88 L124.38,186.62 L124.38,205.38 Z" fill="#e6e2d8" stroke="#1b1b1b" stroke-width="0.3"/><path d="M151.25,233.50 L162.50,233.50 L162.50,190.82 L151.25,190.82 Z" fill="#e6e2d8" stroke="#1b1b1b" stroke-width="0.3"/><path d="M164.38,233.50 L175.62,233.50 L175.62,190.82 L164.38,190.82 Z" fill="#e6e2d8" stroke="#1b1b1b" stroke-width="0.3"/><line x1="20.00" y1="240.12" x2="176.25" y2="240.12" stroke="#1b1b1b" stroke-width="0.13"/><line x1="20.00" y1="238.62" x2="20.00" y2="241.62" stroke="#1b1b1b" stroke-width="0.13"/><line x1="176.25" y1="238.62" x2="176.25" y2="241.62" stroke="#1b1b1b" stroke-width="0.13"/><rect x="94.89" y="238.62" width="6.46" height="2.80" fill="#fff"/><text x="98.12" y="240.82" font-size="2.0" text-anchor="middle" fill="#1b1b1b">2500</text><text x="215.00" y="142.00" font-size="2.4" text-anchor="start" fill="#1b1b1b" font-weight="bold">CUTTING SHEET 2  1:16  (assumed 1250 x 2500 x 3)</text><text x="215.00" y="145.12" font-size="2.4" text-anchor="end" fill="#444" direction="rtl" unicode-bidi="plaintext">لوح القص 2 (مفترض ١٢٥٠ × ٢٥٠٠ × ٣)</text><rect x="215" y="156" width="156.25" height="78.12" fill="#fafafa" stroke="#1b1b1b" stroke-width="0.3"/><path d="M215.62,233.50 L309.34,233.50 L309.34,223.50 L215.62,223.50 Z" fill="#e6e2d8" stroke="#1b1b1b" stroke-width="0.3"/><path d="M215.62,221.62 L309.34,221.62 L309.34,211.62 L215.62,211.62 Z" fill="#e6e2d8" stroke="#1b1b1b" stroke-width="0.3"/><line x1="215.00" y1="240.12" x2="371.25" y2="240.12" stroke="#1b1b1b" stroke-width="0.13"/><line x1="215.00" y1="238.62" x2="215.00" y2="241.62" stroke="#1b1b1b" stroke-width="0.13"/><line x1="371.25" y1="238.62" x2="371.25" y2="241.62" stroke="#1b1b1b" stroke-width="0.13"/><rect x="289.89" y="238.62" width="6.46" height="2.80" fill="#fff"/><text x="293.12" y="240.82" font-size="2.0" text-anchor="middle" fill="#1b1b1b">2500</text><text x="20.00" y="250.00" font-size="2.3" text-anchor="start" fill="#1b1b1b" font-weight="bold">Total cutting length 24.5 m on 2 sheets. Part spacing 30 mm, edge margin 10 mm (assumed).</text><text x="20.00" y="256.00" font-size="2.0" text-anchor="start" fill="#555">Sheet 2 has room left over. Sheet size is Production's.</text><rect x="263" y="242" width="150" height="11" fill="#fff4f2" stroke="#b3261e" stroke-width="0.4"/><text x="266.00" y="246.70" font-size="2.9" text-anchor="start" fill="#b3261e" font-weight="bold">DRAFT, not approved, not engineered</text><text x="410.00" y="250.80" font-size="2.7" text-anchor="start" fill="#b3261e" direction="rtl" unicode-bidi="plaintext">مسودة، غير معتمدة، بدون مراجعة هندسية</text><rect x="263" y="253" width="150" height="37" fill="#fff" stroke="#1b1b1b" stroke-width="0.35"/><rect x="263" y="253" width="75" height="12.3" fill="none" stroke="#1b1b1b" stroke-width="0.15"/><text x="264.30" y="256.60" font-size="1.9" text-anchor="start" fill="#666">PRODUCT / المنتج</text><text x="264.30" y="262.20" font-size="2.0" text-anchor="start" fill="#1b1b1b" font-weight="bold">OBJ-020 Coffee table (name to follow)</text><rect x="338" y="253" width="25" height="12.3" fill="none" stroke="#1b1b1b" stroke-width="0.15"/><text x="339.30" y="256.60" font-size="1.9" text-anchor="start" fill="#666">SIZE / المقاس</text><text x="339.30" y="262.20" font-size="2.5" text-anchor="start" fill="#1b1b1b" font-weight="bold">A3</text><rect x="363" y="253" width="25" height="12.3" fill="none" stroke="#1b1b1b" stroke-width="0.15"/><text x="364.30" y="256.60" font-size="1.9" text-anchor="start" fill="#666">SCALE / المقياس</text><text x="364.30" y="262.20" font-size="2.5" text-anchor="start" fill="#1b1b1b" font-weight="bold">1:11 / 1:16</text><rect x="388" y="253" width="25" height="12.3" fill="none" stroke="#1b1b1b" stroke-width="0.15"/><text x="389.30" y="256.60" font-size="1.9" text-anchor="start" fill="#666">UNITS / الوحدات</text><text x="389.30" y="262.20" font-size="2.5" text-anchor="start" fill="#1b1b1b" font-weight="bold">mm</text><rect x="263" y="265.3" width="75" height="12.3" fill="none" stroke="#1b1b1b" stroke-width="0.15"/><text x="264.30" y="268.90" font-size="1.9" text-anchor="start" fill="#666">MATERIAL / الخامة</text><text x="264.30" y="274.50" font-size="2.0" text-anchor="start" fill="#1b1b1b" font-weight="bold">Steel sheet 3 mm, laser cut and folded (proposed)</text><rect x="338" y="265.3" width="25" height="12.3" fill="none" stroke="#1b1b1b" stroke-width="0.15"/><tex