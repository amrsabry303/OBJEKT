rial, sans-serif" font-size="2.1" font-weight="400" text-anchor="start" fill="#161616">MATERIAL  Steel sheet, thickness by Production</text><text x="318.00" y="274.73" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.1" font-weight="400" text-anchor="end" fill="#161616">الخامة: صفائح فولاذ، السماكة من التصنيع</text><text x="322.00" y="272.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.1" font-weight="400" text-anchor="start" fill="#161616">FINISH  to be confirmed</text><text x="410.00" y="274.73" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.1" font-weight="400" text-anchor="end" fill="#161616">التشطيب: يؤكد لاحقاً</text><text x="230.00" y="283.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="400" text-anchor="start" fill="#161616">DATE  11 Nov 2026      SHEET 3 / 5</text><text x="318.00" y="285.99" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="400" text-anchor="end" fill="#161616">التاريخ، الورقة</text><text x="322.00" y="283.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="400" text-anchor="start" fill="#161616">REV  0</text><text x="410.00" y="285.99" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="400" text-anchor="end" fill="#161616">المراجعة</text><rect x="228.00" y="233.00" width="185.00" height="12.00" fill="#fff" stroke="#b3261e" stroke-width="0.5"/><text x="320.50" y="238.40" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="3.4" font-weight="700" text-anchor="middle" fill="#b3261e">DRAFT, not approved, not engineered</text><text x="320.50" y="243.20" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="3.4" font-weight="700" text-anchor="middle" fill="#b3261e">مسودة، غير معتمدة، غير مهندسة</text><text x="10.00" y="14.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="4.2" font-weight="700" text-anchor="start" fill="#161616">ASSEMBLY</text><text x="410.00" y="14.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="4.2" font-weight="700" text-anchor="end" fill="#161616">التجميع</text><text x="10.00" y="22.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.5" font-weight="600" text-anchor="start" fill="#161616">EXPLODED VIEW (proposed assembly, Production decides jigs, welds and fixings)</text><text x="410.00" y="22.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.5" font-weight="600" text-anchor="end" fill="#161616">منظر مفكك (تجميع مقترح، والتصنيع يقرر القوالب واللحام)</text><polygon points="49.52,213.36 98.80,164.08 98.80,137.20 49.52,186.48" fill="#cfcac0" stroke="#161616" stroke-width="0.35"/><polygon points="48.18,186.48 49.52,186.48 98.80,137.20 97.46,137.20" fill="#f7f5ef" stroke="#161616" stroke-width="0.35"/><polygon points="48.18,213.36 49.52,213.36 49.52,186.48 48.18,186.48" fill="#e3dfd6" stroke="#161616" stroke-width="0.35"/><polygon points="122.54,213.36 171.82,164.08 171.82,137.20 122.54,186.48" fill="#cfcac0" stroke="#161616" stroke-width="0.35"/><polygon points="121.20,186.48 122.54,186.48 171.82,137.20 170.48,137.20" fill="#f7f5ef" stroke="#161616" stroke-width="0.35"/><polygon points="121.20,213.36 122.54,213.36 122.54,186.48 121.20,186.48" fill="#e3dfd6" stroke="#161616" stroke-width="0.35"/><polygon points="177.20,220.08 177.87,219.41 177.87,192.53 177.20,193.20" fill="#cfcac0" stroke="#161616" stroke-width="0.35"/><polygon points="78.64,193.20 177.20,193.20 177.87,192.53 79.31,192.53" fill="#f7f5ef" stroke="#161616" stroke-width="0.35"/><polygon points="78.64,220.08 177.20,220.08 177.20,193.20 78.64,193.20" fill="#f1efe9" stroke="#161616" stroke-width="0.35"/><polygon points="140.69,256.59 141.36,255.92 141.36,229.04 140.69,229.71" fill="#cfcac0" stroke="#161616" stroke-width="0.35"/><polygon points="42.13,229.71 140.69,229.71 141.36,229.04 42.80,229.04" fill="#f7f5ef" stroke="#161616" stroke-width="0.35"/><polygon points="42.13,256.59 140.69,256.59 140.69,229.71 42.13,229.71" fill="#f1efe9" stroke="#161616" stroke-width="0.35"/><polygon points="125.68,137.20 157.04,105.84 157.04,83.44 125.68,114.80" fill="#cfcac0" stroke="#161616" stroke-width="0.35"/><polygon points="62.96,114.80 125.68,114.80 157.04,83.44 94.32,83.44" fill="#f7f5ef" stroke="#161616" stroke-width="0.35"/><polygon points="62.96,137.20 125.68,137.20 125.68,114.80 62.96,114.80" fill="#d9d4ca" stroke="#161616" stroke-width="0.35"/><line x1="48.85" y1="214.36" x2="48.85" y2="234.76" stroke="#7a7a7a" stroke-width="0.2" stroke-dasharray="1 1"/><line x1="121.87" y1="214.36" x2="121.87" y2="234.76" stroke="#7a7a7a" stroke-width="0.2" stroke-dasharray="1 1"/><line x1="94.32" y1="137.20" x2="94.32" y2="202.16" stroke="#7a7a7a" stroke-width="0.2" stroke-dasharray="1 1"/><circle cx="35.46" cy="242.82" r="3.2" fill="#fff" stroke="#161616" stroke-width=".3"/><text x="35.46" y="243.92" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="3" font-weight="600" text-anchor="middle" fill="#161616">1</text><circle cx="40.85" cy="199.92" r="3.2" fill="#fff" stroke="#161616" stroke-width=".3"/><text x="40.85" y="201.02" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="3" font-weight="600" text-anchor="middle" fill="#161616">2</text><circle cx="54.96" cy="126.00" r="3.2" fill="#fff" stroke="#161616" stroke-width=".3"/><text x="54.96" y="127.10" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="3" font-weight="600" text-anchor="middle" fill="#161616">3</text><text x="22.00" y="262.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.1" font-weight="400" text-anchor="start" fill="#7a7a7a">Feet or pads under the plates: bought-in, to be decided by Production.</text><text x="224.00" y="266.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.1" font-weight="400" text-anchor="end" fill="#7a7a7a">قطع حماية تحت الألواح: جاهزة، تقررها التصنيع.</text><text x="235.00" y="38.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.6" font-weight="600" text-anchor="start" fill="#161616">ASSEMBLY SEQUENCE (proposed)</text><text x="410.00" y="38.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.6" font-weight="600" text-anchor="end" fill="#161616">تسلسل التجميع (مقترح)</text><circle cx="238.00" cy="47.00" r="3.2" fill="#fff" stroke="#161616" stroke-width=".3"/><text x="238.00" y="48.10" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="3" font-weight="600" text-anchor="middle" fill="#161616">1</text><text x="244.00" y="48.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">Cut the two plates 1, the two plates 2 and the tray blank 3.</text><text x="410.00" y="53.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="end" fill="#161616">قص اللوحين (١) واللوحين (٢) وقطعة الصينية (٣).</text><circle cx="238.00" cy="64.00" r="3.2" fill="#fff" stroke="#161616" stroke-width=".3"/><text x="238.00" y="65.10" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="3" font-weight="600" text-anchor="middle" fill="#161616">2</text><text x="244.00" y="65.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">Fold the tray: four walls up from the base, proposed rounded bottom edges.</text><text x="410.00" y="70.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="end" fill="#161616">ثني الصينية: أربعة جدران من القاعدة بحواف سفلية مستديرة.</text><circle cx="238.00" cy="81.00" r="3.2" fill="#fff" stroke="#161616" stroke-width=".3"/><text x="238.00" y="82.10" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="3" font-weight="600" text-anchor="middle" fill="#161616">3</text><text x="244.00" y="82.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">Set plates 1 on edge, parallel. Drop plates 2 across them, slots mating.</text><text x="410.00" y="87.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="end" fill="#161616">تثبيت اللوحين (١) على حافتهما، ثم إنزال اللوحين (٢) متقاطعين.</text><circle cx="238.00" cy="98.00" r="3.2" fill="#fff" stroke="#161616" stroke-width=".3"/><text x="238.00" y="99.10" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="3" font-weight="600" text-anchor="middle" fill="#161616">4</text><text x="244.00" y="99.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">Lower the tray into the square. Fix as Production decides.</text><text x="410.00" y="104.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="end" fill="#161616">إنزال الصينية داخل المربع وتثبيتها كما يقرر التصنيع.</text><circle cx="238.00" cy="115.00" r="3.2" fill="#fff" stroke="#161616" stroke-width=".3"/><text x="238.00" y="116.10" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="3" font-weight="600" text-anchor="middle" fill="#161616">5</text><text x="244.00" y="116.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">Finish, fit feet or pads.</text><text x="410.00" y="121.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="end" fill="#161616">التشطيب وتركيب قطع الحماية.</text></svg>