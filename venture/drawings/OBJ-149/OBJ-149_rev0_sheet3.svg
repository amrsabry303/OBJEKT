rial, sans-serif" font-size="2.1" font-weight="400" text-anchor="start" fill="#161616">MATERIAL  Steel sheet, thickness by Production</text><text x="318.00" y="274.73" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.1" font-weight="400" text-anchor="end" fill="#161616">الخامة: صفائح فولاذ، السماكة من التصنيع</text><text x="322.00" y="272.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.1" font-weight="400" text-anchor="start" fill="#161616">FINISH  to be confirmed</text><text x="410.00" y="274.73" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.1" font-weight="400" text-anchor="end" fill="#161616">التشطيب: يؤكد لاحقاً</text><text x="230.00" y="283.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="400" text-anchor="start" fill="#161616">DATE  11 Nov 2026      SHEET 3 / 5</text><text x="318.00" y="285.99" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="400" text-anchor="end" fill="#161616">التاريخ، الورقة</text><text x="322.00" y="283.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="400" text-anchor="start" fill="#161616">REV  0</text><text x="410.00" y="285.99" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="400" text-anchor="end" fill="#161616">المراجعة</text><rect x="228.00" y="233.00" width="185.00" height="12.00" fill="#fff" stroke="#b3261e" stroke-width="0.5"/><text x="320.50" y="238.40" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="3.4" font-weight="700" text-anchor="middle" fill="#b3261e">DRAFT, not approved, not engineered</text><text x="320.50" y="243.20" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="3.4" font-weight="700" text-anchor="middle" fill="#b3261e">مسودة، غير معتمدة، غير مهندسة</text><text x="10.00" y="14.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="4.2" font-weight="700" text-anchor="start" fill="#161616"