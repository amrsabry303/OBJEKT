n points="42.13,256.59 140.69,256.59 140.69,229.71 42.13,229.71" fill="#f1efe9" stroke="#161616" stroke-width="0.35"/><polygon points="137.78,259.50 138.45,258.83 138.45,231.95 137.78,232.62" fill="#cfcac0" stroke="#161616" stroke-width="0.35"/><polygon points="39.22,232.62 137.78,232.62 138.45,231.95 39.89,231.95" fill="#f7f5ef" stroke="#161616" stroke-width="0.35"/><polygon points="39.22,259.50 137.78,259.50 137.78,232.62 39.22,232.62" fill="#f1efe9" stroke="#161616" stroke-width="0.35"/><polygon points="127.92,139.44 163.76,103.60 163.76,81.20 127.92,117.04" fill="#cfcac0" stroke="#161616" stroke-width="0.35"/><polygon points="56.24,117.04 127.92,117.04 163.76,81.20 92.08,81.20" fill="#f7f5ef" stroke="#161616" stroke-width="0.35"/><polygon points="56.24,139.44 127.92,139.44 127.92,117.04 56.24,117.04" fill="#d9d4ca" stroke="#161616" stroke-width="0.35"/><line x1="47.39" y1="215.82" x2="47.39" y2="236.22" stroke="#7a7a7a" stroke-width="0.2" stroke-dasharray="1 1"/><line x1="120.42" y1="215.82" x2="120.42" y2="236.22" stroke="#7a7a7a" stroke-width="0.2" stroke-dasharray="1 1"/><line x1="92.08" y1="139.44" x2="92.08" y2="204.40" stroke="#7a7a7a" stroke-width="0.2" stroke-dasharray="1 1"/><circle cx="71.98" cy="206.30" r="3.2" fill="#fff" stroke="#161616" stroke-width=".3"/><text x="71.98" y="207.40" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="3" font-weight="600" text-anchor="middle" fill="#161616">1</text><circle cx="39.39" cy="201.38" r="3.2" fill="#fff" stroke="#161616" stroke-width=".3"/><text x="39.39" y="202.48" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="3" font-weight="600" text-anchor="middle" fill="#161616">2</text><circle cx="48.24" cy="128.24" r="3.2" fill="#fff" stroke="#161616" stroke-width=".3"/><text x="48.24" y="129.34" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="3" font-weight="600" text-anchor="middle" fill="#161616">3</text><text x="22.00" y="262.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.1" font-weight="400" text-anchor="start" fill="#7a7a7a">Feet or pads under the plates: bought-in, to be decided by Production.</text><text x="224.00" y="266.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.1" font-weight="400" text-anchor="end" fill="#7a7a7a">قطع حماية تحت الألواح: جاهزة، تقررها التصنيع.</text><text x="235.00" y="38.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.6" font-weight="600" text-anchor="start" fill="#161616">ASSEMBLY SEQUENCE (proposed)</text><text x="410.00" y="38.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.6" font-weight="600" text-anchor="end" fill="#161616">تسلسل التجميع (مقترح)</text><circle cx="238.00" cy="47.00" r="3.2" fill="#fff" stroke="#161616" stroke-width=".3"/><text x="238.00" y="48.10" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="3" font-weight="600" text-anchor="middle" fill="#161616">1</text><text x="244.00" y="48.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">Cut the three plates 1, the two plates 2 and the tray blank 3.</text><text x="410.00" y="53.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="end" fill="#161616">قص الألواح الثلاثة (١) واللوحين (٢) وقطعة الصينية (٣).</text><circle cx="238.00" cy="64.00" r="3.2" fill="#fff" stroke="#161616" stroke-width=".3"/><text x="238.00" y="65.10" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="3" font-weight="600" text-anchor="middle" fill="#161616">2</text><text x="244.00" y="65.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">Fold the tray: four walls up from the base, proposed rounded bottom edges.</text><text x="410.00" y="70.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="end" fill="#161616">ثني الصينية: أربعة جدران من القاعدة بحواف سفلية مستديرة.</text><circle cx="238.00" cy="81.00" r="3.2" fill="#fff" stroke="#161616" stroke-width=".3"/><text x="238.00" y="82.10" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="3" font-weight="600" text-anchor="middle" fill="#161616">3</text><text x="244.00" y="82.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">Set the three plates 1 on edge, parallel (two at the front, 10 apart; one at the back). Drop plates 2 across them, slots mating.</text><text x="410.00" y="87.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="end" fill="#161616">تثبيت الألواح (١) على حافتها: لوحان في الأمام بينهما ١٠ مم، ولوح في الخلف، ثم إنزال اللوحين (٢).</text><circle cx="238.00" cy="98.00" r="3.2" fill="#fff" stroke="#161616" stroke-width=".3"/><text x="238.00" y="99.10" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="3" font-weight="600" text-anchor="middle" fill="#161616">4</text><text x="244.00" y="99.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">Lower the tray into the square. Fix as Production decides.</text><text x="410.00" y="104.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="end" fill="#161616">إنزال الصينية داخل المربع وتثبيتها كما يقرر التصنيع.</text><circle cx="238.00" cy="115.00" r="3.2" fill="#fff" stroke="#161616" stroke-width=".3"/><text x="238.00" y="116.10" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="3" font-weight="600" text-anchor="middle" fill="#161616">5</text><text x="244.00" y="116.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">Finish, fit feet or pads.</text><text x="410.00" y="121.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="end" fill="#161616">التشطيب وتركيب قطع الحماية.</text></svg>