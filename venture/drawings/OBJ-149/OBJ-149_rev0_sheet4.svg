, sans-serif" font-size="2.3" font-weight="400" text-anchor="start" fill="#161616">Parts nested with 10 mm spacing in a corner of the sheet (710 x 250 mm). No offcut is claimed.</text><text x="30.00" y="200.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.5" font-weight="600" text-anchor="start" fill="#161616">Total cutting length of all parts: 3.68 m (3680 mm), outlines only, not counting folds.</text><text x="410.00" y="195.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="400" text-anchor="end" fill="#161616">الأجزاء مرتبة بمسافة ١٠ مم في ركن اللوح. لا يُدّعى أي هالك.</text><text x="410.00" y="200.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.5" font-weight="600" text-anchor="end" fill="#161616">إجمالي طول القص: 3.68 متر</text><text x="30.00" y="210.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="start" fill="#7a7a7a">The sheet is far larger than the parts; a real run would nest many ashtrays or use a smaller sheet. Production decides.</text></svg>