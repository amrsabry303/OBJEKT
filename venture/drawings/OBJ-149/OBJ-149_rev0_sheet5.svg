eight="400" text-anchor="start" fill="#161616">Steel sheet</text><line x1="10.00" y1="67.20" x2="410.00" y2="67.20" stroke="#7a7a7a" stroke-width="0.15"/><text x="12.00" y="65.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">4</text><text x="24.00" y="65.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">Feet or pads</text><text x="120.00" y="65.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="end" fill="#161616">قطع حماية</text><text x="150.00" y="65.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">by Production</text><text x="215.00" y="65.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">Bought-in, to be decided</text><text x="10.00" y="82.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.8" font-weight="600" text-anchor="start" fill="#161616">NOTES</text><text x="410.00" y="82.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.8" font-weight="600" text-anchor="end" fill="#161616">ملاحظات</text><text x="12.00" y="91.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="600" text-anchor="start" fill="#161616">1.</text><text x="18.00" y="91.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="start" fill="#161616">No dimensions were supplied. All sizes (220 x 220 x 60 overall) are estimated from the photos, with a cigarette (about 84 mm) as scale. Real size or the original file is needed.</text><text x="410.00" y="96.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="400" text-anchor="end" fill="#161616">لم تُقدَّم مقاسات. كل المقاسات مقدّرة من الصور بالسيجارة كمقياس.</text><text x="12.00" y="104.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="600" text-anchor="start" fill="#161616">2.</text><text x="18.00" y="104.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="start" fill="#161616">The construction is inferred from the photos: four plates in a # pattern, interlocking, with a folded tray in the middle. Production to confirm.</text><text x="410.00" y="109.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="400" text-anchor="end" fill="#161616">طريقة الصنع مستنتجة من الصور: أربعة ألواح متقاطعة بشكل # وصينية مثنية في الوسط.</text><text x="12.00" y="117.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="600" text-anchor="start" fill="#161616">3.</text><text x="18.00" y="117.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="start" fill="#161616">Plate thickness is drawn at 3 mm for the layout only. Material, thickness, bend radius and allowance, tolerances, fit clearance, joints and welding are Production's to decide.</text><text x="410.00" y="122.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="400" text-anchor="end" fill="#161616">السماكة ٣ مم للرسم فقط. الخامة والسماكة والثني والسماحيات واللحام يقررها التصنيع.</text><text x="12.00" y="130.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="600" text-anchor="start" fill="#161616">4.</text><text x="18.00" y="130.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="start" fill="#161616">Joint: cross-halving (slots to half the height) is proposed because the product is called interlocking plates. Welded or other joints are Production's call.</text><text x="410.00" y="135.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="400" text-anchor="end" fill="#161616">الوصلة المقترحة: تقاطع بنصف الارتفاع. غير ذلك يقرره التصنيع.</text><text x="12.00" y="143.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="600" text-anchor="start" fill="#161616">5.</text><text x="18.00" y="143.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="start" fill="#161616">The reference shows a small clip for resting a cigarette. It is not clear in the photos and is not drawn.</text><text x="410.00" y="148.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="400" text-anchor="end" fill="#161616">يظهر في المرجع مشبك صغير لوضع السيجارة، وهو غير واضح في الصور ولم يُرسم.</text><text x="12.00" y="156.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="600" text-anchor="start" fill="#161616">6.</text><text x="18.00" y="156.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="start" fill="#161616">The reference is blackened steel. That is not on the objekt finish list: Sabry to decide the finish (blackened as the reference, Carbon powder coat, or brushed stainless).</text><text x="410.00" y="161.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="400" text-anchor="end" fill="#161616">المرجع فولاذ مسوّد وهو خارج قائمة التشطيبات. يقرر سبري التشطيب.</text><text x="12.00" y="169.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="600" text-anchor="start" fill="#161616">7.</text><text x="18.00" y="169.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="start" fill="#161616">No structural claims, stress figures, costs or prices on this drawing. Not engineered. Arabic wording is a draft for a technical reader.</text><text x="410.00" y="174.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="400" text-anchor="end" fill="#161616">لا ادعاءات إنشائية ولا تكاليف ولا أسعار. الصياغة العربية مسودة.</text></svg>