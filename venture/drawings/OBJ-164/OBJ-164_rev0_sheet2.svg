nchor="start" fill="#161616">Gusset top edge 155.6 = 220 / sqrt 2 (half the front edge); vertical edge 150; welded to the underside of the top plate, vertical edge in the wall corner.</text><text x="22.00" y="225.80" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.0" font-weight="400" text-anchor="start" fill="#161616">Wall flanges 15 fold down; two dia 5 holes on each at 60 and 160 from the corner. Screws and plugs: bought-in, by Production.</text><text x="22.00" y="229.60" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.0" font-weight="400" text-anchor="start" fill="#161616">Corner relief 10 mm at the flange ends so the two flanges do not touch. Front fold 10 down along the 311.1 edge.</text><text x="22.00" y="233.40" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.0" font-weight="400" text-anchor="start" fill="#161616">Thickness 2 mm is a proposal. Bend allowance, welding, blending and brushing direction: Production.</text><text x="410.00" y="222.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.0" font-weight="400" text-anchor="end" fill="#161616">سماكة ٢ مم مقترحة. سماحية الثني واللحام والتنعيم واتجاه البشر من التصنيع.</text></svg>