ns-serif" font-size="2.1" font-weight="400" text-anchor="start" fill="#161616">MATERIAL  Stainless sheet 2 mm (proposal)</text><text x="318.00" y="274.73" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.1" font-weight="400" text-anchor="end" fill="#161616">الخامة: ستانلس ٢ مم (مقترح)</text><text x="322.00" y="272.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.1" font-weight="400" text-anchor="start" fill="#161616">FINISH  Brushed (proposal)</text><text x="410.00" y="274.73" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.1" font-weight="400" text-anchor="end" fill="#161616">التشطيب: مبشور (مقترح)</text><text x="230.00" y="283.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="400" text-anchor="start" fill="#161616">DATE  12 Nov 2026      SHEET 3 / 5</text><text x="318.00" y="285.99" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="400" text-anchor="end" fill="#161616">التاريخ، الورقة</text><text x="322.00" y="283.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="400" text-anchor="start" fill="#161616">REV  0</text><text x="410.00" y="285.99" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="400" text-anchor="end" fill="#161616">المراجعة</text><rect x="228.00" y="233.00" width="185.00" height="12.00" fill="#fff" stroke="#b3261e" stroke-width="0.5"/><text x="320.50" y="238.40" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.9" font-weight="700" text-anchor="middle" fill="#b3261e">DRAFT, not approved, not engineered</text><text x="320.50" y="243.20" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.9" font-weight="700" text-anchor="middle" fill="#b3261e">مسودة، غير معتمدة، غير مهندسة</text><text x="10.00" y="14.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="4.2" font-weight="700" text-anchor="start" fill="#161616">ASSEMBLY</text><text x="410.00" y="14.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="4.2" font-weight="700" text-anchor="end" fill="#161616">التجميع</text><text x="10.00" y="22.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.5" font-weight="600" text-anchor="start" fill="#161616">EXPLODED VIEW (proposed assembly; Production decides jigs, welds and fixings)</text><text x="410.00" y="22.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.5" font-weight="600" text-anchor="end" fill="#161616">منظر مفكك (تجميع مقترح، والتصنيع يقرر القوالب واللحام)</text><polygon points="92.80,92.20 125.80,138.40 92.80,182.20" fill="#bdbdb9" stroke="#161616" stroke-width="0.35"/><line x1="92.80" y1="56.20" x2="92.80" y2="92.20" stroke="#7a7a7a" stroke-width="0.2" stroke-dasharray="1 1"/><line x1="125.80" y1="102.40" x2="125.80" y2="138.40" stroke="#7a7a7a" stroke-width="0.2" stroke-dasharray="1 1"/><polygon points="92.80,55.00 211.60,88.00 40.00,114.40" fill="#d8d8d5" stroke="#161616" stroke-width="0.45"/><polygon points="211.60,88.00 213.72,90.97 42.12,117.37 40.00,114.40" fill="#cfcfcc" stroke="#161616" stroke-width="0.35"/><polygon points="211.60,88.00 40.00,114.40 40.00,120.40 211.60,94.00" fill="#c4c4c0" stroke="#161616" stroke-width="0.35"/><polygon points="98.20,56.50 206.20,86.50 206.20,95.50 98.20,65.50" fill="#bdbdb9" stroke="#161616" stroke-width="0.35"/><polygon points="90.40,57.70 42.40,111.70 42.40,120.70 90.40,66.70" fill="#bdbdb9" stroke="#161616" stroke-width="0.35"/><circle cx="112.60" cy="70.72" r="3.2" fill="#fff" stroke="#161616" stroke-width=".3"/><text x="112.60" y="71.82" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="3" font-weight="600" text-anchor="middle" fill="#161616">1</text><circle cx="84.80" cy="146.20" r="3.2" fill="#fff" stroke="#161616" stroke-width=".3"/><text x="84.80" y="147.30" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="3" font-weight="600" text-anchor="middle" fill="#161616">2</text><circle cx="162.20" cy="84.50" r="3.2" fill="#fff" stroke="#161616" stroke-width=".3"/><text x="162.20" y="85.60" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="3" font-weight="600" text-anchor="middle" fill="#161616">3</text><text x="22.00" y="262.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.0" font-weight="400" text-anchor="start" fill="#7a7a7a">Wall fixings (3): 4 screws and plugs per shelf, through the flanges, for the wall type (Production / installer). Heads sit under the top plate, hidden from above.</text><text x="224.00" y="266.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.0" font-weight="400" text-anchor="end" fill="#7a7a7a">التثبيت بالحائط: ٤ مسامير وفيشر لكل رف عبر الزعانف، حسب نوع الحائط.</text><text x="245.00" y="38.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.6" font-weight="600" text-anchor="start" fill="#161616">ASSEMBLY SEQUENCE (proposed)</text><text x="410.00" y="38.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.6" font-weight="600" text-anchor="end" fill="#161616">تسلسل التجميع (مقترح)</text><circle cx="248.00" cy="47.00" r="3.2" fill="#fff" stroke="#161616" stroke-width=".3"/><text x="248.00" y="48.10" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="3" font-weight="600" text-anchor="middle" fill="#161616">1</text><text x="254.00" y="48.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="start" fill="#161616">Cut parts 1 and 2 from the DXF files; deburr.</text><text x="410.00" y="53.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="end" fill="#161616">قص القطعتين ١ و٢ من ملفات DXF وتنعيم الحواف.</text><circle cx="248.00" cy="64.00" r="3.2" fill="#fff" stroke="#161616" stroke-width=".3"/><text x="248.00" y="65.10" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="3" font-weight="600" text-anchor="middle" fill="#161616">2</text><text x="254.00" y="65.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="start" fill="#161616">Fold the front edge and the two wall flanges of the top plate (1).</text><text x="410.00" y="70.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="end" fill="#161616">ثني الحافة الأمامية وزعنفتي الحائط في لوح الرف (١).</text><circle cx="248.00" cy="81.00" r="3.2" fill="#fff" stroke="#161616" stroke-width=".3"/><text x="248.00" y="82.10" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="3" font-weight="600" text-anchor="middle" fill="#161616">3</text><text x="254.00" y="82.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="start" fill="#161616">Weld the gusset (2) under the top plate, vertical edge in the corner; blend the weld.</text><text x="410.00" y="87.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="end" fill="#161616">لحام لوح التدعيم (٢) تحت لوح الرف مع الركن وتنعيم اللحام.</text><circle cx="248.00" cy="98.00" r="3.2" fill="#fff" stroke="#161616" stroke-width=".3"/><text x="248.00" y="99.10" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="3" font-weight="600" text-anchor="middle" fill="#161616">4</text><text x="254.00" y="99.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="start" fill="#161616">Brush the finish in one direction on all visible faces.</text><text x="410.00" y="104.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="end" fill="#161616">بشر السطح في اتجاه واحد على كل الوجوه الظاهرة.</text><circle cx="248.00" cy="115.00" r="3.2" fill="#fff" stroke="#161616" stroke-width=".3"/><text x="248.00" y="116.10" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="3" font-weight="600" text-anchor="middle" fill="#161616">5</text><text x="254.00" y="116.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="start" fill="#161616">Fix to the wall through the flanges (3); two screws per wall side. Make two shelves for the pair.</text><text x="410.00" y="121.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="end" fill="#161616">التثبيت بالحائط عبر الزعانف (٣). صنع رفين للزوج.</text></svg>