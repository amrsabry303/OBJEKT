ns-serif" font-size="2.1" font-weight="400" text-anchor="start" fill="#161616">MATERIAL  Stainless sheet 2 mm (proposal)</text><text x="318.00" y="274.73" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.1" font-weight="400" text-anchor="end" fill="#161616">الخامة: ستانلس ٢ مم (مقترح)</text><text x="322.00" y="272.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.1" font-weight="400" text-anchor="start" fill="#161616">FINISH  Brushed (proposal)</text><text x="410.00" y="274.73" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.1" font-weight="400" text-anchor="end" fill="#161616">التشطيب: مبشور (مقترح)</text><text x="230.00" y="283.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="400" text-anchor="start" fill="#161616">DATE  12 Nov 2026      SHEET 5 / 5</text><text x="318.00" y="285.99" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="400" text-anchor="end" fill="#161616">التاريخ، الورقة</text><text x="322.00" y="283.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="400" text-anchor="start" fill="#161616">REV  0</text><text x="410.00" y="285.99" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="400" text-anchor="end" fill="#161616">المراجعة</text><rect x="228.00" y="233.00" width="185.00" height="12.00" fill="#fff" stroke="#2f6b45" stroke-width="0.5"/><text x="320.50" y="238.40" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.5" font-weight="700" text-anchor="middle" fill="#2f6b45">Approved by Sabry 12 Nov 2026. Production review pending. Not engineered</text><text x="320.50" y="243.20" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.5" font-weight="700" text-anchor="middle" fill="#2f6b45">معتمد من سبري ١٢ نوفمبر ٢٠٢٦. بانتظار مراجعة التصنيع. غير مهندس</text><text x="10.00" y="14.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="4.2" font-weight="700" text-anchor="start" fill="#161616">BILL OF MATERIALS AND NOTES</text><text x="410.00" y="14.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="4.2" font-weight="700" text-anchor="end" fill="#161616">قائمة المواد والملاحظات</text><text x="10.00" y="28.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.8" font-weight="600" text-anchor="start" fill="#161616">BILL OF MATERIALS (for one PAIR = 2 shelves)</text><text x="410.00" y="28.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.8" font-weight="600" text-anchor="end" fill="#161616">قائمة المواد (لزوج = رفان)</text><rect x="10.00" y="31.00" width="400.00" height="7.00" fill="#e9e5dc" stroke="#161616" stroke-width="0.3"/><text x="12.00" y="36.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="600" text-anchor="start" fill="#161616">ITEM</text><text x="24.00" y="36.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="600" text-anchor="start" fill="#161616">PART / الجزء</text><text x="150.00" y="36.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="600" text-anchor="start" fill="#161616">QTY / العدد</text><text x="215.00" y="36.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="600" text-anchor="start" fill="#161616">MATERIAL / الخامة</text><line x1="10.00" y1="46.20" x2="410.00" y2="46.20" stroke="#7a7a7a" stroke-width="0.15"/><text x="12.00" y="44.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">1</text><text x="24.00" y="44.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">Top plate with front fold and flanges</text><text x="140.00" y="44.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="end" fill="#161616">لوح الرف بالثنية والزعانف</text><text x="150.00" y="44.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">2</text><text x="215.00" y="44.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">Stainless sheet 2 mm, brushed (proposal)</text><line x1="10.00" y1="53.20" x2="410.00" y2="53.20" stroke="#7a7a7a" stroke-width="0.15"/><text x="12.00" y="51.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">2</text><text x="24.00" y="51.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">Gusset plate</text><text x="140.00" y="51.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="end" fill="#161616">لوح التدعيم</text><text x="150.00" y="51.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">2</text><text x="215.00" y="51.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">Stainless sheet 2 mm, brushed (proposal)</text><line x1="10.00" y1="60.20" x2="410.00" y2="60.20" stroke="#7a7a7a" stroke-width="0.15"/><text x="12.00" y="58.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">3</text><text x="24.00" y="58.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">Wall screw and plug</text><text x="140.00" y="58.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="end" fill="#161616">مسمار وفيشر للحائط</text><text x="150.00" y="58.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">8 (4 per shelf)</text><text x="215.00" y="58.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">Bought-in; for the wall type, by Production</text><text x="10.00" y="80.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.8" font-weight="600" text-anchor="start" fill="#161616">NOTES</text><text x="410.00" y="80.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.8" font-weight="600" text-anchor="end" fill="#161616">ملاحظات</text><text x="12.00" y="89.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="600" text-anchor="start" fill="#161616">1.</text><text x="18.00" y="89.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="start" fill="#161616">Leg length 220 x 220 mm is Sabry's size (the production-book caption reads "2pc 22x22CM"), taken as the two straight edges that run along the walls. Front edge about 311 mm.</text><text x="410.00" y="94.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="end" fill="#161616">الضلعان ٢٢٠ × ٢٢٠ مم (مقاس سبري) على الحائطين، والحافة الأمامية حوالي ٣١١ مم.</text><text x="12.00" y="102.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="600" text-anchor="start" fill="#161616">2.</text><text x="18.00" y="102.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="start" fill="#161616">Proposals, not costed, Production to confirm: stainless sheet 2 mm, brushed; front fold 10 mm; gusset drop 150 mm (overall height 152); wall flanges 15 mm with 4 holes dia 5 per shelf; sold as a pair.</text><text x="410.00" y="107.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="end" fill="#161616">مقترحات غير مسعرة يؤكدها التصنيع: ستانلس ٢ مم مبشور، ثنية ١٠ مم، تدعيم ١٥٠ مم، زعانف ١٥ مم، زوج.</text><text x="12.00" y="115.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="600" text-anchor="start" fill="#161616">3.</text><text x="18.00" y="115.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="start" fill="#161616">Shape inferred from one photo of unknown maker: flat triangular top, a deep triangular gusset under it with its vertical edge in the wall corner, crisp edge, no visible fixings. Drawn as objekt's own design. The device on the shelf is not ours and not drawn.</text><text x="410.00" y="120.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="end" fill="#161616">الشكل مقدّر من صورة واحدة، ومرسوم كتصميم خاص بأوبجيكت. الجهاز على الرف ليس لنا.</text><text x="12.00" y="128.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="600" text-anchor="start" fill="#161616">4.</text><text x="18.00" y="128.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="start" fill="#161616">Hidden fixing: the screws pass through the folded flanges against the wall and are covered by the top plate from above. Wall type and plugs are not known: Production / installer to decide.</text><text x="410.00" y="133.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="end" fill="#161616">التثبيت مخفي: المسامير عبر الزعانف ومغطاة بلوح الرف من أعلى.</text><text x="12.00" y="141.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="600" text-anchor="start" fill="#161616">5.</text><text x="18.00" y="141.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="start" fill="#161616">Finish: exposed brushed stainless, no paint (proposal). Stainless grade, brushing direction and welding / blending method are Production's to decide.</text><text x="410.00" y="146.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="end" fill="#161616">التشطيب: ستانلس مبشور بدون دهان (مقترح). النوع واتجاه البشر واللحام من التصنيع.</text><text x="12.00" y="154.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="600" text-anchor="start" fill="#161616">6.</text><text x="18.00" y="154.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="start" fill="#161616">Material, thickness, bend allowance, tolerances, sheet size, joints and finish details are Production's to decide.</text><text x="410.00" y="159.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="end" fill="#161616">الخامة والسماكة والسماحيات واللحام وتفاصيل التشطيب يقررها التصنيع.</text><text x="12.00" y="167.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="600" text-anchor="start" fill="#161616">7.</text><text x="18.00" y="167.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="start" fill="#161616">No structural claims, stress figures, load figures, costs or prices on this drawing. Not engineered. A stated shelf load is not claimed until Production tests it. Arabic wording is a draft for a technical reader.</text><text x="410.00" y="172.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="end" fill="#161616">لا ادعاءات إنشائية ولا حمل مذكور ولا تكاليف. الصياغة العربية مسودة.</text></svg>