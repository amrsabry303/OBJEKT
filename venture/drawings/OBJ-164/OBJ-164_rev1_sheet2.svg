ical plate faces the room, so no screw can go through it without being seen. How it is held to the left wall (bonded, keyed or other) is not drawn: Production to decide.</text><text x="22.00" y="243.40" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.0" font-weight="400" text-anchor="start" fill="#161616">Left-hand and mirrored right-hand versions: the drawing shows one hand. Whether the pair is two of the same or a mirrored pair: Sabry to confirm.</text><text x="22.00" y="247.20" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.0" font-weight="400" text-anchor="start" fill="#161616">Bend radius and allowance, brushing direction and blending: Production.</text><text x="410.00" y="232.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.0" font-weight="400" text-anchor="end" fill="#161616">مثلث واحد مثني ٩٠° عند K-L. طريقة تثبيت اللوح الرأسي بالحائط الأيسر يقررها التصنيع.</text></svg>