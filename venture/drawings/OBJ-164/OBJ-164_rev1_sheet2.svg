0, sloped edge 353.6</text><line x1="235.00" y1="92.60" x2="400.00" y2="92.60" stroke="#7a7a7a" stroke-width="0.12"/><text x="235.00" y="96.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.1" font-weight="400" text-anchor="start" fill="#161616">Bend</text><text x="295.00" y="96.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.1" font-weight="600" text-anchor="start" fill="#161616">90 deg along K-L</text><line x1="235.00" y1="97.60" x2="400.00" y2="97.60" stroke="#7a7a7a" stroke-width="0.12"/><text x="235.00" y="101.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.1" font-weight="400" text-anchor="start" fill="#161616">Vertical plate holes</text><text x="295.00" y="101.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.1" font-weight="600" text-anchor="start" fill="#161616">2 dia 5, 20 from the bend</text><line x1="235.00" y1="102.60" x2="400.00" y2="102.60" stroke="#7a7a7a" stroke-width="0.12"/><text x="235.00" y="106.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.1" font-weight="400" text-anchor="start" fill="#161616">Outline length each</text><text x="295.00" y="106.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.1" font-weight="600" text-anchor="start" fill="#161616">1239</text><line x1="235.00" y1="107.60" x2="400.00" y2="107.60" stroke="#7a7a7a" stroke-width="0.12"/><text x="22.00" y="232.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.0" font-weight="400" text-anchor="start" fill="#161616">One triangle sheet, bent 90 degrees along K-L (Sabry, 15 Nov). Folded: K-R-L lies flat as the shelf; K-L-P stands vertical on the left wall.</text><text x="22.00" y="235.80" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.0" font-weight="400" text-anchor="start" fill="#161616">Vertical edge K-P = 250 in the wall corner; sloped edge L-P = 353.6.</text><text x="22.00" y="239.60" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.0" font-weight="400" text-anchor="start" fill="#161616">Vertical plate: two dia 5 screw holes (Sabry, 15 Nov), 20 below the bend line, at 40 and 130 from K along K-L (in the flat sheet they are 20 left of the bend line).</text><text x="22.00" y="243.40" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.0" font-weight="400" text-anchor="start" fill="#161616">The two plate screws are seen from the room (screw type and finish: Production). Wall type and plugs are not known.</text><text x="22.00" y="247.20" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.0" font-weight="400" text-anchor="start" fill="#161616">Left-hand and mirrored right-hand versions: the drawing shows one hand. Whether the pair is two of the same or a mirrored pair: Sabry to confirm.</text><text x="22.00" y="251.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.0" font-weight="400" text-anchor="start" fill="#161616">Bend radius and allowance, brushing direction and blending: Production.</text><text x="410.00" y="232.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.0" font-weight="400" text-anchor="end" fill="#161616">مثلث واحد مثني ٩٠° عند K-L. طريقة تثبيت اللوح الرأسي بالحائط الأيسر يقررها التصنيع.</text></svg>