ight="700" text-anchor="start" fill="#161616">FOLDED VIEW AND ASSEMBLY</text><text x="410.00" y="14.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="4.2" font-weight="700" text-anchor="end" fill="#161616">منظر مثني والتجميع</text><text x="10.00" y="22.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.5" font-weight="600" text-anchor="start" fill="#161616">FOLDED SHELF (proposed; Production decides forming, jigs and fixings)</text><text x="410.00" y="22.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.5" font-weight="600" text-anchor="end" fill="#161616">الرف بعد الثني (مقترح، والتصنيع يقرر التشكيل والقوالب والتثبيت)</text><polygon points="85.60,71.24 23.60,140.99 85.60,226.24" fill="#bdbdb9" stroke="#161616" stroke-width="0.35"/><polygon points="85.60,70.00 225.10,108.75 23.60,139.75" fill="#d8d8d5" stroke="#161616" stroke-width="0.45"/><circle cx="108.85" cy="96.55" r="3.2" fill="#fff" stroke="#161616" stroke-width=".3"/><text x="108.85" y="97.65" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="3" font-weight="600" text-anchor="middle" fill="#161616">1</text><circle cx="57.00" cy="140.67" r="3.2" fill="#fff" stroke="#161616" stroke-width=".3"/><text x="57.00" y="141.77" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="3" font-weight="600" text-anchor="middle" fill="#161616">2</text><text x="77.60" y="67.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.6" font-weight="600" text-anchor="start" fill="#2a4a7a">K</text><text x="17.60" y="140.75" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.6" font-weight="600" text-anchor="start" fill="#2a4a7a">L</text><text x="227.10" y="107.75" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.6" font-weight="600" text-anchor="start" fill="#2a4a7a">R</text><text x="77.60" y="230.24" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.6" font-weight="600" text-anchor="start" fill="#2a4a7a">P</text><text x="22.00" y="262.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.0" font-weight="400" text-anchor="start" fill="#7a7a7a">Fixing: 2 screws and plugs per shelf, through the two holes in the vertical plate (2) into the left wall, seen from the room. No flange.</text><text x="224.00" y="266.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.0" font-weight="400" text-anchor="end" fill="#7a7a7a">التثبيت: مسماران وفيشر لكل رف عبر ثقبي اللوح الرأسي في الحائط الأيسر، ظاهران من الغرفة. بدون زعنفة.</text><text x="245.00" y="38.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.6" font-weight="600" text-anchor="start" fill="#161616">ASSEMBLY SEQUENCE (proposed)</text><text x="410.00" y="38.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.6" font-weight="600" text-anchor="end" fill="#161616">تسلسل التجميع (مقترح)</text><circle cx="248.00" cy="47.00" r="3.2" fill="#fff" stroke="#161616" stroke-width=".3"/><text x="248.00" y="48.10" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="3" font-weight="600" text-anchor="middle" fill="#161616">1</text><text x="254.00" y="48.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="start" fill="#161616">Cut part 1 (one triangle, outline and holes) from the DXF file; deburr.</text><text x="410.00" y="53.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="end" fill="#161616">قص القطعة ١ (مثلث واحد بالفتحات) من ملف DXF وتنعيم الحواف.</text><circle cx="248.00" cy="64.00" r="3.2" fill="#fff" stroke="#161616" stroke-width=".3"/><text x="248.00" y="65.10" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="3" font-weight="600" text-anchor="middle" fill="#161616">2</text><text x="254.00" y="65.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="start" fill="#161616">Bend the sheet 90 degrees along K-L: K-R-L becomes the top, K-L-P the vertical plate.</text><text x="410.00" y="70.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="end" fill="#161616">ثني اللوح ٩٠° عند K-L: يصبح K-R-L الرف وK-L-P اللوح الرأسي.</text><circle cx="248.00" cy="81.00" r="3.2" fill="#fff" stroke="#161616" stroke-width=".3"/><text x="248.00" y="82.10" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="3" font-weight="600" text-anchor="middle" fill="#161616">3</text><text x="254.00" y="82.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="start" fill="#161616">Brush the finish in one direction on all visible faces.</text><text x="410.00" y="87.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="end" fill="#161616">بشر السطح في اتجاه واحد على كل الوجوه الظاهرة.</text><circle cx="248.00" cy="98.00" r="3.2" fill="#fff" stroke="#161616" stroke-width=".3"/><text x="248.00" y="99.10" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="3" font-weight="600" text-anchor="middle" fill="#161616">4</text><text x="254.00" y="99.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="start" fill="#161616">Fix to the left wall with 2 screws per shelf, through the plate holes; make two shelves for the pair (same hand or mirrored: Sabry to confirm).</text><text x="410.00" y="104.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="end" fill="#161616">التثبيت بالحائطين، وصنع رفين للزوج (نفس الاتجاه أو معكوس: سبري يؤكد).</text></svg>