if" font-size="2.1" font-weight="400" text-anchor="start" fill="#161616">MATERIAL  Stainless sheet 2 mm (proposal)</text><text x="318.00" y="274.73" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.1" font-weight="400" text-anchor="end" fill="#161616">الخامة: ستانلس ٢ مم (مقترح)</text><text x="322.00" y="272.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.1" font-weight="400" text-anchor="start" fill="#161616">FINISH  Brushed (proposal)</text><text x="410.00" y="274.73" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.1" font-weight="400" text-anchor="end" fill="#161616">التشطيب: مبشور (مقترح)</text><text x="230.00" y="283.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="400" text-anchor="start" fill="#161616">DATE  16 Nov 2026      SHEET 5 / 5</text><text x="318.00" y="285.99" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="400" text-anchor="end" fill="#161616">التاريخ، الورقة</text><text x="322.00" y="283.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="400" text-anchor="start" fill="#161616">REV  1</text><text x="410.00" y="285.99" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="400" text-anchor="end" fill="#161616">المراجعة</text><rect x="228.00" y="233.00" width="185.00" height="12.00" fill="#fff" stroke="#2f6b45" stroke-width="0.5"/><text x="320.50" y="238.40" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.5" font-weight="700" text-anchor="middle" fill="#2f6b45">Approved by Sabry 16 Nov 2026. Production review pending. Not engineered</text><text x="320.50" y="243.20" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.5" font-weight="700" text-anchor="middle" fill="#2f6b45">معتمد من سبري ١٦ نوفمبر ٢٠٢٦. بانتظار مراجعة التصنيع. غير مهندس</text><text x="10.00" y="14.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="4.2" font-weight="700" text-anchor="start" fill="#161616">BILL OF MATERIALS AND NOTES</text><text x="410.00" y="14.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="4.2" font-weight="700" text-anchor="end" fill="#161616">قائمة المواد والملاحظات</text><text x="10.00" y="28.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.8" font-weight="600" text-anchor="start" fill="#161616">BILL OF MATERIALS (for one PAIR = 2 shelves)</text><text x="410.00" y="28.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.8" font-weight="600" text-anchor="end" fill="#161616">قائمة المواد (لزوج = رفان)</text><rect x="10.00" y="31.00" width="400.00" height="7.00" fill="#e9e5dc" stroke="#161616" stroke-width="0.3"/><text x="12.00" y="36.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="600" text-anchor="start" fill="#161616">ITEM</text><text x="24.00" y="36.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="600" text-anchor="start" fill="#161616">PART / الجزء</text><text x="150.00" y="36.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="600" text-anchor="start" fill="#161616">QTY / العدد</text><text x="215.00" y="36.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="600" text-anchor="start" fill="#161616">MATERIAL / الخامة</text><line x1="10.00" y1="46.20" x2="410.00" y2="46.20" stroke="#7a7a7a" stroke-width="0.15"/><text x="12.00" y="44.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">1</text><text x="24.00" y="44.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">Wedge sheet: one triangle bent 90 deg (top and vertical plate)</text><text x="140.00" y="44.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="end" fill="#161616">لوح الوتد: مثلث واحد مثني ٩٠°</text><text x="150.00" y="44.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">2</text><text x="215.00" y="44.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">Stainless sheet 2 mm, brushed (proposal)</text><line x1="10.00" y1="53.20" x2="410.00" y2="53.20" stroke="#7a7a7a" stroke-width="0.15"/><text x="12.00" y="51.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">2</text><text x="24.00" y="51.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">Wall screw and plug</text><text x="140.00" y="51.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="end" fill="#161616">مسمار وفيشر للحائط</text><text x="150.00" y="51.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">4 (2 per shelf, through the plate)</text><text x="215.00" y="51.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">Bought-in; for the wall type, by Production</text><line x1="10.00" y1="60.20" x2="410.00" y2="60.20" stroke="#7a7a7a" stroke-width="0.15"/><text x="12.00" y="58.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">3</text><text x="24.00" y="58.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">Screw finish for the visible plate screws</text><text x="140.00" y="58.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="end" fill="#161616">تشطيب مسماري اللوح الرأسي</text><text x="150.00" y="58.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">4</text><text x="215.00" y="58.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">Production to decide (match the brushed stainless)</text><text x="10.00" y="80.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.8" font-weight="600" text-anchor="start" fill="#161616">NOTES</text><text x="410.00" y="80.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.8" font-weight="600" text-anchor="end" fill="#161616">ملاحظات</text><text x="12.00" y="89.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="600" text-anchor="start" fill="#161616">1.</text><text x="18.00" y="89.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.0" font-weight="400" text-anchor="start" fill="#161616">REV 1 (approved by Sabry 16 Nov 2026) replaces rev 0, which was wrong. Sabry: it is a wedge, one triangle sheet bent at 90 degrees. Folded along K-L it gives a horizontal triangular top and a vertical triangular plate flat on the left wall.</text><text x="410.00" y="93.50" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.0" font-weight="400" text-anchor="end" fill="#161616">المراجعة ١ تحل محل ٠: وتد من مثلث واحد مثني ٩٠°، رف أفقي ولوح رأسي على الحائط الأيسر.</text><text x="12.00" y="101.50" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="600" text-anchor="start" fill="#161616">2.</text><text x="18.00" y="101.50" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.0" font-weight="400" text-anchor="start" fill="#161616">Leg length 250 x 250 mm is Sabry's size (15 Nov: "make it 25 x 25"; it was 220 x 220 / book caption "2pc 22x22CM" before), the two straight edges along the walls. Front edge about 354 mm.</text><text x="410.00" y="106.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.0" font-weight="400" text-anchor="end" fill="#161616">الضلعان ٢٥٠ × ٢٥٠ مم (مقاس سبري) على الحائطين، والحافة الأمامية حوالي ٣٥٤ مم.</text><text x="12.00" y="114.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="600" text-anchor="start" fill="#161616">3.</text><text x="18.00" y="114.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.0" font-weight="400" text-anchor="start" fill="#161616">Proposals, not costed, Production to confirm: stainless 2 mm, brushed; vertical plate the same triangle as the top, 250 x 250 mm (Sabry, 16 Nov: symmetrical, equal size), so overall height 252; 2 screw holes dia 5 in the vertical plate per shelf and no flange (Sabry, 16 Nov); sold as a pair.</text><text x="410.00" y="118.50" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.0" font-weight="400" text-anchor="end" fill="#161616">مقترحات غير مسعرة يؤكدها التصنيع: ستانلس ٢ مم مبشور، اللوح الرأسي مثلث مطابق للرف ٢٥٠ × ٢٥٠ مم، الارتفاع الكلي ٢٥٢ مم، ثقبان في اللوح بدون زعنفة، زوج.</text><text x="12.00" y="126.50" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="600" text-anchor="start" fill="#161616">4.</text><text x="18.00" y="126.50" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.0" font-weight="400" text-anchor="start" fill="#161616">Shape read from one photo of unknown maker and Sabry's correction. Drawn as objekt's own design. The device on the shelf is not ours and not drawn.</text><text x="410.00" y="131.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.0" font-weight="400" text-anchor="end" fill="#161616">الشكل من صورة واحدة وتصحيح سبري ومرسوم كتصميم خاص بأوبجيكت. الجهاز على الرف ليس لنا.</text><text x="12.00" y="139.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="600" text-anchor="start" fill="#161616">5.</text><text x="18.00" y="139.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.0" font-weight="400" text-anchor="start" fill="#161616">Open for Sabry: is the pair two of the same hand or a mirrored pair (plate on the left wall for one, on the right wall for the other)? Drawing shows the plate on the left wall.</text><text x="410.00" y="143.50" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.0" font-weight="400" text-anchor="end" fill="#161616">مفتوح: هل الزوج متماثل الاتجاه أم معكوس؟ الرسم يبين اللوح على الحائط الأيسر.</text><text x="12.00" y="151.50" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="600" text-anchor="start" fill="#161616">6.</text><text x="18.00" y="151.50" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.0" font-weight="400" text-anchor="start" fill="#161616">Fixing (Sabry, 15-16 Nov): two screw holes dia 5 in the vertical plate, seen from the room, and nothing else: no flange, no other holes. Wall type, plugs and screw finish are not known: Production / installer to decide. A shelf held by two screws on one wall only: Production to confirm it is enough.</text><text x="410.00" y="156.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.0" font-weight="400" text-anchor="end" fill="#161616">التثبيت: ثقبان فقط في اللوح الرأسي ظاهران من الغرفة، بدون زعنفة. النوع والفيشر والمسامير يقررها التصنيع، والتصنيع يؤكد كفاية مسمارين على حائط واحد.</text><text x="12.00" y="164.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="600" text-anchor="start" fill="#161616">7.</text><text x="18.00" y="164.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.0" font-weight="400" text-anchor="start" fill="#161616">Finish: exposed brushed stainless, no paint (proposal). Stainless grade, brushing direction, bend radius and allowance, tolerances, sheet size are Production's to decide.</text><text x="410.00" y="168.50" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.0" font-weight="400" text-anchor="end" fill="#161616">التشطيب: ستانلس مبشور بدون دهان (مقترح). باقي التفاصيل يقررها التصنيع.</text><text x="12.00" y="176.50" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="600" text-anchor="start" fill="#161616">8.</text><text x="18.00" y="176.50" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.0" font-weight="400" text-anchor="start" fill="#161616">No structural claims, stress figures, load figures, costs or prices on this drawing. Not engineered. A stated shelf load is not claimed until Production tests it. Arabic wording is a draft for a technical reader.</text><text x="410.00" y="181.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.0" font-weight="400" text-anchor="end" fill="#161616">لا ادعاءات إنشائية ولا حمل مذكور ولا تكاليف. الصياغة العربية مسودة.</text></svg>