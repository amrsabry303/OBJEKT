<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 297" width="420mm" height="297mm" font-family="DejaVu Sans, Arial, sans-serif"><rect width="420" height="297" fill="#fff"/><rect x="7" y="7" width="406" height="283" fill="none" stroke="#1b1b1b" stroke-width="0.35"/><image x="11" y="10.5" width="22" height="14" preserveAspectRatio="xMidYMid meet" href="data:image/svg+xml;base64,"/><text x="38.00" y="17.00" font-size="5" text-anchor="start" fill="#1b1b1b" font-weight="bold">OBJ-166  Plinth, square box, two heights</text><text x="38.00" y="22.50" font-size="3.2" text-anchor="start" fill="#444">Assembly</text><text x="409.00" y="17.00" font-size="5" text-anchor="start" fill="#1b1b1b" font-weight="bold" direction="rtl" unicode-bidi="plaintext">قاعدة عرض، صندوق مربع، ارتفاعان  OBJ-166</text><text x="409.00" y="22.50" font-size="3.2" text-anchor="start" fill="#444" direction="rtl" unicode-bidi="plaintext">التجميع</text><line x1="7.00" y1="27.00" x2="413.00" y2="27.00" stroke="#1b1b1b" stroke-width="0.25"/><text x="20.00" y="34.00" font-size="2.8" text-anchor="start" fill="#1b1b1b" font-weight="bold">EXPLODED VIEW  1:12  (1000 version)</text><text x="20.00" y="37.64" font-size="2.8" text-anchor="end" fill="#444" direction="rtl" unicode-bidi="plaintext">منظور مفكوك (نسخة ١٠٠٠)</text><path d="M105.32,159.16 L116.04,151.97 L116.04,72.79 L105.32,79.98 Z" fill="#8a8f95" stroke="#1b1b1b" stroke-width="0.3" stroke-linejoin="round"/><path d="M90.00,154.13 L105.32,159.16 L105.32,79.98 L90.00,74.95 Z" fill="#a2a7ad" stroke="#1b1b1b" stroke-width="0.3" stroke-linejoin="round"/><path d="M90.00,74.95 L105.32,79.98 L116.04,72.79 L100.73,67.76 Z" fill="#b9bdc2" stroke="#1b1b1b" stroke-width="0.3" stroke-linejoin="round"/><path d="M90.36,65.69 L105.26,70.59 L115.69,63.59 L100.79,58.69 Z" fill="#b9bdc2" stroke="#1b1b1b" stroke-width="0.3" stroke-linejoin="round"/><path d="M105.26,70.81 L115.69,63.82 L115.69,63.59 L105.26,70.59 Z" fill="#8a8f95" stroke="#1b1b1b" stroke-width="0.3" stroke-linejoin="round"/><path d="M90.36,65.91 L105.26,70.81 L105.26,70.59 L90.36,65.69 Z" fill="#a2a7ad" stroke="#1b1b1b" stroke-width="0.3" stroke-linejoin="round"/><path d="M90.36,158.60 L105.26,163.50 L115.69,156.50 L100.79,151.61 Z" fill="#b9bdc2" stroke="#1b1b1b" stroke-width="0.3" stroke-linejoin="round"/><path d="M105.26,163.72 L115.69,156.73 L115.69,156.50 L105.26,163.50 Z" fill="#8a8f95" stroke="#1b1b1b" stroke-width="0.3" stroke-linejoin="round"/><path d="M90.36,158.83 L105.26,163.72 L105.26,163.50 L90.36,158.60 Z" fill="#a2a7ad" stroke="#1b1b1b" stroke-width="0.3" stroke-linejoin="round"/><text x="215.00" y="34.00" font-size="2.8" text-anchor="start" fill="#1b1b1b" font-weight="bold">ASSEMBLY SEQUENCE (proposed)</text><text x="215.00" y="37.64" font-size="2.8" text-anchor="end" fill="#444" direction="rtl" unicode-bidi="plaintext">تسلسل التجميع (مقترح)</text><text x="215.00" y="44.00" font-size="2.4" text-anchor="start" fill="#1b1b1b" font-weight="bold">1.</text><text x="221.00" y="44.00" font-size="2.0" text-anchor="start" fill="#1b1b1b">Fold the blank on its three bend lines into a square tube. Hold it in a square jig, weld the butt seam, grind flush.</text><text x="221.00" y="46.60" font-size="2.0" text-anchor="end" fill="#444" direction="rtl" unicode-bidi="plaintext">ثني الشريحة على خطوط الثني الثلاثة إلى أنبوب مربع، ثم لحام الوصلة وتنعيمها.</text><text x="215.00" y="61.00" font-size="2.4" text-anchor="start" fill="#1b1b1b" font-weight="bold">2.</text><text x="221.00" y="61.00" font-size="2.0" text-anchor="start" fill="#1b1b1b">Weld the top plate into the top of the tube, flush with the edge all round. Grind flush.</text><text x="221.00" y="63.60" font-size="2.0" text-anchor="end" fill="#444" direction="rtl" unicode-bidi="plaintext">لحام اللوح العلوي داخل أعلى الأنبوب بمحاذاة الحافة وتنعيمه.</text><text x="215.00" y="78.00" font-size="2.4" text-anchor="start" fill="#1b1b1b" font-weight="bold">3.</text><text x="221.00" y="78.00" font-size="2.0" text-anchor="start" fill="#1b1b1b">Weld the four M6 weld nuts to the bottom plate, then weld the plate into the bottom of the tube, flush. Grind flush.</text><text x="221.00" y="80.60" font-size="2.0" text-anchor="end" fill="#444" direction="rtl" unicode-bidi="plaintext">لحام أربعة صواميل M6 باللوح السفلي ثم لحامه أسفل الأنبوب وتنعيمه.</text><text x="215.00" y="95.00" font-size="2.4" text-anchor="start" fill="#1b1b1b" font-weight="bold">4.</text><text x="221.00" y="95.00" font-size="2.0" text-anchor="start" fill="#1b1b1b">Finish: brushed stainless, brush the four sides along the length and the top. Mirror: polish after welding.</text><text x="221.00" y="97.60" font-size="2.0" text-anchor="end" fill="#444" direction="rtl" unicode-bidi="plaintext">التشطيب: تصنفير الجوانب الأربعة بالطول والسطح، أو تلميع مرآة بعد اللحام.</text><text x="215.00" y="112.00" font-size="2.4" text-anchor="start" fill="#1b1b1b" font-weight="bold">5.</text><text x="221.00" y="112.00" font-size="2.0" text-anchor="start" fill="#1b1b1b">Screw in the four feet after finishing. Check it stands plumb and does not rock.</text><text x="221.00" y="114.60" font-size="2.0" text-anchor="end" fill="#444" direction="rtl" unicode-bidi="plaintext">تركيب الأقدام الأربعة بعد التشطيب والتأكد من الاستواء وعدم الاهتزاز.</text><text x="215.00" y="140.00" font-size="2.6" text-anchor="start" fill="#1b1b1b" font-weight="bold">DETAIL F: FOOT</text><text x="215.00" y="143.38" font-size="2.6" text-anchor="end" fill="#444" direction="rtl" unicode-bidi="plaintext">تفصيل و: القدم</text><text x="215.00" y="148.00" font-size="1.9" text-anchor="start" fill="#1b1b1b">Turned foot with M6 stud, about Ø16 x 5 high, 22 in from each outer edge, screwed into a weld nut behind</text><text x="215.00" y="152.00" font-size="1.9" text-anchor="start" fill="#1b1b1b">the bottom plate. It lifts the box 5 off the floor. Size, material and thread: Production. Estimated from Sabry's close-up photo.</text><text x="215.00" y="162.00" font-size="1.9" text-anchor="start" fill="#555">A proposal. Jigs, tack positions, weld type and grinding are for Production.</text><rect x="263" y="242" width="150" height="11" fill="#f0f8f2" stroke="#1d6b3a" stroke-width="0.4"/><text x="266.00" y="246.70" font-size="2.7" text-anchor="start" fill="#1d6b3a" font-weight="bold">Approved by Sabry 11 Nov 2026. Production review pending. Not engineered</text><text x="410.00" y="250.80" font-size="2.5" text-anchor="start" fill="#1d6b3a" direction="rtl" unicode-bidi="plaintext">معتمد من صبري ١١ نوفمبر ٢٠٢٦. مراجعة الإنتاج قيد الانتظار. بدون مراجعة هندسية</text><rect x="263" y="253" width="150" height="37" fill="#fff" stroke="#1b1b1b" stroke-width="0.35"/><rect x="263" y="253" width="75" height="12.3" fill="none" stroke="#1b1b1b" stroke-width="0.15"/><text x="264.30" y="256.60" font-size="1.9" text-anchor="start" fill="#666">PRODUCT / المنتج</text><text x="264.30" y="262.20" font-size="1.9" text-anchor="start" fill="#1b1b1b" font-weight="bold">OBJ-166 Plinth, two heights (name to follow)</text><rect x="338" y="253" width="25" height="12.3" fill="none" stroke="#1b1b1b" stroke-width="0.15"/><text x="339.30" y="256.60" font-size="1.9" text-anchor="start" fill="#666">SIZE / المقاس</text><text x="339.30" y="262.20" font-size="2.5" text-anchor="start" fill="#1b1b1b" font-weight="bold">A3</text><rect x="363" y="253" width="25" height="12.3" fill="none" stroke="#1b1b1b" stroke-width="0.15"/><text x="364.30" y="256.60" font-size="1.9" text-anchor="start" fill="#666">SCALE / المقياس</text><text x="364.30" y="262.20" font-size="2.5" text-anchor="start" fill="#1b1b1b" font-weight="bold">1:12</text><rect x="388" y="253" width="25" height="12.3" fill="none" stroke="#1b1b1b" stroke-width="0.15"/><text x="389.30" y="256.60" font-size="1.9" text-anchor="start" fill="#666">UNITS / الوحدات</text><text x="389.30" y="262.20" font-size="2.5" text-anchor="start" fill="#1b1b1b" font-weight="bold">mm</text><rect x="263" y="265.3" width="75" height="12.3" fill="none" stroke="#1b1b1b" stroke-width="0.15"/><text x="264.30" y="268.90" font-size="1.9" text-anchor="start" fill="#666">MATERIAL / الخامة</text><text x="264.30" y="274.50" font-size="1.9" text-anchor="start" fill="#1b1b1b" font-weight="bold">Stainless steel 3 mm (proposed)</text><rect x="338" y="265.3" width="25" height="12.3" fill="none" stroke="#1b1b1b" stroke-width="0.15"/><text x="339.30" y="268.90" font-size="1.9" text-anchor="start" fill="#666">DATE / التاريخ</text><text x="339.30" y="274.50" font-size="2.5" text-anchor="start" fill="#1b1b1b" font-weight="bold">11 Nov 2026</text><rect x="363" y="265.3" width="25" height="12.3" fill="none" stroke="#1b1b1b" stroke-width="0.15"/><text x="364.30" y="268.90" font-size="1.9" text-anchor="start" fill="#666">SHEET / لوحة</text><text x="364.30" y="274.50" font-size="2.5" text-anchor="start" fill="#1b1b1b" font-weight="bold">3 / 5</text><rect x="388" y="265.3" width="25" height="12.3" fill="none" stroke="#1b1b1b" stroke-width="0.15"/><text x="389.30" y="268.90" font-size="1.9" text-anchor="start" fill="#666">REV / مراجعة</text><text x="389.30" y="274.50" font-size="2.5" text-anchor="start" fill="#1b1b1b" font-weight="bold">1</text><rect x="263" y="277.6" width="100" height="12.3" fill="none" stroke="#1b1b1b" stroke-width="0.15"/><text x="264.30" y="281.20" font-size="1.9" text-anchor="start" fill="#666">FINISH / التشطيب</text><text x="264.30" y="286.80" font-size="1.9" text-anchor="start" fill="#1b1b1b" font-weight="bold">Brushed stainless or mirror polish</text><rect x="363" y="277.6" width="50" height="12.3" fill="none" stroke="#1b1b1b" stroke-width="0.15"/><text x="364.30" y="281.20" font-size="1.9" text-anchor="start" fill="#666">DRAWN / رسم</text><text x="364.30" y="286.80" font-size="2.5" text-anchor="start" fill="#1b1b1b" font-weight="bold">objekt</text></svg>