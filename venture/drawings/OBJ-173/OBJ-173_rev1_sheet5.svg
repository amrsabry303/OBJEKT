="2.1" font-weight="400" text-anchor="start" fill="#161616">MATERIAL  304 stainless, 2 mm proposed</text><text x="318.00" y="274.73" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.1" font-weight="400" text-anchor="end" fill="#161616">الخامة: ستانلس ٣٠٤، ٢ مم مقترح</text><text x="322.00" y="272.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.1" font-weight="400" text-anchor="start" fill="#161616">FINISH  mirror (proposed) OR brushed</text><text x="410.00" y="274.73" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.1" font-weight="400" text-anchor="end" fill="#161616">التشطيب: مرآة (مقترح) أو فرشاة</text><text x="230.00" y="283.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="400" text-anchor="start" fill="#161616">DATE  12 Nov 2026      SHEET 5 / 5</text><text x="318.00" y="285.99" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="400" text-anchor="end" fill="#161616">التاريخ، الورقة</text><text x="322.00" y="283.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="400" text-anchor="start" fill="#161616">REV  1</text><text x="410.00" y="285.99" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="400" text-anchor="end" fill="#161616">المراجعة</text><rect x="228.00" y="233.00" width="185.00" height="12.00" fill="#fff" stroke="#b3261e" stroke-width="0.5"/><text x="320.50" y="238.40" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.9" font-weight="700" text-anchor="middle" fill="#b3261e">DRAFT, not approved, not engineered</text><text x="320.50" y="243.20" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.9" font-weight="700" text-anchor="middle" fill="#b3261e">مسودة، غير معتمدة، غير مهندسة</text><text x="10.00" y="14.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="4.2" font-weight="700" text-anchor="start" fill="#161616">BILL OF MATERIALS AND NOTES</text><text x="410.00" y="14.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="4.2" font-weight="700" text-anchor="end" fill="#161616">قائمة المواد والملاحظات</text><text x="10.00" y="28.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.8" font-weight="600" text-anchor="start" fill="#161616">BILL OF MATERIALS</text><text x="410.00" y="28.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.8" font-weight="600" text-anchor="end" fill="#161616">قائمة المواد</text><rect x="10.00" y="31.00" width="400.00" height="7.00" fill="#e9e5dc" stroke="#161616" stroke-width="0.3"/><text x="12.00" y="36.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="600" text-anchor="start" fill="#161616">ITEM</text><text x="24.00" y="36.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="600" text-anchor="start" fill="#161616">PART / الجزء</text><text x="150.00" y="36.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="600" text-anchor="start" fill="#161616">QTY / العدد</text><text x="215.00" y="36.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="600" text-anchor="start" fill="#161616">MATERIAL / الخامة</text><line x1="10.00" y1="46.20" x2="410.00" y2="46.20" stroke="#7a7a7a" stroke-width="0.15"/><text x="12.00" y="44.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">1</text><text x="24.00" y="44.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="400" text-anchor="start" fill="#161616">Cross blank, folded</text><text x="148.00" y="44.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="end" fill="#161616">قطعة مفرودة تُطوى</text><text x="150.00" y="44.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">1</text><text x="215.00" y="44.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="start" fill="#161616">304 stainless sheet 2 mm (proposed), mirror or brushed</text><line x1="10.00" y1="53.20" x2="410.00" y2="53.20" stroke="#7a7a7a" stroke-width="0.15"/><text x="12.00" y="51.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">2</text><text x="24.00" y="51.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="400" text-anchor="start" fill="#161616">Top plate with Ø172 opening</text><text x="148.00" y="51.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="end" fill="#161616">لوح علوي بفتحة دائرية</text><text x="150.00" y="51.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">1</text><text x="215.00" y="51.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="start" fill="#161616">304 stainless sheet 2 mm (proposed), mirror or brushed</text><line x1="10.00" y1="60.20" x2="410.00" y2="60.20" stroke="#7a7a7a" stroke-width="0.15"/><text x="12.00" y="58.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">3</text><text x="24.00" y="58.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="400" text-anchor="start" fill="#161616">Round pot Ø170 x 150, loose (bought in, not supplied with the cube)</text><text x="148.00" y="58.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="end" fill="#161616">أصيص دائري (غير مرفق)</text><text x="150.00" y="58.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">1</text><text x="215.00" y="58.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="start" fill="#161616">IKEA NYPON 15 cm, polypropylene, to confirm</text><text x="10.00" y="72.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.8" font-weight="600" text-anchor="start" fill="#161616">NOTES</text><text x="410.00" y="72.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.8" font-weight="600" text-anchor="end" fill="#161616">ملاحظات</text><text x="12.00" y="80.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="600" text-anchor="start" fill="#161616">1.</text><text x="18.00" y="80.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="start" fill="#161616">ALL SIZES EXCEPT THE POT ARE PROPOSED, not costed, Production to confirm: cube 200, sheet 2 mm. The pot figures (height 150, outside Ø170) are from the IKEA Egypt page of NYPON</text><text x="18.00" y="84.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="start" fill="#161616">15 cm, art. 60395616, read 12 Nov 2026. Sabry to confirm the pot.</text><text x="410.00" y="88.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="end" fill="#161616">المقاسات مقترحة عدا الأصيص</text><text x="12.00" y="97.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="600" text-anchor="start" fill="#161616">2.</text><text x="18.00" y="97.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="start" fill="#161616">Opening Ø172 = pot outside Ø170 + 2 mm. Real pots vary: Production measures a bought pot before cutting.</text><text x="410.00" y="101.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="end" fill="#161616">تُقاس عينة أصيص فعلية قبل القص</text><text x="12.00" y="114.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="600" text-anchor="start" fill="#161616">3.</text><text x="18.00" y="114.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="start" fill="#161616">Shape traced from the reference photo (open top) with one change from Sabry: a round opening in a closed top plate. Drawn as exact otherwise.</text><text x="410.00" y="118.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="end" fill="#161616">الشكل من الصورة المرجعية مع فتحة دائرية</text><text x="12.00" y="131.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="600" text-anchor="start" fill="#161616">4.</text><text x="18.00" y="131.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="start" fill="#161616">No drain hole. The pot is loose and drains into the cube (Sabry's brief). Production decides any weld seal.</text><text x="410.00" y="135.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="end" fill="#161616">بلا ثقب تصريف؛ الأصيص منفصل</text><text x="12.00" y="148.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="600" text-anchor="start" fill="#161616">5.</text><text x="18.00" y="148.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="start" fill="#161616">Depth of the pot: the cube is 196 mm inside, the pot is 150. If the pot rim stands proud of the body it can hang on the top plate; if not, it stands on the floor 46 mm down, or</text><text x="18.00" y="152.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="start" fill="#161616">on a loose riser. Production to test with a real pot.</text><text x="410.00" y="156.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="end" fill="#161616">عمق الأصيص يُختبر بأصيص فعلي</text><text x="12.00" y="165.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="600" text-anchor="start" fill="#161616">6.</text><text x="18.00" y="165.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="start" fill="#161616">Finish proposed: mirror all faces. Polishers are few, so mirror pieces are capped; brushed is the alternative. Sabry chooses.</text><text x="410.00" y="169.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="end" fill="#161616">المرآة محدودة بعدد المصقلين؛ الفرشاة بديل</text><text x="12.00" y="182.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="600" text-anchor="start" fill="#161616">7.</text><text x="18.00" y="182.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="start" fill="#161616">No structural claims, stress figures, costs or prices. Not engineered. Arabic wording is a draft for a technical reader.</text><text x="410.00" y="186.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="end" fill="#161616">لا ادعاءات إنشائية ولا أسعار. الصياغة العربية مسودة</text></svg>