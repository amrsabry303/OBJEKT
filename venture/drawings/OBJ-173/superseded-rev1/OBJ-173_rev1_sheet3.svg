ze="2.1" font-weight="400" text-anchor="start" fill="#161616">MATERIAL  304 stainless, 2 mm proposed</text><text x="318.00" y="274.73" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.1" font-weight="400" text-anchor="end" fill="#161616">الخامة: ستانلس ٣٠٤، ٢ مم مقترح</text><text x="322.00" y="272.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.1" font-weight="400" text-anchor="start" fill="#161616">FINISH  mirror (proposed) OR brushed</text><text x="410.00" y="274.73" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.1" font-weight="400" text-anchor="end" fill="#161616">التشطيب: مرآة (مقترح) أو فرشاة</text><text x="230.00" y="283.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="400" text-anchor="start" fill="#161616">DATE  12 Nov 2026      SHEET 3 / 5</text><text x="318.00" y="285.99" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="400" text-anchor="end" fill="#161616">التاريخ، الورقة</text><text x="322.00" y="283.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="400" text-anchor="start" fill="#161616">REV  1</text><text x="410.00" y="285.99" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="400" text-anchor="end" fill="#161616">المراجعة</text><rect x="228.00" y="233.00" width="185.00" height="12.00" fill="#fff" stroke="#b3261e" stroke-width="0.5"/><text x="320.50" y="238.40" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.9" font-weight="700" text-anchor="middle" fill="#b3261e">DRAFT, not approved, not engineered</text><text x="320.50" y="243.20" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.9" font-weight="700" text-anchor="middle" fill="#b3261e">مسودة، غير معتمدة، غير مهندسة</text><text x="10.00" y="14.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="4.2" font-weight="700" text-anchor="start" fill="#161616">ASSEMBLY</text><text x="410.00" y="14.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="4.2" font-weight="700" text-anchor="end" fill="#161616">التجميع</text><text x="10.00" y="24.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.6" font-weight="600" text-anchor="start" fill="#161616">EXPLODED SECTION, 1:2.2</text><text x="410.00" y="24.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.6" font-weight="600" text-anchor="end" fill="#161616">قطاع مفكك</text><rect x="40.00" y="120.00" width="90.00" height="89.10" fill="#e4e6e8" stroke="#161616" stroke-width="0.5"/><rect x="40.90" y="120.00" width="88.20" height="88.20" fill="#fff" stroke="#161616" stroke-width="0.3"/><circle cx="32.00" cy="180.00" r="3.2" fill="#fff" stroke="#161616" stroke-width=".3"/><text x="32.00" y="181.10" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="3" font-weight="600" text-anchor="middle" fill="#161616">1</text><text x="36.00" y="218.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2" font-weight="400" text-anchor="start" fill="#161616"></text><rect x="40.00" y="90.00" width="90.00" height="1.90" fill="#9a9a96" stroke="#161616" stroke-width="0.4"/><circle cx="32.00" cy="91.00" r="3.2" fill="#fff" stroke="#161616" stroke-width=".3"/><text x="32.00" y="92.10" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="3" font-weight="600" text-anchor="middle" fill="#161616">2</text><circle cx="85.00" cy="81.00" r="0.00" fill="none" stroke="#161616" stroke-width="0"/><line x1="85.00" y1="93.00" x2="85.00" y2="118.00" stroke="#2a4a7a" stroke-width="0.2" stroke-dasharray="1.5 1"/><rect x="46.75" y="38.00" width="76.50" height="1.00" fill="none" stroke="none" stroke-width="0"/><rect x="46.75" y="38.00" width="76.50" height="37.12" fill="#d9d4c8" stroke="#7a7a7a" stroke-width="0.35" stroke-dasharray="1.6 1"/><text x="85.00" y="56.90" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.0" font-weight="500" text-anchor="middle" fill="#7a7a7a">pot (loose, bought in)</text><circle cx="32.00" cy="48.00" r="3.2" fill="#fff" stroke="#161616" stroke-width=".3"/><text x="32.00" y="49.10" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="3" font-weight="600" text-anchor="middle" fill="#161616">3</text><text x="40.00" y="222.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.0" font-weight="400" text-anchor="start" fill="#7a7a7a">Item 1 folded (open top), item 2 welded on, item 3 dropped through the opening.</text><text x="215.00" y="226.50" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.0" font-weight="400" text-anchor="end" fill="#7a7a7a">يُطوى البند ١، يُلحم البند ٢، ثم يوضع الأصيص</text><text x="238.00" y="38.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.6" font-weight="600" text-anchor="start" fill="#161616">ASSEMBLY SEQUENCE (proposed)</text><text x="410.00" y="38.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.6" font-weight="600" text-anchor="end" fill="#161616">تسلسل التجميع (مقترح)</text><circle cx="241.00" cy="47.00" r="3.2" fill="#fff" stroke="#161616" stroke-width=".3"/><text x="241.00" y="48.10" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="3" font-weight="600" text-anchor="middle" fill="#161616">1</text><text x="247.00" y="48.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="start" fill="#161616">Cut item 1 and item 2, deburr, including the opening edge.</text><text x="410.00" y="53.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="end" fill="#161616">قص البندين ١ و٢ وإزالة الحواف الحادة بما فيها حافة الفتحة</text><circle cx="241.00" cy="64.00" r="3.2" fill="#fff" stroke="#161616" stroke-width=".3"/><text x="241.00" y="65.10" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="3" font-weight="600" text-anchor="middle" fill="#161616">2</text><text x="247.00" y="65.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="start" fill="#161616">Fold item 1 on the four fold lines into an open box.</text><text x="410.00" y="70.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="end" fill="#161616">طي البند ١ على خطوط الطي إلى صندوق مفتوح</text><circle cx="241.00" cy="81.00" r="3.2" fill="#fff" stroke="#161616" stroke-width=".3"/><text x="241.00" y="82.10" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="3" font-weight="600" text-anchor="middle" fill="#161616">3</text><text x="247.00" y="82.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="start" fill="#161616">Weld the four corner seams, grind flush.</text><text x="410.00" y="87.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="end" fill="#161616">لحام الحروف الأربعة الركنية وصنفرتها</text><circle cx="241.00" cy="98.00" r="3.2" fill="#fff" stroke="#161616" stroke-width=".3"/><text x="241.00" y="99.10" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="3" font-weight="600" text-anchor="middle" fill="#161616">4</text><text x="247.00" y="99.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="start" fill="#161616">Place item 2 on the walls, weld the seam all round, grind flush.</text><text x="410.00" y="104.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="end" fill="#161616">وضع اللوح العلوي ولحام محيطه وصنفرته</text><circle cx="241.00" cy="115.00" r="3.2" fill="#fff" stroke="#161616" stroke-width=".3"/><text x="241.00" y="116.10" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="3" font-weight="600" text-anchor="middle" fill="#161616">5</text><text x="247.00" y="116.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="start" fill="#161616">Polish all faces (mirror or brushed). Item 3, the pot, is not part of the cube.</text><text x="410.00" y="121.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="end" fill="#161616">تلميع كل الأوجه. الأصيص ليس جزءاً من المكعب</text><text x="238.00" y="140.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.1" font-weight="400" text-anchor="start" fill="#7a7a7a">Weld method, jigs, order and grinding are Production's. The cube has no drain hole: the pot drains</text><text x="238.00" y="144.50" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.1" font-weight="400" text-anchor="start" fill="#7a7a7a">into the cube. Water collecting in the cube is for the customer to empty; to confirm with Sabry.</text></svg>