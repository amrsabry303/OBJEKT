<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 297" width="420mm" height="297mm" font-family="DejaVu Sans, Arial, sans-serif"><rect width="420" height="297" fill="#fff"/><rect x="7" y="7" width="406" height="283" fill="none" stroke="#1b1b1b" stroke-width="0.35"/><image x="11" y="10.5" width="22" height="14" preserveAspectRatio="xMidYMid meet" href="data:image/svg+xml;base64,"/><text x="38.00" y="17.00" font-size="5" text-anchor="start" fill="#1b1b1b" font-weight="bold">OBJ-181  Console</text><text x="38.00" y="22.50" font-size="3.2" text-anchor="start" fill="#444">Assembly and cutting layout</text><text x="409.00" y="17.00" font-size="5" text-anchor="start" fill="#1b1b1b" font-weight="bold" direction="rtl" unicode-bidi="plaintext">كونسول  OBJ-181</text><text x="409.00" y="22.50" font-size="3.2" text-anchor="start" fill="#444" direction="rtl" unicode-bidi="plaintext">التركيب وتوزيع القص</text><line x1="7.00" y1="27.00" x2="413.00" y2="27.00" stroke="#1b1b1b" stroke-width="0.25"/><text x="20.00" y="34.00" font-size="2.8" text-anchor="start" fill="#1b1b1b" font-weight="bold">EXPLODED VIEW  1:12</text><text x="20.00" y="37.64" font-size="2.8" text-anchor="end" fill="#444" direction="rtl" unicode-bidi="plaintext">منظور مفكوك</text><path d="M94.57,117.87 L108.22,108.72 L108.22,72.56 L94.57,81.71 Z" fill="#675848" stroke="#1b1b1b" stroke-width="0.3" stroke-linejoin="round"/><path d="M77.31,76.04 L94.57,81.71 L108.22,72.56 L90.96,66.89 L81.90,70.73 Z" fill="#b8a891" stroke="#1b1b1b" stroke-width="0.3" stroke-linejoin="round"/><path d="M77.31,112.20 L94.57,117.87 L94.57,81.71 L77.31,76.04 Z" fill="#9a8872" stroke="#1b1b1b" stroke-width="0.3" stroke-linejoin="round"/><path d="M144.98,127.62 L149.56,122.31 L149.56,86.15 L144.98,91.46 Z" fill="#675848" stroke="#1b1b1b" stroke-width="0.3" stroke-linejoin="round"/><path d="M118.65,125.79 L135.91,131.46 L135.91,95.30 L118.65,89.63 Z" fill="#9a8872" stroke="#1b1b1b" stroke-width="0.3" stroke-linejoin="round"/><path d="M135.91,131.46 L144.98,127.62 L144.98,91.46 L135.91,95.30 Z" fill="#675848" stroke="#1b1b1b" stroke-width="0.3" stroke-linejoin="round"/><path d="M144.98,91.46 L149.56,86.15 L132.31,80.48 L118.65,89.63 L135.91,95.30 Z" fill="#b8a891" stroke="#1b1b1b" stroke-width="0.3" stroke-linejoin="round"/><path d="M73.78,63.52 L104.40,74.79 L104.40,64.59 L73.78,53.32 Z" fill="#9a8872" stroke="#1b1b1b" stroke-width="0.3" stroke-linejoin="round"/><path d="M104.40,64.59 L137.43,74.25 L147.84,69.85 L153.09,63.75 L122.47,52.48 L89.44,42.83 L79.03,47.23 L73.78,53.32 Z" fill="#b8a891" stroke="#1b1b1b" stroke-width="0.3" stroke-linejoin="round"/><path d="M147.84,80.04 L153.09,73.95 L153.09,63.75 L147.84,69.85 Z" fill="#675848" stroke="#1b1b1b" stroke-width="0.3" stroke-linejoin="round"/><path d="M104.40,74.79 L137.43,84.45 L137.43,74.25 L104.40,64.59 Z" fill="#9a8872" stroke="#1b1b1b" stroke-width="0.3" stroke-linejoin="round"/><path d="M137.43,84.45 L147.84,80.04 L147.84,69.85 L137.43,74.25 Z" fill="#675848" stroke="#1b1b1b" stroke-width="0.3" stroke-linejoin="round"/><text x="215.00" y="34.00" font-size="2.8" text-anchor="start" fill="#1b1b1b" font-weight="bold">PROPOSED SEQUENCE (Production decides)</text><text x="215.00" y="37.64" font-size="2.8" text-anchor="end" fill="#444" direction="rtl" unicode-bidi="plaintext">تسلسل مقترح (القرار للإنتاج)</text><text x="215.00" y="44.00" font-size="2.4" text-anchor="start" fill="#1b1b1b" font-weight="bold">1.</text><text x="221.00" y="44.00" font-size="2.1" text-anchor="start" fill="#1b1b1b">Laser cut P1 to P6 from 3 mm sheet. Fold P3 and P4 (1 fold each) and P5 (5 folds) at the blue lines.</text><text x="221.00" y="46.73" font-size="2.1" text-anchor="end" fill="#444" direction="rtl" unicode-bidi="plaintext">قص الليزر للقطع من ل١ إلى ل٦ من صاج ٣ مم. ثني ل٣ ول٤ (ثنية لكل منهما) ول٥ (٥ ثنيات) عند الخطوط الزرقاء.</text><text x="215.00" y="61.00" font-size="2.4" text-anchor="start" fill="#1b1b1b" font-weight="bold">2.</text><text x="221.00" y="61.00" font-size="2.1" text-anchor="start" fill="#1b1b1b">Weld each leg: the band closes at its seam, then its cap plate on top. The two legs are mirror images.</text><text x="221.00" y="63.73" font-size="2.1" text-anchor="end" fill="#444" direction="rtl" unicode-bidi="plaintext">لحام كل رجل: يُقفل الشريط عند وصلته ثم غطاؤه العلوي. الرجلان متناظرتان.</text><text x="215.00" y="78.00" font-size="2.4" text-anchor="start" fill="#1b1b1b" font-weight="bold">3.</text><text x="221.00" y="78.00" font-size="2.1" text-anchor="start" fill="#1b1b1b">Build the box: bottom plate, the 2 side bands and 2 end bands round it, then the top plate.</text><text x="221.00" y="80.73" font-size="2.1" text-anchor="end" fill="#444" direction="rtl" unicode-bidi="plaintext">تجميع الصندوق: اللوح السفلي، الشريطان الجانبيان والشريطان الطرفيان حوله، ثم اللوح العلوي.</text><text x="215.00" y="95.00" font-size="2.4" text-anchor="start" fill="#1b1b1b" font-weight="bold">4.</text><text x="221.00" y="95.00" font-size="2.1" text-anchor="start" fill="#1b1b1b">Fix each leg under its end, 50 in from the point, its V faces parallel to the table's V faces (dashed outlines on the plan).</text><text x="221.00" y="97.73" font-size="2.1" text-anchor="end" fill="#444" direction="rtl" unicode-bidi="plaintext">تثبيت كل رجل أسفل الطرف على بعد ٥٠ من الرأس بحيث تتوازى أوجه V مع أوجه V للطاولة (الخطوط المتقطعة).</text><text x="215.00" y="112.00" font-size="2.4" text-anchor="start" fill="#1b1b1b" font-weight="bold">5.</text><text x="221.00" y="112.00" font-size="2.1" text-anchor="start" fill="#1b1b1b">Dress the seams, then finish. Glides if wanted.</text><text x="221.00" y="114.73" font-size="2.1" text-anchor="end" fill="#444" direction="rtl" unicode-bidi="plaintext">تنعيم الوصلات ثم التشطيب. قواعد أرضية إن لزم.</text><text x="20.00" y="148.00" font-size="2.6" text-anchor="start" fill="#1b1b1b" font-weight="bold">CUTTING LAYOUT  1:20  (two assumed sheets, 1250 x 2500 x 3)</text><text x="20.00" y="151.38" font-size="2.6" text-anchor="end" fill="#444" direction="rtl" unicode-bidi="plaintext">توزيع القص (لوحان مفترضان ١٢٥٠ × ٢٥٠٠ × ٣)</text><text x="20.00" y="160.00" font-size="2.0" text-anchor="start" fill="#1b1b1b" font-weight="bold">SHEET 1 / لوح 1</text><rect x="20" y="162" width="125.00" height="62.50" fill="#fafafa" stroke="#1b1b1b" stroke-width="0.3"/><path d="M114.50,224.00 L142.25,222.50 L144.50,212.75 L142.25,203.00 L114.50,201.50 L86.75,203.00 L84.50,212.75 L86.75,222.50 Z" fill="#e6e2d8" stroke="#1b1b1b" stroke-width="0.3"/><text x="114.50" y="213.75" font-size="2.0" text-anchor="middle" fill="#333">P1</text><path d="M114.50,200.00 L142.25,198.50 L144.50,188.75 L142.25,179.00 L114.50,177.50 L86.75,179.00 L84.50,188.75 L86.75,198.50 Z" fill="#e6e2d8" stroke="#1b1b1b" stroke-width="0.3"/><text x="114.50" y="189.75" font-size="2.0" text-anchor="middle" fill="#333">P2</text><path d="M84.50,176.00 L140.08,176.00 L140.08,167.75 L84.50,167.75 Z" fill="#e6e2d8" stroke="#1b1b1b" stroke-width="0.3"/><text x="112.29" y="172.88" font-size="2.0" text-anchor="middle" fill="#333">P3</text><path d="M20.50,224.00 L85.04,224.00 L85.04,194.75 L20.50,194.75 Z" fill="#e6e2d8" stroke="#1b1b1b" stroke-width="0.3"/><text x="52.77" y="210.38" font-size="2.0" text-anchor="middle" fill="#333">P5</text><path d="M20.50,193.25 L85.04,193.25 L85.04,164.00 L20.50,164.00 Z" fill="#e6e2d8" stroke="#1b1b1b" stroke-width="0.3"/><text x="52.77" y="179.62" font-size="2.0" text-anchor="middle" fill="#333">P5</text><line x1="20.00" y1="230.50" x2="145.00" y2="230.50" stroke="#1b1b1b" stroke-width="0.13"/><line x1="20.00" y1="229.00" x2="20.00" y2="232.00" stroke="#1b1b1b" stroke-width="0.13"/><line x1="145.00" y1="229.00" x2="145.00" y2="232.00" stroke="#1b1b1b" stroke-width="0.13"/><rect x="79.52" y="229.15" width="5.96" height="2.52" fill="#fff"/><text x="82.50" y="231.13" font-size="1.8" text-anchor="middle" fill="#1b1b1b">2500</text><text x="160.00" y="160.00" font-size="2.0" text-anchor="start" fill="#1b1b1b" font-weight="bold">SHEET 2 / لوح 2</text><rect x="160" y="162" width="125.00" height="62.50" fill="#fafafa" stroke="#1b1b1b" stroke-width="0.3"/><path d="M160.50,224.00 L216.08,224.00 L216.08,215.75 L160.50,215.75 Z" fill="#e6e2d8" stroke="#1b1b1b" stroke-width="0.3"/><text x="188.29" y="220.88" font-size="2.0" text-anchor="middle" fill="#333">P3</text><path d="M160.50,214.25 L180.51,214.25 L180.51,206.00 L160.50,206.00 Z" fill="#e6e2d8" stroke="#1b1b1b" stroke-width="0.3"/><text x="170.51" y="211.12" font-size="2.0" text-anchor="middle" fill="#333">P4</text><path d="M182.50,214.25 L202.51,214.25 L202.51,206.00 L182.50,206.00 Z" fill="#e6e2d8" stroke="#1b1b1b" stroke-width="0.3"/><text x="192.51" y="211.12" font-size="2.0" text-anchor="middle" fill="#333">P4</text><path d="M162.45,204.50 L177.50,204.50 L177.50,187.50 L162.45,187.50 L160.50,196.00 Z" fill="#e6e2d8" stroke="#1b1b1b" stroke-width="0.3"/><text x="168.08" y="197.00" font-size="2.0" text-anchor="middle" fill="#333">P6</text><path d="M180.95,204.50 L196.00,204.50 L196.00,187.50 L180.95,187.50 L179.00,196.00 Z" fill="#e6e2d8" stroke="#1b1b1b" stroke-width="0.3"/><text x="186.58" y="197.00" font-size="2.0" text-anchor="middle" fill="#333">P6</text><line x1="160.00" y1="230.50" x2="285.00" y2="230.50" stroke="#1b1b1b" stroke-width="0.13"/><line x1="160.00" y1="229.00" x2="160.00" y2="232.00" stroke="#1b1b1b" stroke-width="0.13"/><line x1="285.00" y1="229.00" x2="285.00" y2="232.00" stroke="#1b1b1b" stroke-width="0.13"/><rect x="219.52" y="229.15" width="5.96" height="2.52" fill="#fff"/><text x="222.50" y="231.13" font-size="1.8" text-anchor="middle" fill="#1b1b1b">2500</text><text x="20.00" y="242.00" font-size="2.3" text-anchor="start" fill="#1b1b1b" font-weight="bold">Total cutting length 23.5 m on two assumed sheets. Part spacing 30 mm, edge margin 10 mm (assumed).</text><text x="20.00" y="248.00" font-size="2.0" text-anchor="start" fill="#555">Sheet 2 is about half empty: a larger sheet (for example 1500 x 3000) may do it on one. Sheet size and nesting are Production's.</text><rect x="263" y="242" width="150" height="11" fill="#fff4f2" stroke="#b3261e" stroke-width="0.4"/><text x="266.00" y="246.70" font-size="2.7" text-anchor="start" fill="#b3261e" font-weight="bold">DRAFT, not approved, not engineered</text><text x="410.00" y="250.80" font-size="2.5" text-anchor="start" fill="#b3261e" direction="rtl" unicode-bidi="plaintext">مسودة، غير معتمدة، بدون مراجعة هندسية</text><rect x="263" y="253" width="150" height="37" fill="#fff" stroke="#1b1b1b" stroke-width="0.35"/><rect x="263" y="253" width="75" height="12.3" fill="none" stroke="#1b1b1b" stroke-width="0.15"/><text x="264.30" y="256.60" font-size="1.9" text-anchor="start" fill="#666">PRODUCT / المنتج</text><text x="264.30" y="262.20" font-size="1.9" text-anchor="start" fill="#1b1b1b" font-weight="bold">OBJ-181 Console (name to follow)</text><rect x="338" y="253" width="25" height="12.3" fill="none" stroke="#1b1b1b" stroke-width="0.15"/><text x="339.30" y="256.60" font-size="1.9" text-anchor="start" fill="#666">SIZE / المقاس</text><text x="339.30" y="262.20" font-size="2.5" text-anchor="start" fill="#1b1b1b" font-weight="bold">A3</text><rect x="363" y="253" width="25" height="12.3" fill="none" stroke="#1b1b1b" stroke-width="0.15"/><text x="364.30" y="256.60" font-size="1.9" text-anchor="start" fill="#666">SCALE / المقياس</text><text x="364.30" y="262.20" font-size="2.5" text-anchor="start" fill="#1b1b1b" font-weight="bold">1:12 / 1:20</text><rect x="388" y="253" width="25" height="12.3" fill="none" stroke="#1b1b1b" stroke-width="0.15"/><text x="389.30" y="256.60" font-size="1.9" text-anchor="start" fill="#666">UNITS / الوحدات</text><text x="389.30" y="262.20" font-size="2.5" text-anchor="start" fill="#1b1b1b" font-weight="bold">mm</text><rect x="263" y="265.3" width="75" height="12.3" fill="none" stroke="#1b1b1b" stroke-width="0.15"/><text x="264.30" y="268.90" font-size="1.9" text-anchor="start" fill="#666">MATERIAL / الخامة</text><text x="264.30" y="274.50" font-size="1.9" text-anchor="start" fill="#1b1b1b" font-weight="bold">Steel sheet 3 mm, laser cut and folded (proposed)</text><rect x="338" y="265.3" width="25" height="12.3" fill="none" stroke="#1b1b1b" stroke-width="0.15"/><text x="339.30" y="268.90" font-size="1.9" text-anchor="start" fill="#666">DATE / التاريخ</text><text x="339.30" y="274.50" font-size="2.5" text-anchor="start" fill="#1b1b1b" font-weight="bold">11 Nov 2026</text><rect x="363" y="265.3" width="25" height="12.3" fill="none" stroke="#1b1b1b" stroke-width="0.15"/><text x="364.30" y="268.90" font-size="1.9" text-anchor="start" fill="#666">SHEET / لوحة</text><text x="364.30" y="274.50" font-size="2.5" text-anchor="start" fill="#1b1b1b" font-weight="bold">3 / 4</text><rect x="388" y="265.3" width="25" height="12.3" fill="none" stroke="#1b1b1b" stroke-width="0.15"/><text x="389.30" y="268.90" font-size="1.9" text-anchor="start" fill="#666">REV / مراجعة</text><text x="389.30" y="274.50" font-size="2.5" text-anchor="start" fill="#1b1b1b" font-weight="bold">2</text><rect x="263" y="277.6" width="100" height="12.3" fill="none" stroke="#1b1b1b" stroke-width="0.15"/><text x="264.30" y="281.20" font-size="1.9" text-anchor="start" fill="#666">FINISH / التشطيب</text><text x="264.30" y="286.80" font-size="1.9" text-anchor="start" fill="#1b1b1b" font-weight="bold">Satin taupe-brown all over (to be confirmed)</text><rect x="363" y="277.6" width="50" height="12.3" fill="none" stroke="#1b1b1b" stroke-width="0.15"/><text x="364.30" y="281.20" font-size="1.9" text-anchor="start" fill="#666">DRAWN / رسم</text><text x="364.30" y="286.80" font-size="2.5" text-anchor="start" fill="#1b1b1b" font-weight="bold">objekt</text></svg>