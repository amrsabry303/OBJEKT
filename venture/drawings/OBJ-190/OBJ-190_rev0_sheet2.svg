xt x="224.00" y="202.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="600" text-anchor="end" fill="#161616">بيانات: أطوال الأوجه بالترتيب</text><text x="24.00" y="207.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.1" font-weight="600" text-anchor="start" fill="#161616">Part 1</text><text x="38.00" y="207.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.1" font-weight="400" text-anchor="start" fill="#161616">211, 260, 260, 211, 211, 260, 260, 211</text><text x="24.00" y="211.50" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.1" font-weight="600" text-anchor="start" fill="#161616">Part 3</text><text x="38.00" y="211.50" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.1" font-weight="400" text-anchor="start" fill="#161616">200, 152, 400, 152, 200</text><text x="24.00" y="217.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.0" font-weight="400" text-anchor="start" fill="#161616">Parts 2 and 4: the outline is the plan shape; its 8 and 5 sides match the strip faces in order. Left and right legs are mirror images.</text><text x="24.00" y="220.80" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.0" font-weight="400" text-anchor="start" fill="#161616">Strip height: part 1 = 160, part 3 = 390 (outside). Plate and cap thickness, and whether they sit</text><text x="24.00" y="224.60" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.0" font-weight="400" text-anchor="start" fill="#161616">inside the strip or on top: Production. Weld seam proposed on a corner fold, ground flush.</text><text x="24.00" y="228.40" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.0" font-weight="400" text-anchor="start" fill="#161616">Plan shapes are traced from three photos and are approximate: top block with one V (depth 15) on each of its 4 sides;</text><text x="24.00" y="232.20" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.0" font-weight="400" text-anchor="start" fill="#161616">each leg has one V (depth 13, same angle) on its outer face, under the matching V of the top.</text><text x="224.00" y="217.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.0" font-weight="400" text-anchor="end" fill="#161616">الأشكال مستخرجة من ثلاث صور وهي تقريبية.</text><text x="224.00" y="221.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.0" font-weight="400" text-anchor="end" fill="#161616">ارتفاع الشريط ١٦٠ للقطعة ١ و٣٩٠ للقطعة ٣.</text></svg>