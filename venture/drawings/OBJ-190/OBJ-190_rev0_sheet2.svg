xt x="24.00" y="220.80" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.0" font-weight="400" text-anchor="start" fill="#161616">Strip height: part 1 = 160, part 3 = 390 (outside). Plate and cap thickness, and whether they sit</text><text x="24.00" y="224.60" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.0" font-weight="400" text-anchor="start" fill="#161616">inside the strip or on top: Production. Weld seam proposed on a corner fold, ground flush.</text><text x="24.00" y="228.40" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.0" font-weight="400" text-anchor="start" fill="#161616">Plan shapes are traced from three photos and are approximate: corner cut 70 and centre apex 12</text><text x="24.00" y="232.20" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.0" font-weight="400" text-anchor="start" fill="#161616">on each side of the top block; edge chamfer 15 on the legs.</text><text x="224.00" y="217.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.0" font-weight="400" text-anchor="end" fill="#161616">الأشكال مستخرجة من ثلاث صور وهي تقريبية.</text><text x="224.00" y="221.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.0" font-weight="400" text-anchor="end" fill="#161616">ارتفاع الشريط ١٦٠ للقطعة ١ و٣٩٠ للقطعة ٣.</text></svg>