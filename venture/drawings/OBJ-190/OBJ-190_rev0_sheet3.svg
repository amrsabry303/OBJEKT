ial, sans-serif" font-size="4.2" font-weight="700" text-anchor="start" fill="#161616">ASSEMBLY</text><text x="410.00" y="14.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="4.2" font-weight="700" text-anchor="end" fill="#161616">التجميع</text><text x="10.00" y="22.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.5" font-weight="600" text-anchor="start" fill="#161616">EXPLODED VIEW (proposed assembly, Production decides jigs, welds and fixings)</text><text x="410.00" y="22.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.5" font-weight="600" text-anchor="end" fill="#161616">منظر مفكك (تجميع مقترح، والتصنيع يقرر القوالب واللحام)</text><rect x="50.00" y="137.00" width="33.00" height="78.00" fill="#f1efe9" stroke="#161616" stroke-width="0.4"/><line x1="66.50" y1="137.00" x2="66.50" y2="125.00" stroke="#7a7a7a" stroke-width="0.2" stroke-dasharray="1 1"/><rect x="50.00" y="123.40" width="33.00" height="1.60" fill="#d5d0c4" stroke="#161616" stroke-width="0.3"/><text x="85.00" y="125.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2" font-weight="400" text-anchor="start" fill="#7a7a7a">cap</text><rect x="50.00" y="219.00" width="33.00" height="1.60" fill="#d5d0c4" stroke="#161616" stroke-width="0.3"/><text x="85.00" y="220.40" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2" font-weight="400" text-anchor="start" fill="#7a7a7a">cap</text><rect x="107.00" y="137.00" width="33.00" height="78.00" fill="#f1efe9" stroke="#161616" stroke-width="0.4"/><line x1="123.50" y1="137.00" x2="123.50" y2="125.00" stroke="#7a7a7a" stroke-width="0.2" stroke-dasharray="1 1"/><rect x="107.00" y="123.40" width="33.00" height="1.60" fill="#d5d0c4" stroke="#161616" stroke-width="0.3"/><text x="142.00" y="125.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2" font-weight="400" text-anchor="start" fill="#7a7a7a">cap</text><rect x="107.00" y="219.00" width="33.00" height="1.60" fill="#d5d0c4" stroke="#161616" stroke-width="0.3"/><text x="142.00" y="220.40" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2" font-weight="400" text-anchor="start" fill="#7a7a7a">cap</text><rect x="40.00" y="83.00" width="110.00" height="32.00" fill="#e7e3da" stroke="#161616" stroke-width="0.45"/><line x1="95.00" y1="121.00" x2="95.00" y2="115.00" stroke="#7a7a7a" stroke-width="0.2" stroke-dasharray="1 1"/><rect x="40.00" y="81.40" width="110.00" height="1.60" fill="#d5d0c4" stroke="#161616" stroke-width="0.3"/><rect x="40.00" y="115.00" width="110.00" height="1.60" fill="#d5d0c4" stroke="#161616" stroke-width="0.3"/><circle cx="95.00" cy="75.00" r="3.2" fill="#fff" stroke="#161616" stroke-width=".3"/><text x="95.00" y="76.10" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="3" font-weight="600" text-anchor="middle" fill="#161616">1</text><circle cx="34.00" cy="99.00" r="3.2" fill="#fff" stroke="#161616" stroke-width=".3"/><text x="34.00" y="100.10" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="3" font-weight="600" text-anchor="middle" fill="#161616">2</text><circle cx="45.00" cy="165.00" r="3.2" fill="#fff" stroke="#161616" stroke-width=".3"/><text x="45.00" y="166.10" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="3" font-weight="600" text-anchor="middle" fill="#161616">3</text><circle cx="45.00" cy="125.00" r="3.2" fill="#fff" stroke="#161616" stroke-width=".3"/><text x="45.00" y="126.10" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="3" font-weight="600" text-anchor="middle" fill="#161616">4</text><text x="22.00" y="262.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.1" font-weight="400" text-anchor="start" fill="#7a7a7a">Floor protectors on the underside of each leg: bought-in, type and number to be decided by Production.</text><text x="224.00" y="266.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.1" font-weight="400" text-anchor="end" fill="#7a7a7a">واقيات الأرضية: قطع جاهزة، النوع والعدد من التصنيع.</text><text x="235.00" y="38.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.6" font-weight="600" text-anchor="start" fill="#161616">ASSEMBLY SEQUENCE (proposed)</text><text x="410.00" y="38.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.6" font-weight="600" text-anchor="end" fill="#161616">تسلسل التجميع (مقترح)</text><circle cx="238.00" cy="47.00" r="3.2" fill="#fff" stroke="#161616" stroke-width=".3"/><text x="238.00" y="48.10" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="3" font-weight="600" text-anchor="middle" fill="#161616">1</text><text x="244.00" y="48.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">Cut and fold the two leg strips (3) and the top strip (1).</text><text x="410.00" y="53.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="end" fill="#161616">قص وثني شريطي الساقين (٣) وشريط الكتلة العلوية (١).</text><circle cx="238.00" cy="64.00" r="3.2" fill="#fff" stroke="#161616" stroke-width=".3"/><text x="238.00" y="65.10" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="3" font-weight="600" text-anchor="middle" fill="#161616">2</text><text x="244.00" y="65.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">Close each leg: weld the seam, weld one cap (4) in each end.</text><text x="410.00" y="70.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="end" fill="#161616">إغلاق كل ساق: لحام الوصلة ولحام غطاء (٤) في كل طرف.</text><circle cx="238.00" cy="81.00" r="3.2" fill="#fff" stroke="#161616" stroke-width=".3"/><text x="238.00" y="82.10" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="3" font-weight="600" text-anchor="middle" fill="#161616">3</text><text x="244.00" y="82.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">Close the top block: weld the seam, weld the two plates (2).</text><text x="410.00" y="87.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="end" fill="#161616">إغلاق الكتلة العلوية: لحام الوصلة ولحام اللوحين (٢).</text><circle cx="238.00" cy="98.00" r="3.2" fill="#fff" stroke="#161616" stroke-width=".3"/><text x="238.00" y="99.10" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="3" font-weight="600" text-anchor="middle" fill="#161616">4</text><text x="244.00" y="99.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">Weld the two legs to the underside of the top block (sheet 1), each leg V under the matching V of the top.</text><text x="410.00" y="104.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="end" fill="#161616">لحام الساقين أسفل الكتلة العلوية (الورقة ١)، وزاوية كل ساق تحت الزاوية المقابلة في الأعلى.</text><circle cx="238.00" cy="115.00" r="3.2" fill="#fff" stroke="#161616" stroke-width=".3"/><text x="238.00" y="116.10" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="3" font-weight="600" text-anchor="middle" fill="#161616">5</text><text x="244.00" y="116.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">Grind welds flush, brush or polish, fit floor protectors.</text><text x="410.00" y="121.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="end" fill="#161616">صنفرة اللحام، التشطيب، تركيب واقيات الأرضية.</text></svg>