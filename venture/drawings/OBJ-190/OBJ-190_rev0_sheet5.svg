t" fill="#161616">2</text><text x="215.00" y="58.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">Stainless steel sheet</text><line x1="10.00" y1="67.20" x2="410.00" y2="67.20" stroke="#7a7a7a" stroke-width="0.15"/><text x="12.00" y="65.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">4</text><text x="24.00" y="65.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">Leg cap (top and bottom)</text><text x="120.00" y="65.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="end" fill="#161616">غطاء الساق</text><text x="150.00" y="65.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">4</text><text x="215.00" y="65.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">Stainless steel sheet</text><line x1="10.00" y1="74.20" x2="410.00" y2="74.20" stroke="#7a7a7a" stroke-width="0.15"/><text x="12.00" y="72.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">5</text><text x="24.00" y="72.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">Floor protector</text><text x="120.00" y="72.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="end" fill="#161616">واقي أرضية</text><text x="150.00" y="72.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">by Production</text><text x="215.00" y="72.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">Bought-in, to be decided</text><text x="10.00" y="90.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.8" font-weight="600" text-anchor="start" fill="#161616">NOTES</text><text x="410.00" y="90.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.8" font-weight="600" text-anchor="end" fill="#161616">ملاحظات</text><text x="12.00" y="99.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="600" text-anchor="start" fill="#161616">1.</text><text x="18.00" y="99.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="400" text-anchor="start" fill="#161616">Overall size 550 x 450 x 550 mm is Sabry's. All other sizes are estimated from three photos of a reference piece (not ours).</text><text x="410.00" y="104.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="400" text-anchor="end" fill="#161616">المقاس الكلي من سبري، وبقية المقاسات مقدّرة من ثلاث صور.</text><text x="12.00" y="112.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="600" text-anchor="start" fill="#161616">2.</text><text x="18.00" y="112.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="400" text-anchor="start" fill="#161616">The construction (hollow folded and welded boxes: one top block and two legs) is inferred from the photos. Production to confirm.</text><text x="410.00" y="117.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="400" text-anchor="end" fill="#161616">طريقة الصنع (صناديق مجوفة مثنية وملحومة) مستنتجة من الصور. يؤكدها التصنيع.</text><text x="12.00" y="125.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="600" text-anchor="start" fill="#161616">3.</text><text x="18.00" y="125.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="400" text-anchor="start" fill="#161616">Plan shapes (top: 8 sides, four Vs, one per side; legs: 5 sides, one V each, matching the V of the top above it) are traced from the photos and are approximate. Real sizes or the original CAD are still needed.</text><text x="410.00" y="130.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="400" text-anchor="end" fill="#161616">الأشكال الأفقية تقريبية. نحتاج المقاسات الحقيقية أو ملف التصميم الأصلي.</text><text x="12.00" y="138.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="600" text-anchor="start" fill="#161616">4.</text><text x="18.00" y="138.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="400" text-anchor="start" fill="#161616">Material, thickness, bend allowance, tolerances, sheet size, joints, welding, plate fit and finish are Production's to decide.</text><text x="410.00" y="143.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="400" text-anchor="end" fill="#161616">الخامة والسماكة والسماحيات واللحام والتشطيب يقررها التصنيع.</text><text x="12.00" y="151.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="600" text-anchor="start" fill="#161616">5.</text><text x="18.00" y="151.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="400" text-anchor="start" fill="#161616">Finish: brushed stainless steel, approved by Sabry. The reference is a warmer bronze-grey brushed metal; the exact tone and brush are Production's to match with a sample.</text><text x="410.00" y="156.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="400" text-anchor="end" fill="#161616">التشطيب: ستانلس ستيل مصقول بالفرشاة، معتمد من سبري. المرجع أدفأ لوناً، ويطابقه التصنيع بعينة.</text><text x="12.00" y="164.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="600" text-anchor="start" fill="#161616">6.</text><text x="18.00" y="164.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="400" text-anchor="start" fill="#161616">Height 550 is the overall height: top block 160 + legs 390. Floor protectors, if fitted, are inside this figure; Production to confirm.</text><text x="410.00" y="169.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="400" text-anchor="end" fill="#161616">الارتفاع الكلي ٥٥٠: الكتلة العلوية ١٦٠ والساقان ٣٩٠.</text><text x="12.00" y="177.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="600" text-anchor="start" fill="#161616">7.</text><text x="18.00" y="177.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="400" text-anchor="start" fill="#161616">No structural claims, stress figures, costs or prices on this drawing. Not engineered. Arabic wording is a draft for a technical reader.</text><text x="410.00" y="182.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="400" text-anchor="end" fill="#161616">لا ادعاءات إنشائية ولا تكاليف ولا أسعار. الصياغة العربية مسودة.</text><text x="12.00" y="190.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="600" text-anchor="start" fill="#161616">8.</text><text x="18.00" y="190.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="400" text-anchor="start" fill="#161616">OBJ-190 is the product number, confirmed by Sabry on 11 Nov 2026.</text><text x="410.00" y="195.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="400" text-anchor="end" fill="#161616">رقم المنتج معتمد من سبري.</text></svg>