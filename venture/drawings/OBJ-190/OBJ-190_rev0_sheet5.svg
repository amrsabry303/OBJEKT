" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="4.2" font-weight="700" text-anchor="start" fill="#161616">BILL OF MATERIALS AND NOTES</text><text x="410.00" y="14.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="4.2" font-weight="700" text-anchor="end" fill="#161616">قائمة المواد والملاحظات</text><text x="10.00" y="28.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.8" font-weight="600" text-anchor="start" fill="#161616">BILL OF MATERIALS</text><text x="410.00" y="28.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.8" font-weight="600" text-anchor="end" fill="#161616">قائمة المواد</text><rect x="10.00" y="31.00" width="400.00" height="7.00" fill="#e9e5dc" stroke="#161616" stroke-width="0.3"/><text x="12.00" y="36.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="600" text-anchor="start" fill="#161616">ITEM</text><text x="24.00" y="36.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="600" text-anchor="start" fill="#161616">PART / الجزء</text><text x="150.00" y="36.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="600" text-anchor="start" fill="#161616">QTY / العدد</text><text x="215.00" y="36.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="600" text-anchor="start" fill="#161616">MATERIAL / الخامة</text><line x1="10.00" y1="46.20" x2="410.00" y2="46.20" stroke="#7a7a7a" stroke-width="0.15"/><text x="12.00" y="44.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">1</text><text x="24.00" y="44.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">Top block, side strip</text><text x="120.00" y="44.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="end" fill="#16161