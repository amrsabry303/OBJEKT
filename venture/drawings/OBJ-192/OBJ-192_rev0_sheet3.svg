 font-size="4.2" font-weight="700" text-anchor="start" fill="#161616">ASSEMBLY</text><text x="410.00" y="14.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="4.2" font-weight="700" text-anchor="end" fill="#161616">التجميع</text><text x="10.00" y="22.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.5" font-weight="600" text-anchor="start" fill="#161616">EXPLODED VIEW (proposed assembly; Production decides jigs, welds and fixings)</text><text x="410.00" y="22.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.5" font-weight="600" text-anchor="end" fill="#161616">منظر مفكك (تجميع مقترح، والتصنيع يقرر القوالب واللحام)</text><polygon points="63.52,156.74 197.92,156.74 197.92,125.24 63.52,125.24" fill="#c9c5bb" stroke="#161616" stroke-width="0.35"/><polygon points="40.30,182.00 174.70,182.00 193.13,169.09 58.73,169.09" fill="#e2ded4" stroke="#161616" stroke-width="0.35"/><polygon points="26.50,189.50 44.93,176.59 44.93,128.59 44.90,127.44 44.81,126.35 44.65,125.35 44.44,124.44 44.17,123.65 43.85,122.99 43.49,122.46 43.09,122.09 42.66,121.87 42.20,121.81 41.73,121.92 41.24,122.18 30.19,129.92 29.71,130.33 29.23,130.89 28.78,131.59 28.34,132.42 27.94,133.35 27.58,134.38 27.26,135.49 26.99,136.65 26.78,137.86 26.63,139.08 26.53,140.30 26.50,141.50 26.50,141.50" fill="#a9a69d" stroke="#161616" stroke-width="0.35"/><polygon points="29.39,192.73 29.76,192.47 29.76,187.97 29.39,188.23" fill="#bbb" stroke="#161616" stroke-width="0.25"/><circle cx="29.57" cy="196.05" r="3.75" fill="#555" stroke="#161616" stroke-width=".3"/><polygon points="41.67,184.12 42.04,183.87 42.04,179.37 41.67,179.62" fill="#bbb" stroke="#161616" stroke-width="0.25"/><circle cx="41.86" cy="187.45" r="3.75" fill="#555" stroke="#161616" stroke-width=".3"/><polygon points="188.20,189.50 206.63,176.59 206.63,128.59 206.60,127.44 206.51,126.35 206.35,125.35 206.14,124.44 205.87,123.65 205.55,122.99 205.19,122.46 204.79,122.09 204.36,121.87 203.90,121.81 203.