 Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">2</text><text x="215.00" y="44.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">Sheet steel 2 mm (proposal)</text><line x1="10.00" y1="53.20" x2="410.00" y2="53.20" stroke="#7a7a7a" stroke-width="0.15"/><text x="12.00" y="51.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">2</text><text x="24.00" y="51.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">Front / back panel</text><text x="140.00" y="51.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="end" fill="#161616">اللوح الأمامي والخلفي</text><text x="150.00" y="51.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">2</text><text x="215.00" y="51.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">Sheet steel 2 mm (proposal)</text><line x1="10.00" y1="60.20" x2="410.00" y2="60.20" stroke="#7a7a7a" stroke-width="0.15"/><text x="12.00" y="58.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">3</text><text x="24.00" y="58.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">Floor plate</text><text x="140.00" y="58.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="end" fill="#161616">لوح القاع</text><text x="150.00" y="58.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">1</text><text x="215.00" y="58.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">Sheet steel 2 mm (proposal)</text><line x1="10.00" y1="67.20" x2="410.00" y2="67.20" stroke="#7a7a7a" stroke-width="0.15"/><text x="12.00" y="65.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">4</text><text x="24.00" y="65.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">Swivel caster, rubber wheel 50 mm</text><text x="140.00" y="65.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="end" fill="#161616">عجلة دوارة مطاط ٥٠ مم</text><text x="150.00" y="65.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">4 (2 locking)</text><text x="215.00" y="65.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">Bought-in; load rating by Production</text><line x1="10.00" y1="74.20" x2="410.00" y2="74.20" stroke="#7a7a7a" stroke-width="0.15"/><text x="12.00" y="72.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">5</text><text x="24.00" y="72.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">Inner liner, loose</text><text x="140.00" y="72.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="end" fill="#161616">بطانة داخلية</text><text x="150.00" y="72.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">1</text><text x="215.00" y="72.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">By Production; not drawn</text><text x="10.00" y="90.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.8" font-weight="600" text-anchor="start" fill="#161616">NOTES</text><text x="410.00" y="90.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.8" font-weight="600" text-anchor="end" fill="#161616">ملاحظات</text><text x="12.00" y="99.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="600" text-anchor="start" fill="#161616">1.</text><text x="18.00" y="99.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="start" fill="#161616">Overall 900 x 300 x 450 mm (including casters), sheet thickness 2 mm and the caster height of 70 mm are proposals, not costed. Production to confirm.</text><text x="410.00" y="104.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="end" fill="#161616">المقاسات وسماكة الصاج وارتفاع العجلة مقترحة. يؤكدها التصنيع.</text><text x="12.00" y="112.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="600" text-anchor="start" fill="#161616">2.</text><text x="18.00" y="112.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="start" fill="#161616">The shape is estimated by eye from one low-resolution render of unknown source (not ours): two end plates with rounded top corners, flat front and back panels, floor, four casters. Drawn as objekt's own design.</text><text x="410.00" y="117.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="end" fill="#161616">الشكل مقدّر من صورة واحدة منخفضة الدقة مجهولة المصدر، ومرسوم كتصميم خاص بأوبجيكت.</text><text x="12.00" y="125.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="600" text-anchor="start" fill="#161616">3.</text><text x="18.00" y="125.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="start" fill="#161616">Colours (Sabry): Carbon, Oxblood, Bone. Finish (Sabry): electrostatic powder coating, matte. Powder maker matches the HEX with a sample.</text><text x="410.00" y="130.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="end" fill="#161616">الألوان: أسود فحمي، عنابي داكن، عاجي. التشطيب: دهان بودرة مطفي.</text><text x="12.00" y="138.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="600" text-anchor="start" fill="#161616">4.</text><text x="18.00" y="138.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="start" fill="#161616">Drainage (proposal, same call as OBJ-173 and OBJ-075): the steel trough is sealed with no drain hole, so the floor stays dry on casters; plants sit in a loose inner liner (5) that drains. Production to confirm seam sealing and liner.</text><text x="410.00" y="143.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="end" fill="#161616">الصرف (مقترح): الحوض مغلق بدون فتحات، والنباتات في بطانة داخلية قابلة للصرف.</text><text x="12.00" y="151.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="600" text-anchor="start" fill="#161616">5.</text><text x="18.00" y="151.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="start" fill="#161616">Casters (Sabry: rubber): four swivel casters, rubber wheel, 50 mm, two with locks (proposal). Type, mounting to the plate bottom and load rating are Production's to decide.</text><text x="410.00" y="156.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="end" fill="#161616">العجلات مطاط (سبري): أربع عجلات دوارة ٥٠ مم، اثنتان بقفل (مقترح).</text><text x="12.00" y="164.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="600" text-anchor="start" fill="#161616">6.</text><text x="18.00" y="164.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="start" fill="#161616">Material, thickness, bend allowance, tolerances, sheet size, joints, welding and finish details are Production's to decide.</text><text x="410.00" y="169.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="end" fill="#161616">الخامة والسماكة والسماحيات واللحام وتفاصيل التشطيب يقررها التصنيع.</text><text x="12.00" y="177.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="600" text-anchor="start" fill="#161616">7.</text><text x="18.00" y="177.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="start" fill="#161616">No structural claims, stress figures, load figures, costs or prices on this drawing. Not engineered. Arabic wording is a draft for a technical reader.</text><text x="410.00" y="182.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="end" fill="#161616">لا ادعاءات إنشائية ولا تكاليف ولا أسعار. الصياغة العربية مسودة.</text><text x="12.00" y="190.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="600" text-anchor="start" fill="#161616">8.</text><text x="18.00" y="190.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="start" fill="#161616">Product number OBJ-192 was the next free number; Sabry can override.</text><text x="410.00" y="195.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="end" fill="#161616">رقم المنتج التالي المتاح؛ يمكن لسبري تغييره.</text></svg>