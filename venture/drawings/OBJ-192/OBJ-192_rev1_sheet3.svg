 x="22.00" y="262.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.0" font-weight="400" text-anchor="start" fill="#7a7a7a">Feet (4): bought-in levelling feet or glides with a rubber pad, 30 mm pad, 20 mm high (proposal). Type and load: Production to decide with the supplier.</text><text x="22.00" y="266.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.0" font-weight="400" text-anchor="start" fill="#7a7a7a">Inner liner (5): loose, drops into the trough; not drawn, size and material by Production.</text><text x="224.00" y="270.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.0" font-weight="400" text-anchor="end" fill="#7a7a7a">الأرجل: جاهزة، قابلة للضبط، وسادة مطاط ٣٠ مم، ارتفاع ٢٠ مم (مقترح). النوع والحمل من التصنيع.</text><text x="245.00" y="38.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.6" font-weight="600" text-anchor="start" fill="#161616">ASSEMBLY SEQUENCE (proposed)</text><text x="410.00" y="38.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.6" font-weight="600" text-anchor="end" fill="#161616">تسلسل التجميع (مقترح)</text><circle cx="248.00" cy="47.00" r="3.2" fill="#fff" stroke="#161616" stroke-width=".3"/><text x="248.00" y="48.10" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="3" font-weight="600" text-anchor="middle" fill="#161616">1</text><text x="254.00" y="48.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="start" fill="#161616">Cut parts 1, 2, 3 from the DXF files; deburr the edges.</text><text x="410.00" y="53.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="end" fill="#161616">قص القطع ١ و٢ و٣ من ملفات DXF وتنعيم الحواف.</text><circle cx="248.00" cy="64.00" r="3.2" fill="#fff" stroke="#161616" stroke-width=".3"/><text x="248.00" y="65.10" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="3" font-weight="600" text-anchor="middle" fill="#161616">2</text><text x="254.00" y="65.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="start" fill="#161616">Weld the floor plate (3) and the two panels (2) between the two end plates (1); seal the trough seams.</text><text x="410.00" y="70.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="end" fill="#161616">لحام لوح القاع (٣) واللوحين (٢) بين لوحي الطرف (١) وإحكام سد الوصلات.</text><circle cx="248.00" cy="81.00" r="3.2" fill="#fff" stroke="#161616" stroke-width=".3"/><text x="248.00" y="82.10" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="3" font-weight="600" text-anchor="middle" fill="#161616">3</text><text x="254.00" y="82.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="start" fill="#161616">Grind welds flush. Powder coat, matte, in the chosen colour.</text><text x="410.00" y="87.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="end" fill="#161616">صنفرة اللحام ثم الدهان بالبودرة المطفي باللون المختار.</text><circle cx="248.00" cy="98.00" r="3.2" fill="#fff" stroke="#161616" stroke-width=".3"/><text x="248.00" y="99.10" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="3" font-weight="600" text-anchor="middle" fill="#161616">4</text><text x="254.00" y="99.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="start" fill="#161616">Fit the four rubber-pad feet (4) under the end plates.</text><text x="410.00" y="104.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="end" fill="#161616">تركيب الأرجل الأربع (٤) بوسادة مطاط تحت لوحي الطرف.</text><circle cx="248.00" cy="115.00" r="3.2" fill="#fff" stroke="#161616" stroke-width=".3"/><text x="248.00" y="116.10" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="3" font-weight="600" text-anchor="middle" fill="#161616">5</text><text x="254.00" y="116.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="start" fill="#161616">Drop the loose inner liner (5) into the trough.</text><text x="410.00" y="121.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.2" font-weight="400" text-anchor="end" fill="#161616">وضع البطانة الداخلية (٥) داخل الحوض.</text></svg>