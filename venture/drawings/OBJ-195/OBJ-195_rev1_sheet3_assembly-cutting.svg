<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 297" width="420mm" height="297mm" font-family="DejaVu Sans, Arial, sans-serif"><rect width="420" height="297" fill="#fff"/><rect x="7" y="7" width="406" height="283" fill="none" stroke="#1b1b1b" stroke-width="0.35"/><image x="11" y="10.5" width="22" height="14" preserveAspectRatio="xMidYMid meet" href="data:image/svg+xml;base64,"/><text x="38.00" y="17.00" font-size="5" text-anchor="start" fill="#1b1b1b" font-weight="bold">OBJ-195  Side table</text><text x="38.00" y="22.50" font-size="3.2" text-anchor="start" fill="#444">Assembly and cutting layout</text><text x="409.00" y="17.00" font-size="5" text-anchor="start" fill="#1b1b1b" font-weight="bold" direction="rtl" unicode-bidi="plaintext">طاولة جانبية  OBJ-195</text><text x="409.00" y="22.50" font-size="3.2" text-anchor="start" fill="#444" direction="rtl" unicode-bidi="plaintext">التركيب وتوزيع القص</text><line x1="7.00" y1="27.00" x2="413.00" y2="27.00" stroke="#1b1b1b" stroke-width="0.25"/><text x="20.00" y="34.00" font-size="2.8" text-anchor="start" fill="#1b1b1b" font-weight="bold">EXPLODED VIEW  1:8</text><text x="20.00" y="37.64" font-size="2.8" text-anchor="end" fill="#444" direction="rtl" unicode-bidi="plaintext">منظور مفكوك</text><path d="M113.18,143.04 L131.53,130.73 L131.53,98.51 L113.18,110.81 Z" fill="#675848" stroke="#1b1b1b" stroke-width="0.3" stroke-linejoin="round"/><path d="M86.96,102.20 L113.18,110.81 L131.53,98.51 L105.32,89.89 Z" fill="#b8a891" stroke="#1b1b1b" stroke-width="0.3" stroke-linejoin="round"/><path d="M86.96,134.42 L113.18,143.04 L113.18,110.81 L86.96,102.20 Z" fill="#9a8872" stroke="#1b1b1b" stroke-width="0.3" stroke-linejoin="round"/><path d="M80.00,68.78 L114.40,80.09 L138.49,63.94 L104.09,52.63 Z" fill="#b8a891" stroke="#1b1b1b" stroke-width="0.3" stroke-linejoin="round"/><path d="M114.40,96.42 L138.49,80.27 L138.49,63.94 L114.40,80.09 Z" fill="#675848" stroke="#1b1b1b" stroke-width="0.3" stroke-linejoin="round"/><path d="M80.00,85.11 L114.40,96.42 L114.40,80.09 L80.00,68.78 Z" fill="#9a8872" stroke="#1b1b1b" stroke-width="0.3" stroke-linejoin="round"/><text x="215.00" y="34.00" font-size="2.8" text-anchor="start" fill="#1b1b1b" font-weight="bold">PROPOSED SEQUENCE (Production decides)</text><text x="215.00" y="37.64" font-size="2.8" text-anchor="end" fill="#444" direction="rtl" unicode-bidi="plaintext">تسلسل مقترح (القرار للإنتاج)</text><text x="215.00" y="44.00" font-size="2.4" text-anchor="start" fill="#1b1b1b" font-weight="bold">1.</text><text x="221.00" y="44.00" font-size="2.1" text-anchor="start" fill="#1b1b1b">Laser cut P1 to P5 from 3 mm sheet. Fold P3 and P4 at the blue lines (3 folds each).</text><text x="221.00" y="46.73" font-size="2.1" text-anchor="end" fill="#444" direction="rtl" unicode-bidi="plaintext">قص الليزر للقطع من ل١ إلى ل٥ من صاج ٣ مم. ثني ل٣ ول٤ عند الخطوط الزرقاء (٣ ثنيات لكل منهما).</text><text x="215.00" y="61.00" font-size="2.4" text-anchor="start" fill="#1b1b1b" font-weight="bold">2.</text><text x="221.00" y="61.00" font-size="2.1" text-anchor="start" fill="#1b1b1b">Weld the base: the band closes at its seam, then the cap plate on top. The underside stays open.</text><text x="221.00" y="63.73" font-size="2.1" text-anchor="end" fill="#444" direction="rtl" unicode-bidi="plaintext">لحام القاعدة: يُقفل الشريط عند وصلته ثم غطاء علوي. الأسفل يبقى مفتوحاً.</text><text x="215.00" y="78.00" font-size="2.4" text-anchor="start" fill="#1b1b1b" font-weight="bold">3.</text><text x="221.00" y="78.00" font-size="2.1" text-anchor="start" fill="#1b1b1b">Build the box: bottom plate, the band round it, then the top plate.</text><text x="221.00" y="80.73" font-size="2.1" text-anchor="end" fill="#444" direction="rtl" unicode-bidi="plaintext">تجميع الصندوق: اللوح السفلي، الشريط حوله، ثم اللوح العلوي.</text><text x="215.00" y="95.00" font-size="2.4" text-anchor="start" fill="#1b1b1b" font-weight="bold">4.</text><text x="221.00" y="95.00" font-size="2.1" text-anchor="start" fill="#1b1b1b">Fix the box on the base, centred, 50 overhang each side (dashed outline on the plan).</text><text x="221.00" y="97.73" font-size="2.1" text-anchor="end" fill="#444" direction="rtl" unicode-bidi="plaintext">تثبيت الصندوق على القاعدة بالمنتصف وبروز ٥٠ من كل جهة (الخط المتقطع في المسقط).</text><text x="215.00" y="112.00" font-size="2.4" text-anchor="start" fill="#1b1b1b" font-weight="bold">5.</text><text x="221.00" y="112.00" font-size="2.1" text-anchor="start" fill="#1b1b1b">Dress the seams, then finish. Glides if wanted.</text><text x="221.00" y="114.73" font-size="2.1" text-anchor="end" fill="#444" direction="rtl" unicode-bidi="plaintext">تنعيم الوصلات ثم التشطيب. قواعد أرضية إن لزم.</text><text x="20.00" y="152.00" font-size="2.6" text-anchor="start" fill="#1b1b1b" font-weight="bold">CUTTING LAYOUT  1:14  (assumed sheet 1250 x 2500 x 3)</text><text x="20.00" y="155.38" font-size="2.6" text-anchor="end" fill="#444" direction="rtl" unicode-bidi="plaintext">توزيع القص (لوح مفترض ١٢٥٠ × ٢٥٠٠ × ٣)</text><rect x="20" y="168" width="178.57" height="89.29" fill="#fafafa" stroke="#1b1b1b" stroke-width="0.3"/><path d="M20.71,213.00 L50.71,213.00 L50.71,183.00 L20.71,183.00 Z" fill="#e6e2d8" stroke="#1b1b1b" stroke-width="0.3"/><text x="35.71" y="199.00" font-size="2.2" text-anchor="middle" fill="#333">P1</text><path d="M52.86,213.00 L82.86,213.00 L82.86,183.00 L52.86,183.00 Z" fill="#e6e2d8" stroke="#1b1b1b" stroke-width="0.3"/><text x="67.86" y="199.00" font-size="2.2" text-anchor="middle" fill="#333">P2</text><path d="M20.71,256.57 L140.71,256.57 L140.71,243.36 L20.71,243.36 Z" fill="#e6e2d8" stroke="#1b1b1b" stroke-width="0.3"/><text x="80.71" y="250.96" font-size="2.2" text-anchor="middle" fill="#333">P3</text><path d="M20.71,241.21 L112.14,241.21 L112.14,215.14 L20.71,215.14 Z" fill="#e6e2d8" stroke="#1b1b1b" stroke-width="0.3"/><text x="66.43" y="229.18" font-size="2.2" text-anchor="middle" fill="#333">P4</text><path d="M85.00,213.00 L107.86,213.00 L107.86,190.14 L85.00,190.14 Z" fill="#e6e2d8" stroke="#1b1b1b" stroke-width="0.3"/><text x="96.43" y="202.57" font-size="2.2" text-anchor="middle" fill="#333">P5</text><line x1="20.00" y1="263.29" x2="198.57" y2="263.29" stroke="#1b1b1b" stroke-width="0.13"/><line x1="20.00" y1="261.79" x2="20.00" y2="264.79" stroke="#1b1b1b" stroke-width="0.13"/><line x1="198.57" y1="261.79" x2="198.57" y2="264.79" stroke="#1b1b1b" stroke-width="0.13"/><rect x="106.06" y="261.79" width="6.46" height="2.80" fill="#fff"/><text x="109.29" y="263.99" font-size="2.0" text-anchor="middle" fill="#1b1b1b">2500</text><line x1="202.57" y1="168.00" x2="202.57" y2="257.29" stroke="#1b1b1b" stroke-width="0.13"/><line x1="201.07" y1="168.00" x2="204.07" y2="168.00" stroke="#1b1b1b" stroke-width="0.13"/><line x1="201.07" y1="257.29" x2="204.07" y2="257.29" stroke="#1b1b1b" stroke-width="0.13"/><text x="204.07" y="213.34" font-size="2.0" text-anchor="start" fill="#1b1b1b">1250</text><text x="20.00" y="278.00" font-size="2.3" text-anchor="start" fill="#1b1b1b" font-weight="bold">Total cutting length 11.7 m on one assumed sheet. Part spacing 30 mm, edge margin 10 mm (assumed).</text><text x="20.00" y="284.00" font-size="2.0" text-anchor="start" fill="#555">Sheet size and nesting are Production's.</text><rect x="263" y="242" width="150" height="11" fill="#f0f8f2" stroke="#1d6b3a" stroke-width="0.4"/><text x="266.00" y="246.70" font-size="2.7" text-anchor="start" fill="#1d6b3a" font-weight="bold">Approved by Sabry 11 Nov 2026. Production review pending. Not engineered</text><text x="410.00" y="250.80" font-size="2.5" text-anchor="start" fill="#1d6b3a" direction="rtl" unicode-bidi="plaintext">معتمد من صبري ١١ نوفمبر ٢٠٢٦. مراجعة الإنتاج قيد الانتظار. بدون مراجعة هندسية</text><rect x="263" y="253" width="150" height="37" fill="#fff" stroke="#1b1b1b" stroke-width="0.35"/><rect x="263" y="253" width="75" height="12.3" fill="none" stroke="#1b1b1b" stroke-width="0.15"/><text x="264.30" y="256.60" font-size="1.9" text-anchor="start" fill="#666">PRODUCT / المنتج</text><text x="264.30" y="262.20" font-size="1.9" text-anchor="start" fill="#1b1b1b" font-weight="bold">OBJ-195 Side table (name to follow)</text><rect x="338" y="253" width="25" height="12.3" fill="none" stroke="#1b1b1b" stroke-width="0.15"/><text x="339.30" y="256.60" font-size="1.9" text-anchor="start" fill="#666">SIZE / المقاس</text><text x="339.30" y="262.20" font-size="2.5" text-anchor="start" fill="#1b1b1b" font-weight="bold">A3</text><rect x="363" y="253" width="25" height="12.3" fill="none" stroke="#1b1b1b" stroke-width="0.15"/><text x="364.30" y="256.60" font-size="1.9" text-anchor="start" fill="#666">SCALE / المقياس</text><text x="364.30" y="262.20" font-size="2.5" text-anchor="start" fill="#1b1b1b" font-weight="bold">1:8 / 1:14</text><rect x="388" y="253" width="25" height="12.3" fill="none" stroke="#1b1b1b" stroke-width="0.15"/><text x="389.30" y="256.60" font-size="1.9" text-anchor="start" fill="#666">UNITS / الوحدات</text><text x="389.30" y="262.20" font-size="2.5" text-anchor="start" fill="#1b1b1b" font-weight="bold">mm</text><rect x="263" y="265.3" width="75" height="12.3" fill="none" stroke="#1b1b1b" stroke-width="0.15"/><text x="264.30" y="268.90" font-size="1.9" text-anchor="start" fill="#666">MATERIAL / الخامة</text><text x="264.30" y="274.50" font-size="1.9" text-anchor="start" fill="#1b1b1b" font-weight="bold">Steel sheet 3 mm, laser cut and folded (proposed)</text><rect x="338" y="265.3" width="25" height="12.3" fill="none" stroke="#1b1b1b" stroke-width="0.15"/><text x="339.30" y="268.90" font-size="1.9" text-anchor="start" fill="#666">DATE / التاريخ</text><text x="339.30" y="274.50" font-size="2.5" text-anchor="start" fill="#1b1b1b" font-weight="bold">11 Nov 2026</text><rect x="363" y="265.3" width="25" height="12.3" fill="none" stroke="#1b1b1b" stroke-width="0.15"/><text x="364.30" y="268.90" font-size="1.9" text-anchor="start" fill="#666">SHEET / لوحة</text><text x="364.30" y="274.50" font-size="2.5" text-anchor="start" fill="#1b1b1b" font-weight="bold">3 / 4</text><rect x="388" y="265.3" width="25" height="12.3" fill="none" stroke="#1b1b1b" stroke-width="0.15"/><text x="389.30" y="268.90" font-size="1.9" text-anchor="start" fill="#666">REV / مراجعة</text><text x="389.30" y="274.50" font-size="2.5" text-anchor="start" fill="#1b1b1b" font-weight="bold">1</text><rect x="263" y="277.6" width="100" height="12.3" fill="none" stroke="#1b1b1b" stroke-width="0.15"/><text x="264.30" y="281.20" font-size="1.9" text-anchor="start" fill="#666">FINISH / التشطيب</text><text x="264.30" y="286.80" font-size="1.9" text-anchor="start" fill="#1b1b1b" font-weight="bold">Satin taupe-brown all over (to be confirmed)</text><rect x="363" y="277.6" width="50" height="12.3" fill="none" stroke="#1b1b1b" stroke-width="0.15"/><text x="364.30" y="281.20" font-size="1.9" text-anchor="start" fill="#666">DRAWN / رسم</text><text x="364.30" y="286.80" font-size="2.5" text-anchor="start" fill="#1b1b1b" font-weight="bold">objekt</text></svg>