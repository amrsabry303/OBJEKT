t drawn in detail.</text><text x="410.00" y="154.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="1.8" font-weight="400" text-anchor="end" fill="#161616">اللوحان متطابقان، أحدهما مدار ١٨٠ درجة. جناح الرف مثني من عتبة الفتحة. أربع قطع تباعد.</text></svg>