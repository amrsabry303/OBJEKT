amily="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.0" font-weight="400" text-anchor="start" fill="#161616">MATERIAL  Stainless sheet 2 mm (proposal), folded</text><text x="318.00" y="274.60" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.0" font-weight="400" text-anchor="end" fill="#161616">الخامة: ستانلس ٢ مم (مقترح)، ثني</text><text x="322.00" y="272.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.1" font-weight="400" text-anchor="start" fill="#161616">FINISH  Brushed stainless (no paint)</text><text x="410.00" y="274.73" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.1" font-weight="400" text-anchor="end" fill="#161616">التشطيب: ستانلس مبروش</text><text x="230.00" y="283.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="400" text-anchor="start" fill="#161616">DATE  12 Nov 2026      SHEET 3 / 5</text><text x="318.00" y="285.99" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="400" text-anchor="end" fill="#161616">التاريخ، الورقة</text><text x="322.00" y="283.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="400" text-anchor="start" fill="#161616">REV  1</text><text x="410.00" y="285.99" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="400" text-anchor="end" fill="#161616">المراجعة</text><rect x="228.00" y="233.00" width="185.00" height="12.00" fill="#fff" stroke="#b3261e" stroke-width="0.5"/><text x="320.50" y="238.40" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.9" font-weight="700" text-anchor="middle" fill="#b3261e">Approved by Sabry 12 Nov 2026. Production review pending. Not engineered</text><text x="320.50" y="243.20" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.9" font-weight="700" text-anchor="middle" fill="#b3261e">معتمد من سبري ١٢ نوفمبر ٢٠٢٦، بانتظار مراجعة التصنيع، غير مهندس</text><text x="10.00" y="14.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="4.2" font-weight="700" text-anchor="start" fill="#161616">ASSEMBLY</text><text x="410.00" y="14.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="4.2" font-weight="700" text-anchor="end" fill="#161616">التجميع</text><text x="10.00" y="22.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="600" text-anchor="start" fill="#161616">EXPLODED VIEW, front, plates moved apart (proposed assembly; Production decides jigs, welds and fixings)</text><text x="410.00" y="22.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="600" text-anchor="end" fill="#161616">منظر مفكك (تجميع مقترح، والتصنيع يقرر)</text><rect x="66.62" y="131.00" width="0.52" height="104.00" fill="#c9cbcd" stroke="#161616" stroke-width="0.35"/><rect x="30.74" y="234.17" width="35.88" height="0.83" fill="#d9dbdc" stroke="#161616" stroke-width="0.35"/><rect x="30.74" y="130.17" width="35.88" height="0.83" fill="#d9dbdc" stroke="#161616" stroke-width="0.35"/><rect x="47.12" y="161.37" width="19.50" height="0.83" fill="#c9cbcd" stroke="#161616" stroke-width="0.35"/><circle cx="52.88" cy="196.00" r="3.2" fill="#fff" stroke="#161616" stroke-width=".3"/><text x="52.88" y="197.10" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="3" font-weight="600" text-anchor="middle" fill="#161616">1</text><rect x="142.86" y="131.00" width="0.52" height="104.00" fill="#c9cbcd" stroke="#161616" stroke-width="0.35"/><rect x="143.38" y="234.17" width="35.88" height="0.83" fill="#d9dbdc" stroke="#161616" stroke-width="0.35"/><rect x="143.38" y="130.17" width="35.88" height="0.83" fill="#d9dbdc" stroke="#161616" stroke-width="0.35"/><rect x="143.38" y="161.37" width="19.50" height="0.83" fill="#c9cbcd" stroke="#161616" stroke-width="0.35"/><circle cx="157.12" cy="196.00" r="3.2" fill="#fff" stroke="#161616" stroke-width=".3"/><text x="157.12" y="197.10" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="3" font-weight="600" text-anchor="middle" fill="#161616">1</text><line x1="73.12" y1="219.40" x2="136.88" y2="219.40" stroke="#2a4a7a" stroke-width="0.2" stroke-dasharray="1 1"/><rect x="95.00" y="218.10" width="20.00" height="2.60" fill="#e6e2d8" stroke="#161616" stroke-width="0.3"/><line x1="73.12" y1="146.60" x2="136.88" y2="146.60" stroke="#2a4a7a" stroke-width="0.2" stroke-dasharray="1 1"/><rect x="95.00" y="145.30" width="20.00" height="2.60" fill="#e6e2d8" stroke="#161616" stroke-width="0.3"/><circle cx="105.00" cy="227.40" r="3.2" fill="#fff" stroke="#161616" stroke-width=".3"/><text x="105.00" y="228.50" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="3" font-weight="600" text-anchor="middle" fill="#161616">2</text><text x="24.00" y="262.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="1.9" font-weight="400" text-anchor="start" fill="#7a7a7a">Items: 1 plate (2 off, identical), 2 tie spacer (4 off). The pot and the plant are not part of objekt.  الأصناف: ١ اللوح (عدد ٢ متطابقان)، ٢ قطعة التباعد (٤).</text><text x="245.00" y="38.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.6" font-weight="600" text-anchor="start" fill="#161616">ASSEMBLY SEQUENCE (proposed)</text><text x="410.00" y="38.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.6" font-weight="600" text-anchor="end" fill="#161616">تسلسل التجميع (مقترح)</text><circle cx="248.00" cy="47.00" r="3.2" fill="#fff" stroke="#161616" stroke-width=".3"/><text x="248.00" y="48.10" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="3" font-weight="600" text-anchor="middle" fill="#161616">1</text><text x="254.00" y="48.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="1.9" font-weight="400" text-anchor="start" fill="#161616">Laser cut two plates (1) from the DXF file; deburr all edges.</text><text x="410.00" y="53.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="1.9" font-weight="400" text-anchor="end" fill="#161616">قص لوحين (١) بالليزر وتنعيم الحواف.</text><circle cx="248.00" cy="64.00" r="3.2" fill="#fff" stroke="#161616" stroke-width=".3"/><text x="248.00" y="65.10" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="3" font-weight="600" text-anchor="middle" fill="#161616">2</text><text x="254.00" y="65.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="1.9" font-weight="400" text-anchor="start" fill="#161616">Fold each plate at the three fold lines: base flange, top flange, shelf flange (all away from the gap).</text><text x="410.00" y="70.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="1.9" font-weight="400" text-anchor="end" fill="#161616">ثني كل لوح عند خطوط الثني الثلاثة، الأجنحة بعيداً عن الفتحة.</text><circle cx="248.00" cy="81.00" r="3.2" fill="#fff" stroke="#161616" stroke-width=".3"/><text x="248.00" y="82.10" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="3" font-weight="600" text-anchor="middle" fill="#161616">3</text><text x="254.00" y="82.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="1.9" font-weight="400" text-anchor="start" fill="#161616">Stand the two plates facing each other with a 22 mm gap (one turned 180 degrees).</text><text x="410.00" y="87.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="1.9" font-weight="400" text-anchor="end" fill="#161616">وضع اللوحين متقابلين بفتحة ٢٢ مم (أحدهما مدار ١٨٠ درجة).</text><circle cx="248.00" cy="98.00" r="3.2" fill="#fff" stroke="#161616" stroke-width=".3"/><text x="248.00" y="99.10" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="3" font-weight="600" text-anchor="middle" fill="#161616">4</text><text x="254.00" y="99.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="1.9" font-weight="400" text-anchor="start" fill="#161616">Fix the four spacers (2) through the leg strips by bolt or weld (Production).</text><text x="410.00" y="104.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="1.9" font-weight="400" text-anchor="end" fill="#161616">تثبيت قطع التباعد الأربع في الأرجل بمسمار أو لحام.</text><circle cx="248.00" cy="115.00" r="3.2" fill="#fff" stroke="#161616" stroke-width=".3"/><text x="248.00" y="116.10" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="3" font-weight="600" text-anchor="middle" fill="#161616">5</text><text x="254.00" y="116.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="1.9" font-weight="400" text-anchor="start" fill="#161616">Brush to one grain; deburr the hole edge. Check the stand sits flat on the floor.</text><text x="410.00" y="121.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="1.9" font-weight="400" text-anchor="end" fill="#161616">تبريش في اتجاه واحد وتنعيم حافة الفتحة والتأكد من ثبات القاعدة.</text></svg>