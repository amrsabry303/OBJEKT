amily="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.0" font-weight="400" text-anchor="start" fill="#161616">MATERIAL  Stainless sheet 2 mm (proposal), folded</text><text x="318.00" y="274.60" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.0" font-weight="400" text-anchor="end" fill="#161616">الخامة: ستانلس ٢ مم (مقترح)، ثني</text><text x="322.00" y="272.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.1" font-weight="400" text-anchor="start" fill="#161616">FINISH  Brushed stainless (no paint)</text><text x="410.00" y="274.73" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.1" font-weight="400" text-anchor="end" fill="#161616">التشطيب: ستانلس مبروش</text><text x="230.00" y="283.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="400" text-anchor="start" fill="#161616">DATE  12 Nov 2026      SHEET 5 / 5</text><text x="318.00" y="285.99" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="400" text-anchor="end" fill="#161616">التاريخ، الورقة</text><text x="322.00" y="283.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="400" text-anchor="start" fill="#161616">REV  1</text><text x="410.00" y="285.99" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="400" text-anchor="end" fill="#161616">المراجعة</text><rect x="228.00" y="233.00" width="185.00" height="12.00" fill="#fff" stroke="#b3261e" stroke-width="0.5"/><text x="320.50" y="238.40" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.9" font-weight="700" text-anchor="middle" fill="#b3261e">Approved by Sabry 12 Nov 2026. Production review pending. Not engineered</text><text x="320.50" y="243.20" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.9" font-weight="700" text-anchor="middle" fill="#b3261e">معتمد من سبري ١٢ نوفمبر ٢٠٢٦، بانتظار مراجعة التصنيع، غير مهندس</text><text x="10.00" y="14.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="4.2" font-weight="700" text-anchor="start" fill="#161616">BILL OF MATERIALS AND NOTES</text><text x="410.00" y="14.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="4.2" font-weight="700" text-anchor="end" fill="#161616">قائمة المواد والملاحظات</text><text x="10.00" y="28.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.8" font-weight="600" text-anchor="start" fill="#161616">BILL OF MATERIALS</text><text x="410.00" y="28.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.8" font-weight="600" text-anchor="end" fill="#161616">قائمة المواد</text><rect x="10.00" y="31.00" width="400.00" height="7.00" fill="#e9e5dc" stroke="#161616" stroke-width="0.3"/><text x="12.00" y="36.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="600" text-anchor="start" fill="#161616">ITEM</text><text x="24.00" y="36.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="600" text-anchor="start" fill="#161616">PART / الجزء</text><text x="150.00" y="36.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="600" text-anchor="start" fill="#161616">QTY / العدد</text><text x="215.00" y="36.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.3" font-weight="600" text-anchor="start" fill="#161616">MATERIAL / الخامة</text><line x1="10.00" y1="46.20" x2="410.00" y2="46.20" stroke="#7a7a7a" stroke-width="0.15"/><text x="12.00" y="44.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">1</text><text x="24.00" y="44.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">Plate with base, top and shelf flanges</text><text x="140.00" y="44.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="end" fill="#161616">اللوح بثلاثة أجنحة</text><text x="150.00" y="44.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">2</text><text x="215.00" y="44.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">Stainless sheet 2 mm (proposal), identical</text><line x1="10.00" y1="53.20" x2="410.00" y2="53.20" stroke="#7a7a7a" stroke-width="0.15"/><text x="12.00" y="51.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">2</text><text x="24.00" y="51.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">Tie spacer Ø10 x 22 + fixing</text><text x="140.00" y="51.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="end" fill="#161616">قطعة تباعد وتثبيت</text><text x="150.00" y="51.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">4</text><text x="215.00" y="51.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="400" text-anchor="start" fill="#161616">Stainless, bought-in or turned (Production)</text><text x="10.00" y="70.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.8" font-weight="600" text-anchor="start" fill="#161616">NOTES</text><text x="410.00" y="70.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.8" font-weight="600" text-anchor="end" fill="#161616">ملاحظات</text><text x="12.00" y="79.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="600" text-anchor="start" fill="#161616">1.</text><text x="18.00" y="79.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.0" font-weight="400" text-anchor="start" fill="#161616">Reference: third-party photos (maker unknown). Drawn as objekt's own design. Layout (Sabry, 12 Nov): gap in the centre, two mirrored halves; rev 0 had off-centre plates and is superseded.</text><text x="410.00" y="84.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.0" font-weight="400" text-anchor="end" fill="#161616">المرجع صور لصانع مجهول. التصميم: فتحة في المنتصف ونصفان متماثلان (سبري).</text><text x="12.00" y="92.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="600" text-anchor="start" fill="#161616">2.</text><text x="18.00" y="92.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.0" font-weight="400" text-anchor="start" fill="#161616">Pot (not ours): 4 L class, rim 200, base 155, height 165 (size-charts.com 4 L pot: 20 cm rim, 15.5 cm base, 16.5 cm high). Hole Ø204; the pot passes both plate windows and stands on the two shelf flanges (Ø176). 19 to 22 cm rims: Production to confirm the hole.</text><text x="410.00" y="97.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.0" font-weight="400" text-anchor="end" fill="#161616">الأصيص ليس من منتجنا. الفتحة ٢٠٤ مم. جناحا الرف قطرهما ١٧٦ مم.</text><text x="12.00" y="105.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="600" text-anchor="start" fill="#161616">3.</text><text x="18.00" y="105.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.0" font-weight="400" text-anchor="start" fill="#161616">Disc, height, 2 mm sheet, gap 22, shelf height 280 and all sizes are a PROPOSAL, not costed, Production to confirm.</text><text x="410.00" y="110.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.0" font-weight="400" text-anchor="end" fill="#161616">كل المقاسات مقترحة ويؤكدها التصنيع.</text><text x="12.00" y="118.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="600" text-anchor="start" fill="#161616">4.</text><text x="18.00" y="118.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.0" font-weight="400" text-anchor="start" fill="#161616">Each plate is a frame of two 48 mm leg strips plus the sill. Production to say if that holds the pot and soil, or if thicker sheet, a cross tie or a heavier shelf bend is needed. No load figure is given.</text><text x="410.00" y="123.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.0" font-weight="400" text-anchor="end" fill="#161616">كل لوح له ساقان ضيقتان. التصنيع يحدد إن كانت كافية. لا أرقام أحمال.</text><text x="12.00" y="131.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="600" text-anchor="start" fill="#161616">5.</text><text x="18.00" y="131.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.0" font-weight="400" text-anchor="start" fill="#161616">Stability: equal base and top diameter, so a downward push on the top disc cannot tip it. Side push and pot weight are Production's to test; heavier base or ballast to confirm. Levelling not needed.</text><text x="410.00" y="136.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.0" font-weight="400" text-anchor="end" fill="#161616">الثبات: قطر القاعدة والسطح متساويان. الاختبار من التصنيع.</text><text x="12.00" y="144.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="600" text-anchor="start" fill="#161616">6.</text><text x="18.00" y="144.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.0" font-weight="400" text-anchor="start" fill="#161616">Finish: brushed stainless, no paint (objekt guide: exposed metal, brushed). Brushing direction and weld finish by Production.</text><text x="410.00" y="149.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.0" font-weight="400" text-anchor="end" fill="#161616">التشطيب: ستانلس مبروش بدون دهان.</text><text x="12.00" y="157.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="600" text-anchor="start" fill="#161616">7.</text><text x="18.00" y="157.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.0" font-weight="400" text-anchor="start" fill="#161616">Material, thickness, bend allowance, tolerances, sheet size, joints, welding and finish details are Production's to decide.</text><text x="410.00" y="162.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.0" font-weight="400" text-anchor="end" fill="#161616">الخامة والسماكة والسماحيات واللحام يقررها التصنيع.</text><text x="12.00" y="170.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="600" text-anchor="start" fill="#161616">8.</text><text x="18.00" y="170.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.0" font-weight="400" text-anchor="start" fill="#161616">No structural claims, stress or load figures, costs or prices. Not engineered. Arabic wording is a draft for a technical reader.</text><text x="410.00" y="175.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.0" font-weight="400" text-anchor="end" fill="#161616">لا ادعاءات إنشائية ولا تكاليف. الصياغة العربية مسودة.</text></svg>