ill="#fff" stroke="#161616" stroke-width=".3"/><text x="248.00" y="48.10" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="3" font-weight="600" text-anchor="middle" fill="#161616">1</text><text x="254.00" y="48.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="1.9" font-weight="400" text-anchor="start" fill="#161616">Laser cut parts 1, 2 and 3 from the DXF files; deburr all edges.</text><text x="410.00" y="53.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="1.9" font-weight="400" text-anchor="end" fill="#161616">قص القطع ١ و٢ و٣ بالليزر وتنعيم الحواف.</text><circle cx="248.00" cy="64.00" r="3.2" fill="#fff" stroke="#161616" stroke-width=".3"/><text x="248.00" y="65.10" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="3" font-weight="600" text-anchor="middle" fill="#161616">2</text><text x="254.00" y="65.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="1.9" font-weight="400" text-anchor="start" fill="#161616">Fold parts 1 and 2 at the two fold lines each: flanges away from the gap.</text><text x="410.00" y="70.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="1.9" font-weight="400" text-anchor="end" fill="#161616">ثني القطعتين ١ و٢ عند خطي الثني، الأجنحة بعيداً عن الفتحة.</text><circle cx="248.00" cy="81.00" r="3.2" fill="#fff" stroke="#161616" stroke-width=".3"/><text x="248.00" y="82.10" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="3" font-weight="600" text-anchor="middle" fill="#161616">3</text><text x="254.00" y="82.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="1.9" font-weight="400" text-anchor="start" fill="#161616">Fold the shelf tab (3) down; join the tab to the near plate under the window at height 280.</text><text x="410.00" y="87.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="1.9" font-weight="400" text-anchor="end" fill="#161616">ثني لسان الرف (٣) للأسفل وتثبيته باللوح القريب عند الارتفاع ٢٨٠.</text><circle cx="248.00" cy="98.00" r="3.2" fill="#fff" stroke="#161616" stroke-width=".3"/><text x="248.00" y="99.10" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="3" font-weight="600" text-anchor="middle" fill="#161616">4</text><text x="254.00" y="99.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="1.9" font-weight="400" text-anchor="start" fill="#161616">Set the 22 mm gap with the four spacers (4); fix by bolt or weld (Production).</text><text x="410.00" y="104.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="1.9" font-weight="400" text-anchor="end" fill="#161616">ضبط الفتحة ٢٢ مم بأربع قطع تباعد وتثبيتها.</text><circle cx="248.00" cy="115.00" r="3.2" fill="#fff" stroke="#161616" stroke-width=".3"/><text x="248.00" y="116.10" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="3" font-weight="600" text-anchor="middle" fill="#161616">5</text><text x="254.00" y="116.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="1.9" font-weight="400" text-anchor="start" fill="#161616">Brush to one grain along the long axis; deburr the hole edge. Check the stand sits flat on the floor.</text><text x="410.00" y="121.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="1.9" font-weight="400" text-anchor="end" fill="#161616">تبريش في اتجاه واحد وتنعيم حافة الفتحة والتأكد من ثبات القاعدة.</text></svg>