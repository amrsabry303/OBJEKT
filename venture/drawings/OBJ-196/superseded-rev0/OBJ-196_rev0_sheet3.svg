00" text-anchor="start" fill="#161616">ASSEMBLY</text><text x="410.00" y="14.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="4.2" font-weight="700" text-anchor="end" fill="#161616">التجميع</text><text x="10.00" y="22.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="600" text-anchor="start" fill="#161616">EXPLODED VIEW, front, parts lifted apart (proposed assembly; Production decides jigs, welds and fixings)</text><text x="410.00" y="22.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="2.4" font-weight="600" text-anchor="end" fill="#161616">منظر مفكك (تجميع مقترح، والتصنيع يقرر)</text><rect x="111.06" y="131.00" width="0.52" height="104.00" fill="#c9cbcd" stroke="#161616" stroke-width="0.35"/><rect x="51.00" y="234.17" width="60.06" height="0.83" fill="#d9dbdc" stroke="#161616" stroke-width="0.35"/><rect x="51.00" y="234.17" width="60.06" height="0.83" fill="#d9dbdc" stroke="#161616" stroke-width="0.35"/><rect x="51.00" y="130.17" width="60.06" height="0.83" fill="#d9dbdc" stroke="#161616" stroke-width="0.35"/><rect x="111.06" y="131.00" width="0.52" height="104.00" fill="#c9cbcd" stroke="#161616" stroke-width="0.35"/><rect x="187.30" y="234.17" width="11.70" height="0.83" fill="#d9dbdc" stroke="#161616" stroke-width="0.35"/><rect x="187.30" y="130.17" width="11.70" height="0.83" fill="#d9dbdc" stroke="#161616" stroke-width="0.35"/><rect x="187.30" y="131.00" width="0.52" height="104.00" fill="#c9cbcd" stroke="#161616" stroke-width="0.35"/><rect x="67.12" y="137.97" width="43.68" height="0.83" fill="#c9cbcd" stroke="#161616" stroke-width="0.35"/><rect x="110.28" y="138.80" width="0.52" height="5.20" fill="#c9cbcd" stroke="#161616" stroke-width="0.3"/><line x1="110.80" y1="144.00" x2="110.80" y2="162.20" stroke="#7a7a7a" stroke-width="0.2" stroke-dasharray="1 1"/><line x1="111.58" y1="219.40" x2="187.30" y2="219.40" stroke="#2a4a7a" stroke-width="0.2" stroke-dasharray="1 1"/><rect x="112.08" y="21