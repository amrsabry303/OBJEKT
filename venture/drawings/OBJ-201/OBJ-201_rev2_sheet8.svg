 each plate at the three fold lines: base flange, top flange, shelf flange (all away from the gap).</text><text x="410.00" y="78.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="1.9" font-weight="400" text-anchor="end" fill="#161616">ثني كل لوح عند خطوط الثني الثلاثة، الأجنحة بعيداً عن الفتحة.</text><circle cx="235.00" cy="89.00" r="3.2" fill="#fff" stroke="#161616" stroke-width=".3"/><text x="235.00" y="90.10" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="3" font-weight="600" text-anchor="middle" fill="#161616">3</text><text x="241.00" y="90.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="1.9" font-weight="400" text-anchor="start" fill="#161616">Stand the two plates facing each other with a 22 mm gap (one turned 180 degrees).</text><text x="410.00" y="95.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="1.9" font-weight="400" text-anchor="end" fill="#161616">وضع اللوحين متقابلين بفتحة ٢٢ مم (أحدهما مدار ١٨٠ درجة).</text><circle cx="235.00" cy="106.00" r="3.2" fill="#fff" stroke="#161616" stroke-width=".3"/><text x="235.00" y="107.10" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="3" font-weight="600" text-anchor="middle" fill="#161616">4</text><text x="241.00" y="107.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="1.9" font-weight="400" text-anchor="start" fill="#161616">Fix the four spacers (2) through the leg strips by bolt or weld (Production).</text><text x="410.00" y="112.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="1.9" font-weight="400" text-anchor="end" fill="#161616">تثبيت قطع التباعد الأربع في الأرجل بمسمار أو لحام.</text><circle cx="235.00" cy="123.00" r="3.2" fill="#fff" stroke="#161616" stroke-width=".3"/><text x="235.00" y="124.10" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="3" font-weight="600" text-anchor="middle" fill="#161616">5</text><text x="241.00" y="124.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="1.9" font-weight="400" text-anchor="start" fill="#161616">Brush to one grain; deburr the hole edge. Check the stand sits flat on the floor.</text><text x="410.00" y="129.00" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="1.9" font-weight="400" text-anchor="end" fill="#161616">تبريش في اتجاه واحد وتنعيم حافة الفتحة والتأكد من ثبات القاعدة.</text></svg>