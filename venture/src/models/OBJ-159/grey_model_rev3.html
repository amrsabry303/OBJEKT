  const s=new THREE.Shape(); s.moveTo(-hw,y0); s.lineTo(hw,y0); s.lineTo(hw,OH-rc); s.absarc(hw-rc,OH-rc,rc,0,Math.PI/2,false); s.lineTo(-hw+rc,OH); s.absarc(-hw+rc,OH-rc,rc,Math.PI/2,Math.PI,false); s.lineTo(-hw,y0);

// foot tabs, bend blocks, weld nuts, levelling feet (two per plate)

}
