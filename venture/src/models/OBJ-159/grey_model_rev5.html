import * as THREE from 'three';
// OBJ-159 rev 5 geometry, mm. three: x width, y height, z depth (front = +z). Plain matt grey, no texture.

const TOPF=OH-25, BOTF=125, PITCH=(TOPF-BOTF)/(NSH-1), SLOT_OFF=FL+(PITCH-FL)/2;

const root=new THREE.Group(); scene.add(root);

  const s=new THREE.Shape(); s.moveTo(-hw,y0); s.lineTo(hw,y0); s.lineTo(hw,OH-rc); s.absarc(hw-rc,OH-rc,rc,0,Math.PI/2,false); s.lineTo(-hw+rc,OH); s.absarc(-hw+rc,OH-rc,rc,Math.PI/2,Math.PI,false); s.lineTo(-hw,y0);

for(const side of [0,1]) for(const u of [70,OD-70]){                       // foot tabs, bend blocks, weld nuts, feet
  const z=zc(u), xa=side?OW-60:0, xb=side?OW:60, fx=side?OW-35:35;

}
SHELF_TOP.forEach(h=>{                                                      // shelf = hollow folded slab, rests on the ledge tabs
  const xl=TP+CL, xr=OW-TP-CL, t=TS;
  box(xl,xr,h-t,h,-OD/2,OD/2);                                              // top

  for(const u of SUP_U){ box(TP,TP+SUP_LEG,h-FL-TP,h-FL,zc(u)-SUP_W/2,zc(u)+SUP_W/2); box(OW-TP-SUP_LEG,OW-TP,h-FL-TP,h-FL,zc(u)-SUP_W/2,zc(u)+SUP_W/2); }   // ledge tabs
});
for(const f of TIE_F){                                                      // rear tie bars with end flaps, screw heads outside
  const xl=TP+CL, xr=OW-TP-CL;
  box(xl,xr,f-TIE_H/2,f+TIE_H/2,-OD/2,-OD/2+TP);
  box(xl,xl+TP,f-TIE_H/2,f+TIE_H/2,-OD/2,-OD/2+30); box(xr-TP,xr,f-TIE_H/2,f+TIE_H/2,-OD/2,-OD/2+30);

scene.add(new THREE.HemisphereLight(0xffffff,0xd8d8d4,1.15));
const sun=new THREE.DirectionalLight(0xffffff,1.6); sun.position.set(-1500,3200,2600); sun.castShadow=true;
sun.shadow.mapSize.set(4096,4096); const sc=sun.shadow.camera; sc.left=-1800;sc.right=1800;sc.top=2600;sc.bottom=-800;sc.near=100;sc.far=9000; sun.shadow.radius=6; sun.shadow.bias=-0.0004; scene.add(sun);
const fill=new THREE.DirectionalLight(0xffffff,.5); fill.position.set(2500,1200,1800); scene.add(fill);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(20000,20000),new THREE.MeshStandardMaterial({color:0xe2e2df,roughness:1}));
floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; scene.add(floor);
const ren=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true}); ren.shadowMap.enabled=true; ren.shadowMap.type=THREE.PCFSoftShadowMap; ren.toneMapping=THREE.ACESFilmicToneMapping; ren.toneMappingExposure=1.05;

</script>
