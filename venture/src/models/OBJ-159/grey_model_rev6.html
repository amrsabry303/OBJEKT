<script type="module">
import * as THREE from 'three';
// OBJ-159 rev 5 geometry, mm. three: x width, y height, z depth (front = +z). Plain matt grey, no texture.
const IN=25.4, OH=74*IN, OW=34*IN, OD=14*IN, TP=4, TS=3, SHT=1.25*IN, FL=SHT, R=125, NSH=6;
const TOPF=OH-25, BOTF=125, PITCH=(TOPF-BOTF)/(NSH-1), SLOT_OFF=FL+(PITCH-FL)/2, HOLE_U=[80,OD-80], DROP=15;
const SHELF_TOP=[...Array(NSH).keys()].map(k=>TOPF-PITCH*k);
const grey=new THREE.MeshStandardMaterial({color:0xb2b2b0,roughness:.92,metalness:0});
const scene=new THREE.Scene(); scene.background=new THREE.Color(0xe9e9e7);
const root=new THREE.Group(); scene.add(root);
function box(x0,x1,y0,y1,z0,z1){const m=new THREE.Mesh(new THREE.BoxGeometry(x1-x0,y1-y0,z1-z0),grey);m.position.set((x0+x1)/2,(y0+y1)/2,(z0+z1)/2);m.castShadow=m.receiveShadow=true;root.add(m);return m}
function cyl(r,h,x,y,z,axis='y',seg=48){const g=new THREE.CylinderGeometry(r,r,h,seg);const m=new THREE.Mesh(g,grey);if(axis==='x')m.rotation.z=Math.PI/2;m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;root.add(m);return m}
const zc=u=>OD/2-u;
function plate(xo){                                                         // flat plate standing on its own bottom edge
  const hw=OD/2, rc=10;
  const s=new THREE.Shape(); s.moveTo(-hw,0); s.lineTo(hw,0); s.lineTo(hw,OH-rc); s.absarc(hw-rc,OH-rc,rc,0,Math.PI/2,false); s.lineTo(-hw+rc,OH); s.absarc(-hw+rc,OH-rc,rc,Math.PI/2,Math.PI,false); s.lineTo(-hw,0);
  SHELF_TOP.forEach((t,i)=>{
    if(i<5){const c=new THREE.Path(); c.absarc(0,t-SLOT_OFF,R,0,Math.PI*2,true); s.holes.push(c);}
    for(const u of HOLE_U){const hh=new THREE.Path(); hh.absarc(zc(u),t-DROP,3.25,0,Math.PI*2,true); s.holes.push(hh);}
  });
  const g=new THREE.ExtrudeGeometry(s,{depth:TP,bevelEnabled:false,curveSegments:64}); g.rotateY(-Math.PI/2); g.translate(xo+TP,0,0);
  const m=new THREE.Mesh(g,grey); m.castShadow=m.receiveShadow=true; root.add(m);
}
plate(0); plate(OW-TP);
SHELF_TOP.forEach((h,i)=>{                                                  // shelf = hollow folded slab, end flaps screwed to the plates
  const xl=TP, xr=OW-TP, t=TS;
  box(xl,xr,h-t,h,-OD/2,OD/2);
  box(xl,xr,h-FL,h,OD/2-t,OD/2); box(xl,xr,h-FL,h,-OD/2,-OD/2+t);
  box(xl,xl+t,h-FL,h,-OD/2+1.5,OD/2-1.5); box(xr-t,xr,h-FL,h,-OD/2+1.5,OD/2-1.5);
  for(const u of HOLE_U){ cyl(5.5,3,-1.5,h-DROP,zc(u),'x',32); cyl(5.5,3,OW+1.5,h-DROP,zc(u),'x',32); }   // visible button-head screws
});
scene.add(new THREE.HemisphereLight(0xffffff,0xd8d8d4,1.15));
const sun=new THREE.DirectionalLight(0xffffff,1.6); sun.position.set(-1500,3200,2600); sun.castShadow=true;
sun.shadow.mapSize.set(4096,4096); const sc=sun.shadow.camera; sc.left=-1800;sc.right=1800;sc.top=2600;sc.bottom=-800;sc.near=100;sc.far=9000; sun.shadow.radius=6; sun.shadow.bias=-0.0004; scene.add(sun);
const fill=new THREE.DirectionalLight(0xffffff,.5); fill.position.set(2500,1200,1800); scene.add(fill);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(20000,20000),new THREE.MeshStandardMaterial({color:0xe2e2df,roughness:1}));
floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; scene.add(floor);
const ren=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true}); ren.shadowMap.enabled=true; ren.shadowMap.type=THREE.PCFSoftShadowMap; ren.toneMapping=THREE.ACESFilmicToneMapping; ren.toneMappingExposure=1.05;
document.body.appendChild(ren.domElement);
window.shot=(W,H,fov,pos,tgt)=>{ren.setSize(W,H);const cam=fov<0?new THREE.OrthographicCamera(-(-fov)*W/H/2,(-fov)*W/H/2,(-fov)/2,-(-fov)/2,10,60000):new THREE.PerspectiveCamera(fov,W/H,10,60000);cam.position.set(...pos);cam.lookAt(...tgt);ren.render(scene,cam);return ren.domElement.toDataURL('image/png')};
window.ready=true;
</script>
